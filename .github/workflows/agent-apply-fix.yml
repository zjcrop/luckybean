name: Apply cold OCR parity fix

on:
  push:
    branches: [agent/cold-brew-ocr-parity-fix]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/cold-brew-ocr-parity-fix
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: node scripts/apply-cold-ocr-parity-fix.mjs
      - run: |
          grep -Fq 'showRecognitionEvidence: false' src/app.js
          grep -Fq 'recognitionProvenance:' src/app.js
          grep -Fq 'source_app_sha=' .github/workflows/build-main.yml
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'LuckyBean Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app.js .github/workflows/build-main.yml
          git commit -m 'fix: close OCR review state and enforce APK web parity [agent-patch-applied]'
          git push origin HEAD:agent/cold-brew-ocr-parity-fix
