name: Align legacy reminder test contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-legacy-reminder-tests.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align only stale test and release-contract assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = '1.24B-main.13-local-menu-prompt'
          new = '1.24B-main.14-legacy-reminders'
          old_re = r'1\.24B-main\.13-local-menu-prompt'
          new_re = r'1\.24B-main\.14-legacy-reminders'
          changed=[]
          for path in Path('tests').rglob('*.mjs'):
              text=path.read_text()
              lines=[]
              touched=False
              for line in text.splitlines(keepends=True):
                  original=line
                  runtime_context=any(token in line for token in [
                      'startup-controller','APP_MODULE_REVISION','appModuleRevision','app_module_revision',
                      'PROMPT_RUNTIME_REVISION','app.js?v','app-runtime','legacy-reminders'
                  ]) and not any(token in line for token in ['styles.css','stylesRevision','styles_revision'])
                  if runtime_context:
                      line=line.replace(old,new).replace(old_re,new_re)
                  line=line.replace('fun-only-native-app-toast','legacy-short-reminder-current-mode-adapter')
                  line=line.replace('Live Pages native prompt browser smoke','Live Pages five-mode legacy reminder browser smoke')
                  line=line.replace('Verify published fun-prompt runtime URLs exactly','Verify published legacy-reminder runtime URLs exactly')
                  if line!=original:touched=True
                  lines.append(line)
              if touched:
                  path.write_text(''.join(lines))
                  changed.append(str(path))
          print('changed test contracts:')
          print('\n'.join(changed) if changed else '(none)')
          PY
          grep -R -n 'startup-controller.*main\\.13-local-menu-prompt\|APP_MODULE_REVISION.*main\\.13-local-menu-prompt\|appModuleRevision.*main\\.13-local-menu-prompt' tests || true
      - name: Validate static suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:static
          git diff --check
      - name: Commit test-contract alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git diff --cached --quiet && exit 0
          git commit -m 'Align tests with legacy reminder runtime revision'
          git push origin HEAD:main
