name: LuckyBean 1.0 Online Shell Test

on:
  push:
    branches:
      - android/v1-online-shell
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: luckybean-v1-online-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: android/v1-online-shell

      - name: Apply native OCR integration patch
        run: python3 tools/apply_online_shell_native_ocr.py

      - name: Apply sensory account and startup fixes
        run: python3 tools/apply_online_shell_v103_fixes.py

      - name: Apply legacy cloud password migration guard
        run: python3 tools/apply_online_shell_cloud_password_migration.py

      - name: Prepare literal JavaScript patch replacements
        run: python3 tools/prepare_online_shell_v105_patch_helpers.py

      - name: Apply label-aware parser form and flavor fixes
        run: python3 tools/apply_online_shell_v105_data_ui.py

      - name: Enforce explicit OCR label precedence
        run: python3 tools/apply_online_shell_v105_parser_precedence.py

      - name: Apply independent sensory workflows
        run: python3 tools/apply_online_shell_v105_sensory.py

      - name: Package all public illustrations locally
        run: python3 tools/apply_online_shell_v105_assets.py

      - name: Prepare v106 verifier keys
        run: python3 tools/prepare_online_shell_v106_verifier.py

      - name: Apply private brew profile and backup lifecycle
        run: python3 tools/apply_online_shell_v106_web.py

      - name: Apply startup watchdog and Android backup rules
        run: python3 tools/apply_online_shell_v106_android.py

      - name: Package v106 dependency modules
        run: python3 tools/apply_online_shell_v106_asset_dependencies.py

      - name: Set internal test version
        run: python3 tools/bump_online_shell_v106_version.py

      - name: Verify patched Web modules and fixtures
        run: |
          node --check src/app.js
          node --check src/codebook.js
          node --check src/db.js
          node --check src/brew-engine.js
          node --check src/v106-native-backup.js
          node --check src/v106-brew-profile-service.js
          node --check src/v095-sensory-pro.js
          node --check src/v095-sensory-bootstrap.js
          node --check src/v095-sensory-flow-guard.js
          node --check src/v099f-cloud-sync.js
          node --check src/v099p-settings-rebuild.js
          grep -q "beanHarvestYear" src/app.js
          grep -q "coded-custom-input" src/app.js
          grep -q "flavor-accordion" src/app.js
          grep -q "restoreNativeBackupIfNeeded" src/app.js
          grep -q "syncBrewProfilesBtn" src/app.js
          grep -q "luckybean:data-changed" src/db.js
          grep -q "requestSyncedBrewPlan" src/brew-engine.js
          grep -q "brew-plan-v21" src/v106-brew-profile-service.js
          grep -q "CACHE_MAX_AGE_MS" src/v106-brew-profile-service.js
          grep -q "SNAPSHOT_FORMAT" src/v106-native-backup.js
          grep -q "烘焙时间" src/codebook.js
          grep -q "parseRoastDateValue" src/codebook.js
          grep -q "result\[customField\] = labeledValue" src/codebook.js
          grep -q "杯测品鉴" src/v095-sensory-pro.js
          grep -q "independent-note-v105" src/v095-sensory-pro.js
          grep -q "independent-cupping-v105" src/v095-sensory-pro.js
          grep -q "independent-v3" src/v095-sensory-bootstrap.js
          grep -q "verifyLoginPassword" src/v099f-cloud-sync.js
          grep -q "key_mode: 'login-password-v1'" src/v099f-cloud-sync.js
          grep -q "include 'public/\*\*'" android/app/build.gradle
          grep -q "include 'src/v106-native-backup.js'" android/app/build.gradle
          grep -q "include 'src/v106-brew-profile-service.js'" android/app/build.gradle
          grep -q "relative.startsWith(\"public/\")" android/app/src/main/java/com/luckybean/app/LocalWebAssetCache.java
          grep -q "scheduleLaunchOverlayWatchdog" android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q "shell=100106" android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q "saveBackupSnapshot" android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q "dataExtractionRules=\"@xml/data_extraction_rules\"" android/app/src/main/AndroidManifest.xml
          grep -q "luckybean-backup/" android/app/src/main/res/xml/backup_rules.xml
          grep -q "luckybean-backup/" android/app/src/main/res/xml/data_extraction_rules.xml
          grep -q "versionCode 100106" android/app/build.gradle
          grep -q "versionName '1.0.6-online-test'" android/app/build.gradle
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { parseNaturalLanguage } = await import('./src/codebook.js');
          const { listBrewProfiles, brewProfileSyncStatus } = await import('./src/brew-engine.js');
          const book = {
            countries: [['ET','埃塞俄比亚','Ethiopia']],
            regions: [['RG-SID','ET','西达摩','Sidama']],
            entities: [],
            varieties: [['VR-G1','G1','G1']],
            processes: [['PR-WASH','水洗','Washed']],
            flavors: [['FV-JAS','茉莉','Jasmine'],['FV-TEA','茶感','Tea']]
          };
          const text = `【正面主体】\n埃塞俄比亚“Mysterious forest” G1\n产季:26产季\n豆种:74110\n产区:西达摩\n处理法:水洗\n烘焙时间:26.727\n烘焙商:山丘咖啡\n风味:茉莉、白玉兰`;
          const result = parseNaturalLanguage(text, book);
          assert.equal(result.countryCode, 'ET');
          assert.equal(result.regionCode, 'RG-SID');
          assert.equal(result.processCode, 'PR-WASH');
          assert.equal(result.varietyCode, undefined);
          assert.equal(result.varietyCustomName, '74110');
          assert.equal(result.harvestYear, 2026);
          assert.equal(result.roastDate, '2026-07-27');
          assert.equal(result.roasterName, '山丘咖啡');
          assert.ok(result.flavorCodes.includes('FV-JAS'));
          assert.ok(result.customFlavorNames.includes('白玉兰'));
          const profiles = listBrewProfiles();
          assert.ok(profiles.some(profile => profile.id === 'recommended'));
          assert.ok(profiles.some(profile => profile.id === 'four-six-33666'));
          assert.equal(brewProfileSyncStatus().authenticated, false);
          console.log('v106 parser and profile fixtures passed');
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable online-shell test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: luckybean-online-shell-debug-keystore-v1

      - name: Build online-shell debug APK
        run: gradle --no-daemon --stacktrace -p android clean assembleDebug

      - name: Verify APK signature version backup and local assets
        shell: bash
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signing-cert.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='100106'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionName='1.0.6-online-test-debug'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'android:allowBackup'
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -q 'assets/web-cache/src/app.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/codebook.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/db.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/brew-engine.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/v106-native-backup.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/v106-brew-profile-service.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/v095-sensory-pro.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/public/splash-art-red.webp'
          unzip -l "$apk" | grep -q 'assets/web-cache/public/settings-mascot.webp'
          public_count=$(unzip -l "$apk" | grep -c 'assets/web-cache/public/' || true)
          test "$public_count" -ge 5
          mkdir -p artifacts
          cp "$apk" artifacts/LuckyBean-1.0.6-startup-profiles-backup-test.apk
          cp signing-cert.txt artifacts/SIGNING-CERTIFICATE.txt
          sha256sum artifacts/LuckyBean-1.0.6-startup-profiles-backup-test.apk > artifacts/SHA256SUMS.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v1-online-shell-v106-test
          path: artifacts/
          if-no-files-found: error
