name: LuckyBean 1.0 Online Shell Test

on:
  push:
    branches:
      - android/v1-online-shell
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: luckybean-v1-online-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: android/v1-online-shell

      - name: Apply native OCR integration patch
        run: python3 tools/apply_online_shell_native_ocr.py

      - name: Apply sensory account and startup fixes
        run: python3 tools/apply_online_shell_v103_fixes.py

      - name: Set internal test version
        run: python3 tools/bump_online_shell_v103_version.py

      - name: Verify patched Web modules and package version
        run: |
          node --check src/app.js
          node --check src/v095-sensory-pro.js
          node --check src/v095-sensory-flow-guard.js
          node --check src/v099f-cloud-sync.js
          node --check src/v099p-settings-rebuild.js
          grep -q "state.evaluation = null; switchPage('sensory')" src/app.js
          grep -q "verifyLoginPassword" src/v099f-cloud-sync.js
          grep -q "LocalWebAssetCache.open" android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q "versionCode 100103" android/app/build.gradle
          grep -q "versionName '1.0.3-online-test'" android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build online-shell debug APK
        run: gradle --no-daemon --stacktrace -p android clean assembleDebug

      - name: Verify APK signature contents and local cache
        shell: bash
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='100103'"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionName='1.0.3-online-test-debug'"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -q 'assets/web-cache/src/app.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/v095-sensory-pro.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/v099f-cloud-sync.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/public/splash-art-red.webp'
          mkdir -p artifacts
          cp "$apk" artifacts/LuckyBean-1.0.3-online-shell-ui-stability-test.apk
          sha256sum artifacts/LuckyBean-1.0.3-online-shell-ui-stability-test.apk > artifacts/SHA256SUMS.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v1-online-shell-ui-stability-test
          path: artifacts/
          if-no-files-found: error
