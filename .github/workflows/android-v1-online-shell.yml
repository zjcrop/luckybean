name: LuckyBean 1.0 Online Shell Test

on:
  push:
    branches:
      - android/v1-online-shell
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: luckybean-v1-online-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: android/v1-online-shell
          fetch-depth: 0

      - name: Apply native OCR integration patch
        run: python3 tools/apply_online_shell_native_ocr.py

      - name: Commit native OCR integration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Native OCR integration already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/build.gradle android/app/src/main/java/com/luckybean/app/MainActivity.java
            git commit -m "feat(android): route package OCR through bundled native Chinese model"
            git push origin HEAD:android/v1-online-shell
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build online-shell debug APK
        run: gradle --no-daemon --stacktrace -p android clean assembleDebug

      - name: Verify APK signature and contents
        shell: bash
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          unzip -t "$apk" >/dev/null
          mkdir -p artifacts
          cp "$apk" artifacts/LuckyBean-1.0.2-online-shell-native-ocr-test.apk
          sha256sum artifacts/LuckyBean-1.0.2-online-shell-native-ocr-test.apk > artifacts/SHA256SUMS.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v1-online-shell-native-ocr-test
          path: artifacts/
          if-no-files-found: error
