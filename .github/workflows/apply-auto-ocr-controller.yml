name: Apply authoritative package auto OCR patch

on:
  push:
    branches:
      - fix/auto-ocr-all-image-entry-20260909

permissions:
  contents: write

jobs:
  patch-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/auto-ocr-all-image-entry-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Patch package capture controller and tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const controllerPath = 'src/package-capture-controller.js';
          let source = fs.readFileSync(controllerPath, 'utf8');
          if (source.includes('luckybean:package-auto-recognition-start')) {
            console.log('authoritative auto OCR patch already applied');
            process.exit(0);
          }

          source = source.replace("let recognitionQueued = false;\n", '');
          source = source.replace("  recognitionQueued = false; disposeBrowserOcr();\n", "  disposeBrowserOcr();\n");
          source = source.replace("  return '已具备多视角照片，可以开始识别；低质量照片仍建议重拍。';", "  return '已具备多视角照片，系统会自动识别；低质量照片仍建议重拍。';");
          source = source.replace(/\n\s*<button id="bagRecognizeBtn"[^\n]*<\/button>/, '');

          const oldAddFiles = `async function addFiles(fileList) {
  const files = [...(fileList || [])].filter(file => file.type.startsWith('image/')).slice(0, MAX_IMAGES - captureState.images.length);
  if (!files.length) return;
  captureState.busy = true; render();
  try {
    for (const file of files) {
      const prepared = await preparePackageImage(file); const role = nextRole();
      const id = \`bag_\${Date.now().toString(36)}_\${Math.random().toString(36).slice(2, 8)}\`;
      const nativeSource = Boolean(prepared.nativeSource); const nativePreview = bindAndroidImageSource(id, nativeSource);
      const previewUrl = nativeSource ? nativePreview : URL.createObjectURL(prepared.blob); const warnings = [...(prepared.warnings || [])];
      if (nativeSource && !nativePreview) warnings.push('Android 原图已绑定；缩略预览生成失败，但本地 OCR 仍可直接读取原图。');
      captureState.images.push({ id, role, roleLabel:roleLabel(role), blob:prepared.blob, previewUrl, previewAvailable:Boolean(previewUrl), previewReleased:false, nativeSource,
        score:prepared.score, status:prepared.status, warnings, processedWidth:prepared.processedWidth, processedHeight:prepared.processedHeight, metrics:prepared.metrics });
    }
  } catch (error) { captureState.ocrText = \`图片处理失败：\${error.message}\`; captureState.ocrEngine = '错误'; }
  finally { captureState.busy = false; render(); }
}`;

          const newAddFiles = `async function addFiles(fileList) {
  const files = [...(fileList || [])].filter(file => file.type.startsWith('image/')).slice(0, MAX_IMAGES - captureState.images.length);
  if (!files.length) return;
  let addedCount = 0;
  captureState.busy = true; render();
  try {
    for (const file of files) {
      const prepared = await preparePackageImage(file); const role = nextRole();
      const id = \`bag_\${Date.now().toString(36)}_\${Math.random().toString(36).slice(2, 8)}\`;
      const nativeSource = Boolean(prepared.nativeSource); const nativePreview = bindAndroidImageSource(id, nativeSource);
      const previewUrl = nativeSource ? nativePreview : URL.createObjectURL(prepared.blob); const warnings = [...(prepared.warnings || [])];
      if (nativeSource && !nativePreview) warnings.push('Android 原图已绑定；缩略预览生成失败，但本地 OCR 仍可直接读取原图。');
      captureState.images.push({ id, role, roleLabel:roleLabel(role), blob:prepared.blob, previewUrl, previewAvailable:Boolean(previewUrl), previewReleased:false, nativeSource,
        score:prepared.score, status:prepared.status, warnings, processedWidth:prepared.processedWidth, processedHeight:prepared.processedHeight, metrics:prepared.metrics });
      addedCount += 1;
    }
  } catch (error) { captureState.ocrText = \`图片处理失败：\${error.message}\`; captureState.ocrEngine = '错误'; }
  finally { captureState.busy = false; render(); }
  if (addedCount > 0) {
    document.dispatchEvent(new CustomEvent('luckybean:package-auto-recognition-start', { detail:{ source:'image-entry', addedCount } }));
    void runRecognition();
  }
}`;
          if (!source.includes(oldAddFiles)) throw new Error('addFiles source contract changed; refusing unsafe patch');
          source = source.replace(oldAddFiles, newAddFiles);

          source = source.replace(/\nfunction interceptRecognitionClick\(event\) \{[\s\S]*?\n\}/, '');
          source = source.replace("\ndocument.addEventListener('click', interceptRecognitionClick, true);", '');
          if (source.includes('bagRecognizeBtn') || source.includes('interceptRecognitionClick') || source.includes('recognitionQueued')) {
            throw new Error('manual recognition remnants remain after patch');
          }
          fs.writeFileSync(controllerPath, source);

          const polishPath = 'src/ui/package-capture-flow-polish.js';
          let polish = fs.readFileSync(polishPath, 'utf8');
          const marker = 'let autoRecognitionTimer = 0;';
          const markerIndex = polish.indexOf(marker);
          if (markerIndex >= 0) {
            const suffixIndex = polish.indexOf("if (typeof document !== 'undefined')", markerIndex);
            const exportIndex = polish.indexOf('export {', suffixIndex);
            if (suffixIndex < 0 || exportIndex < 0) throw new Error('flow polish structure changed');
            const installBlock = `if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', installJarcDisplayNormalizer, { once:true });
  else installJarcDisplayNormalizer();
}

`;
            polish = polish.slice(0, markerIndex) + installBlock + `export { normalizeJarcDisplayText };\n`;
          }
          fs.writeFileSync(polishPath, polish);

          const staticPath = 'test/package-capture-flow-polish.test.js';
          fs.writeFileSync(staticPath, `import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import path from 'node:path';
import { fileURLToPath } from 'node:url';
import { normalizeJarcDisplayText } from '../src/ui/package-capture-flow-polish.js';

const here = path.dirname(fileURLToPath(import.meta.url));
const root = path.resolve(here, '..');

test('JARC numeric varieties are shortened only for display text', () => {
  assert.equal(normalizeJarcDisplayText('JARC 74110'), '74110');
  assert.equal(normalizeJarcDisplayText('Jarc-74158'), '74158');
  assert.equal(normalizeJarcDisplayText('埃塞 / JARC 74112 / 水洗'), '埃塞 / 74112 / 水洗');
  assert.equal(normalizeJarcDisplayText('JARC Selection'), 'JARC Selection');
});

test('package controller automatically starts OCR after every successful image entry', () => {
  const controller = fs.readFileSync(path.join(root, 'src/package-capture-controller.js'), 'utf8');
  assert.match(controller, /let addedCount = 0/);
  assert.match(controller, /addedCount \+= 1/);
  assert.match(controller, /luckybean:package-auto-recognition-start/);
  assert.match(controller, /void runRecognition\(\)/);
  assert.doesNotMatch(controller, /bagRecognizeBtn/);
  assert.doesNotMatch(controller, /interceptRecognitionClick/);
});

test('camera, small upload and cropped upload all converge on addFiles', () => {
  const controller = fs.readFileSync(path.join(root, 'src/package-capture-controller.js'), 'utf8');
  assert.match(controller, /#bagCameraInput[^\\n]*addFiles\(event\.target\.files\)/);
  assert.match(controller, /processed\?\.length\) await addFiles\(processed\)/);
});

test('flow polish retains JARC formatting only and does not own OCR triggering', () => {
  const source = fs.readFileSync(path.join(root, 'src/ui/package-capture-flow-polish.js'), 'utf8');
  assert.doesNotMatch(source, /queueAutomaticRecognition/);
  assert.doesNotMatch(source, /bagRecognizeBtn/);
});

test('production html loads the flow polish controller', () => {
  const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
  assert.match(html, /src\\/ui\\/package-capture-flow-polish\\.js/);
});
`);

          const smokePath = 'tests/v124p-gallery-upload-flow.spec.mjs';
          let smoke = fs.readFileSync(smokePath, 'utf8');
          smoke = smoke.replace(/async function installAutoOcrProbe\(page\) \{[\s\S]*?\n\}\n\nasync function expectAutoOcr\(page, expected = 1\) \{[\s\S]*?\n\}\n/, `async function installAutoOcrProbe(page) {
  await page.evaluate(() => {
    globalThis.__luckyBeanAutoOcrStarts = 0;
    document.addEventListener('luckybean:package-auto-recognition-start', () => {
      globalThis.__luckyBeanAutoOcrStarts += 1;
    });
  });
}

async function expectAutoOcr(page, expected = 1) {
  await expect.poll(() => page.evaluate(() => Number(globalThis.__luckyBeanAutoOcrStarts || 0)), { timeout:10_000 }).toBe(expected);
  await expect(page.locator('#bagRecognizeBtn')).toHaveCount(0);
}
`);
          fs.writeFileSync(smokePath, smoke);
          NODE
      - name: Commit authoritative patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No controller changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/package-capture-controller.js src/ui/package-capture-flow-polish.js test/package-capture-flow-polish.test.js tests/v124p-gallery-upload-flow.spec.mjs
          git commit -m "Move package auto OCR into authoritative controller"
          git push origin HEAD:fix/auto-ocr-all-image-entry-20260909
