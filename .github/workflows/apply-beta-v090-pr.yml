name: Apply Lucky Bean Beta v0.9 PR Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.apply-v090-trigger'
      - 'release/v090/**'

permissions:
  contents: write

concurrency:
  group: luckybean-beta-v090-pr-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.title == 'chore(beta): apply Lucky Bean v0.9.0-beta.1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify v0.8 baseline and staged patch
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0-beta.1') process.exit(1)"
          test "$(find release/v090 -name 'part*.b64' | wc -l)" -eq 6
          cat release/v090/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/luckybean-v090.patch.xz
          echo 'e738e1498ddfd2e40cdc52959a589760a6310ca6f022c5e3cd7b48b122a1df7f  /tmp/luckybean-v090.patch.xz' | sha256sum -c -
          xz -dc /tmp/luckybean-v090.patch.xz > /tmp/luckybean-v090.patch
          echo 'a7f4303defc686cdf9aa0421d4b973ec42bd4e4fe91655723a85bfa130baf3e6  /tmp/luckybean-v090.patch' | sha256sum -c -
          git apply --check /tmp/luckybean-v090.patch
          git apply /tmp/luckybean-v090.patch

      - name: Validate reconstructed v0.9 source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json'); if(p.version!=='0.9.0-beta.1') process.exit(1)"
          test -s src/brew-model-v09.js
          grep -q 'lucky-brew-model-0.9.0-beta.1' src/brew-model-v09.js
          grep -q '轨迹图' docs/v0.9.0-beta-release-note.md
          grep -q 'filter_after' docs/browser-smoke-result.json
          grep -q '"page_errors": \[\]' docs/browser-smoke-result.json

      - name: Commit atomic v0.9 Beta source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/v090
          rm -f .apply-v090-trigger
          rm -f .github/workflows/apply-beta-v090.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(beta): implement Lucky Bean v0.9.0-beta.1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
