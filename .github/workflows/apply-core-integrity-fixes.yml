name: Apply core sensory navigation fixes

on:
  push:
    branches: [main]
    paths:
      - '.core-integrity-fix-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch core navigation and professional note handling
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' > tests/core-integrity-fix-log.txt 2>&1
          from pathlib import Path
          import re

          app = Path('src/app.js')
          text = app.read_text(encoding='utf-8')
          rules = [
              (
                  r"\$\('#directSensoryBtn'\)\?\.addEventListener\('click',\s*\(\)\s*=>\s*\{\s*if\s*\(!state\.selectedBeanId\)\s*return;\s*startEvaluation\(state\.selectedBeanId,\s*\{\s*direct:\s*true\s*\}\);\s*switchPage\('sensory'\);\s*\}\);",
                  "$('#directSensoryBtn')?.addEventListener('click', () => { if (!state.selectedBeanId) return; state.evaluation = null; switchPage('sensory'); });",
                  'direct sensory button'
              ),
              (
                  r"\$\('#planToSensoryBtn'\)\?\.addEventListener\('click',\s*\(\)\s*=>\s*\{\s*if\s*\(!state\.selectedBeanId\)\s*return;\s*startEvaluation\(state\.selectedBeanId,\s*\{\s*direct:\s*true\s*\}\);\s*switchPage\('sensory'\);\s*\}\);",
                  "$('#planToSensoryBtn')?.addEventListener('click', () => { if (!state.selectedBeanId) return; state.evaluation = null; switchPage('sensory'); });",
                  'generated plan tasting button'
              ),
              (
                  r"closeOverlay\(\);\s*startEvaluation\(bean\.id,\s*\{\s*brewSessionId:\s*state\.currentPlan\?\.id\s*\|\|\s*''\s*\}\);\s*switchPage\('sensory',\s*\{\s*preserveOverlay:\s*true\s*\}\);\s*renderSensory\(\);",
                  "closeOverlay(); state.evaluation = null; state.selectedBeanId = bean.id; switchPage('sensory'); renderSensory();",
                  'post-brew tasting navigation'
              ),
          ]
          for pattern, replacement, label in rules:
              text, count = re.subn(pattern, replacement, text, count=1)
              print(label, count)
              if count != 1:
                  raise SystemExit(f'failed to patch {label}: {count}')
          app.write_text(text, encoding='utf-8')

          sensory = Path('src/v095-sensory-pro.js')
          text = sensory.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\s*if\s*\(!note\.value\.trim\(\)\)\s*\{\s*"
              r"note\.value\s*=\s*`\$\{summary\}\\n\\n札记：`;\s*"
              r"note\.dispatchEvent\(new Event\('input',\s*\{\s*bubbles:\s*true\s*\}\)\);\s*"
              r"note\.focus\(\);\s*note\.setSelectionRange\(note\.value\.length,\s*note\.value\.length\);\s*\}"
          )
          replacement = """
    note.maxLength = 300;
    note.placeholder = '仅记录自然语言札记，最多300字；专业标签、雷达与评分已结构化保存。';
    if (note.value.length > 300) note.value = note.value.slice(0, 300);
    note.focus();"""
          text, count = pattern.subn(replacement, text, count=1)
          print('professional note injection', count)
          if count != 1:
              raise SystemExit(f'failed to patch professional note injection: {count}')
          sensory.write_text(text, encoding='utf-8')
          PY

      - name: Verify and commit source patch
        if: steps.patch.outcome == 'success'
        run: |
          node --check src/app.js
          node --check src/v095-sensory-pro.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/v095-sensory-pro.js
          git commit -m 'fix: make tasting selection and structured notes native'
          git push origin HEAD:main

      - name: Commit diagnostic log on failure
        if: steps.patch.outcome != 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/core-integrity-fix-log.txt
          git commit -m 'chore: record core integrity patch diagnostic [skip ci]'
          git push origin HEAD:main
          exit 1
