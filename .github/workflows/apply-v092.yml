name: Apply Lucky Bean 0.9.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v092.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode and apply 0.9.2 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d release/v092/apply_v092.py.gz.b64 | gzip -d > /tmp/apply_v092.py
          python /tmp/apply_v092.py

      - name: Validate 0.9.2
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json'); if(p.version!=='0.9.2') process.exit(1)"
          grep -q "APP_VERSION = '0.9.2'" src/utils.js
          grep -q "luckybean-v0.9.2" sw.js
          grep -q "sensoryDeltaWheel" src/app.js
          grep -q "榜魁" src/app.js
          grep -q "同时扣除滤纸" src/app.js

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/v092
          rm -f .github/workflows/apply-v092.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.2'
          git push origin HEAD:main
