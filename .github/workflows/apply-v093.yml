name: Apply Lucky Bean 0.9.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 0

      - name: Detect complete overlay
        id: ready
        shell: bash
        run: |
          required=(release/v093-overlay/overlay.part00 release/v093-overlay/overlay.part01 release/v093-overlay/overlay.part02 release/v093-overlay/overlay.part03 release/v093-overlay/overlay.part04 release/v093-overlay/overlay.part05 release/v093-overlay/complete.txt)
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "Waiting for $file"
              exit 0
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Reconstruct, verify and apply overlay
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat release/v093-overlay/overlay.part0{0,1,2,3,4,5} > /tmp/v093-overlay.b64
          base64 --decode /tmp/v093-overlay.b64 > /tmp/v093-overlay.tar.gz
          echo '70a11440879ac9ced6e8bae48ddce0e9a4537fab1754f65f605957b460434c5b  /tmp/v093-overlay.tar.gz' | sha256sum -c -
          tar -tzf /tmp/v093-overlay.tar.gz >/tmp/v093-files.txt
          tar -xzf /tmp/v093-overlay.tar.gz -C .
          rm -rf release/v093 release/v093-clean release/v093-final release/v093-overlay

      - name: Synchronize BrewIon codebook
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/zjcrop/BrewIon/main/coffee-qr-codebook/coffee_qr_codebook_v6.json \
            -o public/fallback-codebook.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('public/fallback-codebook.json','utf8'));
          const cols=b?._columns?.flavors || [];
          if (!Array.isArray(b.flavors) || b.flavors.length < 100) throw new Error('BrewIon flavor table invalid');
          if (cols[0] !== 'code' || !cols.includes('nameZh')) throw new Error('BrewIon flavor columns invalid');
          console.log(`BrewIon flavors: ${b.flavors.length}`);
          NODE

      - name: Refresh checksums
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          excluded_dirs={'.git','node_modules','release','__pycache__'}
          excluded={'checksums.sha256','docs/smoke-beta-beans.png','docs/smoke-beta-brew.png'}
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x:x.as_posix()):
              if not p.is_file(): continue
              rel=p.as_posix()
              if any(part in excluded_dirs for part in p.parts) or rel in excluded: continue
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  ./{rel}')
          Path('checksums.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY

      - name: Validate 0.9.3
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/codebook.js
          node --check src/utils.js
          npm test
          npm run check
          node -e "const p=require('./package.json');if(p.version!=='0.9.3')process.exit(1)"
          grep -q "APP_VERSION = '0.9.3'" src/utils.js
          grep -q "luckybean-v0.9.3" sw.js
          grep -q 'id="splashScreen"' index.html
          grep -q '点击进入' index.html
          grep -q 'public/action-grid.svg' styles.css
          grep -q 'sensoryIntensity' src/app.js
          grep -q 'dripperPrice' src/app.js
          grep -q 'frozen-weight' styles.css
          grep -q 'flavorDisplayName' src/codebook.js
          test -s public/app-logo.jpg
          test -s public/app-icon-192.png
          test -s public/app-icon-512.png
          test -s public/splash.jpg
          test -s public/action-grid.svg

      - name: Commit verified release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cp /tmp/v093-files.txt docs/v093-payload-list.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.3'
          git push origin HEAD:release-0.9.3
