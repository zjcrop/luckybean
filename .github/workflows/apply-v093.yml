name: Apply Lucky Bean 0.9.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 0

      - name: Wait for complete payload
        id: ready
        shell: bash
        run: |
          if [ -f release/v093-final/complete.txt ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '0.9.3 final payload is not complete yet.'
          fi

      - name: Reconstruct and verify payload
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode release/v093-final/script.b64 > /tmp/apply-v093.py.gz
          base64 --decode release/v093-final/logo.b64 > /tmp/app-logo.webp
          base64 --decode release/v093-final/splash.b64 > /tmp/splash.webp
          base64 --decode release/v093-final/action.b64 > /tmp/action-grid.webp
          echo 'a7574b6ab58eb661be484886e1e2710997692f28c02cc351c8f078774c9f1116  /tmp/apply-v093.py.gz' | sha256sum -c -
          echo '7c63ac92306292e22d37bd0cbb148e58eadfff5f6c398a5904ab4d3e2c8466e5  /tmp/app-logo.webp' | sha256sum -c -
          echo '654b42e28080bd1a592fa42f421824344e3b36453d084d86b0ebe5ece2e28218  /tmp/splash.webp' | sha256sum -c -
          echo 'ca5e6569e79e1e81e4db31984a9dd0b12984bfd268966f6476cf0f464a684dcf  /tmp/action-grid.webp' | sha256sum -c -
          gzip -d -c /tmp/apply-v093.py.gz > /tmp/apply-v093.py
          python -m py_compile /tmp/apply-v093.py

      - name: Apply script and assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-v093.py
          mkdir -p public android/app/src/main/res/drawable
          cp /tmp/app-logo.webp public/app-logo.webp
          cp /tmp/app-logo.webp android/app/src/main/res/drawable/app_logo.webp
          cp /tmp/splash.webp public/splash.webp
          cp /tmp/action-grid.webp public/action-grid.webp
          rm -rf release/v093 release/v093-clean release/v093-final

      - name: Synchronize BrewIon codebook
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/zjcrop/BrewIon/main/coffee-qr-codebook/coffee_qr_codebook_v6.json \
            -o public/fallback-codebook.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('public/fallback-codebook.json','utf8'));if(!Array.isArray(b.flavors)||b.flavors.length<20)throw new Error('BrewIon flavors invalid');console.log('flavors',b.flavors.length)"

      - name: Refresh checksums
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          excluded_dirs={'.git','node_modules','release','__pycache__'}
          excluded={'checksums.sha256','docs/smoke-beta-beans.png','docs/smoke-beta-brew.png'}
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x:x.as_posix()):
              if not p.is_file(): continue
              rel=p.as_posix()
              if any(part in excluded_dirs for part in p.parts) or rel in excluded: continue
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  ./{rel}')
          Path('checksums.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY

      - name: Validate 0.9.3
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/codebook.js
          node --check src/preference-model.js
          npm test
          npm run check
          node -e "const p=require('./package.json');if(p.version!=='0.9.3')process.exit(1)"
          grep -q "APP_VERSION = '0.9.3'" src/utils.js
          grep -q "luckybean-v0.9.3" sw.js
          grep -q 'id="splashScreen"' index.html
          grep -q '点击进入' index.html
          grep -q 'public/action-grid.webp' styles.css
          grep -q 'intensity: true' src/app.js
          grep -q 'dripperPrice' src/app.js
          grep -q 'frozen-weight' styles.css
          grep -q '取消</button><button id="prevSensoryNodeBtn"' src/app.js

      - name: Commit verified release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.3'
          git push origin HEAD:release-0.9.3
