name: Apply Lucky Bean 0.9.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 0

      - name: Decode payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v093/code /tmp/v093/assets
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, io, itertools, re, tarfile

          files = {
              p.name: ''.join(re.findall(r'[A-Za-z0-9+/=]', p.read_text(encoding='utf-8')))
              for p in Path('release/v093').glob('*.part*')
          }
          print('payload lengths:', {k: len(v) for k, v in sorted(files.items())})

          def padded(value):
              return value + '=' * ((4 - len(value) % 4) % 4)

          def archive_members(data):
              if not data.startswith(b'\x1f\x8b'):
                  return None
              try:
                  expanded = gzip.decompress(data)
                  with tarfile.open(fileobj=io.BytesIO(expanded), mode='r:') as tf:
                      names = [m.name for m in tf.getmembers() if m.isfile()]
                  return names or None
              except Exception:
                  return None

          def decode_sequence(names):
              strings = [files[n] for n in names]
              variants = []
              try:
                  variants.append(('pieces', b''.join(base64.b64decode(padded(s), validate=False) for s in strings)))
              except Exception:
                  pass
              for label, joined in [
                  ('joined', ''.join(strings)),
                  ('stripped', ''.join(s.rstrip('=') for s in strings)),
              ]:
                  try:
                      variants.append((label, base64.b64decode(padded(joined), validate=False)))
                  except Exception:
                      pass
              for label, data in variants:
                  members = archive_members(data)
                  if members:
                      return label, data, members
              return None

          preferred = [
              ('assets.part00','assets.part01','assets.part02'),
              ('safe.part00','tail.part00','tail.part01'),
              ('assets.part00','tail.part00','tail.part01'),
              ('safe.part00','assets.part01','assets.part02'),
          ]
          result = None
          used = None
          for names in preferred:
              if all(n in files for n in names):
                  found = decode_sequence(names)
                  if found:
                      used, result = names, found
                      break

          if result is None:
              starts = [name for name, value in files.items() if value.startswith('H4sI')]
              rest = [name for name in files if name not in starts]
              for start in starts:
                  for count in range(1, min(5, len(rest)) + 1):
                      for tail in itertools.permutations(rest, count):
                          names = (start, *tail)
                          found = decode_sequence(names)
                          if found:
                              used, result = names, found
                              break
                      if result: break
                  if result: break

          if result is None:
              raise SystemExit('No valid redundant payload archive found')

          strategy, data, members = result
          print('selected:', used, strategy, len(data), 'bytes')
          print('members:', members)
          Path('/tmp/v093/payload.tar.gz').write_bytes(data)
          PY
          tar -xzf /tmp/v093/payload.tar.gz -C /tmp/v093/code
          cp -a /tmp/v093/code/. /tmp/v093/assets/

          {
            echo '=== selected payload ==='
            find /tmp/v093/code -maxdepth 5 -type f -printf '%P\n' | sort
          } > /tmp/v093/payload-list.txt
          cat /tmp/v093/payload-list.txt

      - name: Apply patch and assets
        shell: bash
        run: |
          set -euo pipefail
          script="$(find /tmp/v093/code -type f \( -name 'apply_v093.py' -o -name 'apply*.py' \) | head -n1)"
          if [ -n "$script" ]; then
            python "$script"
          else
            root="$(find /tmp/v093/code -type f -name package.json -printf '%h\n' | head -n1)"
            if [ -z "$root" ]; then
              echo 'No patch script or source tree found' >&2
              exit 21
            fi
            cp -a "$root"/. ./
          fi

          mkdir -p public
          find /tmp/v093/assets -type f | while read -r file; do
            case "$(basename "$file")" in
              app-logo.jpg|app-icon-192.png|app-icon-512.png|splash.jpg|action-grid.svg|app-icon.svg)
                cp "$file" "public/$(basename "$file")" ;;
            esac
          done
          test -s public/app-logo.jpg
          test -s public/splash.jpg
          test -s public/action-grid.svg

      - name: Synchronize BrewIon codebook
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/zjcrop/BrewIon/main/coffee-qr-codebook/coffee_qr_codebook_v6.json \
            -o public/fallback-codebook.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('public/fallback-codebook.json','utf8'));if(!Array.isArray(b.flavors)||b.flavors.length<20)throw new Error('BrewIon flavors invalid');console.log('flavors',b.flavors.length)"

      - name: Validate 0.9.3
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json');if(p.version!=='0.9.3')process.exit(1)"
          grep -q "APP_VERSION = '0.9.3'" src/utils.js
          grep -q "luckybean-v0.9.3" sw.js
          grep -q 'id="splashScreen"' index.html
          grep -q '点击进入' index.html
          grep -q 'public/action-grid.svg' styles.css
          grep -q 'sensoryIntensity' src/app.js
          grep -q 'dripperPrice' src/app.js
          grep -q 'frozen-weight' styles.css
          grep -q '取消</button><button id="prevSensoryNodeBtn"' src/app.js

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/v093
          mkdir -p docs
          cp /tmp/v093/payload-list.txt docs/v093-payload-list.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.3'
          git push origin HEAD:release-0.9.3
