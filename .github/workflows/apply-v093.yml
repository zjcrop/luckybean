name: Apply Lucky Bean 0.9.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 0

      - name: Detect complete verified payload
        id: ready
        shell: bash
        run: |
          required=(release/v093-final/complete.txt release/v093-final/script.b64 release/v093-final/logo.b64 release/v093-final/action.b64)
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "Missing $file"
              exit 0
            fi
          done
          if ! compgen -G 'release/v093-final/splash.part*.b64' >/dev/null; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Missing splash parts'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Reconstruct and validate payload
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode release/v093-final/script.b64 > /tmp/apply-v093.py.gz
          base64 --decode release/v093-final/logo.b64 > /tmp/app-logo.webp
          cat release/v093-final/splash.part*.b64 | base64 --decode > /tmp/splash.webp
          base64 --decode release/v093-final/action.b64 > /tmp/action-grid.webp

          gzip -t /tmp/apply-v093.py.gz
          gzip -d -c /tmp/apply-v093.py.gz > /tmp/apply-v093.py
          python -m py_compile /tmp/apply-v093.py

          for image in /tmp/app-logo.webp /tmp/splash.webp /tmp/action-grid.webp; do
            test -s "$image"
            test "$(file --brief --mime-type "$image")" = 'image/webp'
          done

          sha256sum \
            /tmp/apply-v093.py.gz \
            /tmp/app-logo.webp \
            /tmp/splash.webp \
            /tmp/action-grid.webp | tee /tmp/v093-payload-sha256.txt

      - name: Apply script and assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-v093.py
          mkdir -p public android/app/src/main/res/drawable docs
          cp /tmp/app-logo.webp public/app-logo.webp
          cp /tmp/app-logo.webp android/app/src/main/res/drawable/app_logo.webp
          cp /tmp/splash.webp public/splash.webp
          cp /tmp/action-grid.webp public/action-grid.webp
          cp /tmp/v093-payload-sha256.txt docs/v093-payload-sha256.txt
          rm -rf release/v093 release/v093-clean release/v093-final release/v093-overlay

      - name: Synchronize BrewIon codebook
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/zjcrop/BrewIon/main/coffee-qr-codebook/coffee_qr_codebook_v6.json \
            -o public/fallback-codebook.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('public/fallback-codebook.json','utf8'));
          const cols=b?._columns?.flavors || [];
          if (!Array.isArray(b.flavors) || b.flavors.length < 100) throw new Error('BrewIon flavor table invalid');
          if (cols[0] !== 'code' || !cols.includes('nameZh')) throw new Error('BrewIon flavor columns invalid');
          console.log(`BrewIon flavors: ${b.flavors.length}`);
          NODE

      - name: Refresh checksums
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          excluded_dirs={'.git','node_modules','release','__pycache__'}
          excluded={'checksums.sha256','docs/smoke-beta-beans.png','docs/smoke-beta-brew.png'}
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x:x.as_posix()):
              if not p.is_file(): continue
              rel=p.as_posix()
              if any(part in excluded_dirs for part in p.parts) or rel in excluded: continue
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  ./{rel}')
          Path('checksums.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY

      - name: Validate 0.9.3
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/codebook.js
          node --check src/preference-model.js
          npm test
          npm run check
          node -e "const p=require('./package.json');if(p.version!=='0.9.3')process.exit(1)"
          grep -q "APP_VERSION = '0.9.3'" src/utils.js
          grep -q "luckybean-v0.9.3" sw.js
          grep -q 'id="splashScreen"' index.html
          grep -q '点击进入' index.html
          grep -q 'public/action-grid.webp' styles.css
          grep -q 'intensity: true' src/app.js
          grep -q 'dripperPrice' src/app.js
          grep -q 'frozen-weight' styles.css
          grep -q 'flavorDisplayName' src/codebook.js
          test -s public/app-logo.webp
          test -s public/splash.webp
          test -s public/action-grid.webp

      - name: Commit verified release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.3'
          git push origin HEAD:release-0.9.3
