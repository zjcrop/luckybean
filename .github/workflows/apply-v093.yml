name: Apply Lucky Bean 0.9.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 0

      - name: Wait for complete archive
        id: ready
        shell: bash
        run: |
          if [ -f release/v093-clean/complete.txt ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '0.9.3 archive upload is not complete yet.'
          fi

      - name: Reconstruct and verify archive
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat release/v093-clean/part* | base64 --decode > /tmp/luckybean-v093-clean.tar.gz
          echo 'e06bf16c6334f5f5ea5a52b70eff2888694fdebf8299b1ff1d6e7aa49c084518  /tmp/luckybean-v093-clean.tar.gz' | sha256sum -c -
          tar -tzf /tmp/luckybean-v093-clean.tar.gz >/tmp/v093-file-list.txt
          cat /tmp/v093-file-list.txt

      - name: Apply clean archive
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/luckybean-v093-clean.tar.gz -C .
          rm -rf release/v093 release/v093-clean

      - name: Synchronize BrewIon codebook
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/zjcrop/BrewIon/main/coffee-qr-codebook/coffee_qr_codebook_v6.json \
            -o public/fallback-codebook.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('public/fallback-codebook.json','utf8'));if(!Array.isArray(b.flavors)||b.flavors.length<20)throw new Error('BrewIon flavors invalid');console.log('flavors',b.flavors.length)"

      - name: Refresh checksums
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          excluded_dirs={'.git','node_modules','release','__pycache__'}
          excluded={'checksums.sha256','docs/smoke-beta-beans.png','docs/smoke-beta-brew.png'}
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x:x.as_posix()):
              if not p.is_file(): continue
              rel=p.as_posix()
              if any(part in excluded_dirs for part in p.parts) or rel in excluded: continue
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  ./{rel}')
          Path('checksums.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY

      - name: Validate 0.9.3
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/codebook.js
          node --check src/preference-model.js
          npm test
          npm run check
          node -e "const p=require('./package.json');if(p.version!=='0.9.3')process.exit(1)"
          grep -q "APP_VERSION = '0.9.3'" src/utils.js
          grep -q "luckybean-v0.9.3" sw.js
          grep -q 'id="splashScreen"' index.html
          grep -q '点击进入' index.html
          grep -q 'public/action-grid.svg' styles.css
          grep -q 'sensoryIntensity' src/app.js
          grep -q 'dripperPrice' src/app.js
          grep -q 'frozen-weight' styles.css
          grep -q '取消</button><button id="prevSensoryNodeBtn"' src/app.js

      - name: Commit verified release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.3'
          git push origin HEAD:release-0.9.3
