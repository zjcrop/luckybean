name: Apply Lucky Bean 0.9.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 0

      - name: Decode payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v093/code /tmp/v093/assets
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, io, re, tarfile

          def clean(path):
              raw = Path(path).read_text(encoding='utf-8')
              return ''.join(re.findall(r'[A-Za-z0-9+/=]', raw))

          def padded(value):
              return value + '=' * ((4 - len(value) % 4) % 4)

          def valid_archive(data):
              if not data.startswith(b'\x1f\x8b'):
                  return False
              try:
                  expanded = gzip.decompress(data)
                  with tarfile.open(fileobj=io.BytesIO(expanded), mode='r:') as tf:
                      return bool(tf.getmembers())
              except Exception:
                  return False

          def reconstruct(parts, destination):
              strings = [clean(p) for p in parts]
              candidates = []

              # Each binary chunk may have been encoded separately.
              try:
                  candidates.append(b''.join(base64.b64decode(padded(s), validate=False) for s in strings))
              except Exception:
                  pass

              # Or a single base64 stream may have been split with padding retained.
              try:
                  joined = ''.join(s.rstrip('=') for s in strings)
                  candidates.append(base64.b64decode(padded(joined), validate=False))
              except Exception:
                  pass

              # Also try the literal cleaned concatenation.
              try:
                  candidates.append(base64.b64decode(padded(''.join(strings)), validate=False))
              except Exception:
                  pass

              for index, data in enumerate(candidates):
                  if valid_archive(data):
                      Path(destination).write_bytes(data)
                      print(f'{destination}: strategy {index}, {len(data)} bytes')
                      return
              raise SystemExit(f'No valid gzip/tar reconstruction for {parts}; lengths={[len(s) for s in strings]}')

          reconstruct([
              'release/v093/safe.part00',
              'release/v093/tail.part00',
              'release/v093/tail.part01',
          ], '/tmp/v093/code.tar.gz')
          reconstruct([
              'release/v093/assets.part00',
              'release/v093/assets.part01',
              'release/v093/assets.part02',
          ], '/tmp/v093/assets.tar.gz')
          PY
          tar -xzf /tmp/v093/code.tar.gz -C /tmp/v093/code
          tar -xzf /tmp/v093/assets.tar.gz -C /tmp/v093/assets

          {
            echo '=== code payload ==='
            find /tmp/v093/code -maxdepth 4 -type f -printf '%P\n' | sort
            echo '=== asset payload ==='
            find /tmp/v093/assets -maxdepth 4 -type f -printf '%P\n' | sort
          } > /tmp/v093/payload-list.txt
          cat /tmp/v093/payload-list.txt

      - name: Apply patch and assets
        shell: bash
        run: |
          set -euo pipefail
          script="$(find /tmp/v093/code -type f \( -name 'apply_v093.py' -o -name 'apply*.py' \) | head -n1)"
          if [ -n "$script" ]; then
            python "$script"
          else
            root="$(find /tmp/v093/code -type f -name package.json -printf '%h\n' | head -n1)"
            if [ -z "$root" ]; then
              echo 'No patch script or source tree found' >&2
              exit 21
            fi
            cp -a "$root"/. ./
          fi

          mkdir -p public
          find /tmp/v093/assets -type f | while read -r file; do
            case "$(basename "$file")" in
              app-logo.jpg|app-icon-192.png|app-icon-512.png|splash.jpg|action-grid.svg|app-icon.svg)
                cp "$file" "public/$(basename "$file")" ;;
            esac
          done
          test -s public/app-logo.jpg
          test -s public/splash.jpg
          test -s public/action-grid.svg

      - name: Synchronize BrewIon codebook
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/zjcrop/BrewIon/main/coffee-qr-codebook/coffee_qr_codebook_v6.json \
            -o public/fallback-codebook.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('public/fallback-codebook.json','utf8'));if(!Array.isArray(b.flavors)||b.flavors.length<20)throw new Error('BrewIon flavors invalid');console.log('flavors',b.flavors.length)"

      - name: Validate 0.9.3
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json');if(p.version!=='0.9.3')process.exit(1)"
          grep -q "APP_VERSION = '0.9.3'" src/utils.js
          grep -q "luckybean-v0.9.3" sw.js
          grep -q 'id="splashScreen"' index.html
          grep -q '点击进入' index.html
          grep -q 'public/action-grid.svg' styles.css
          grep -q 'sensoryIntensity' src/app.js
          grep -q 'dripperPrice' src/app.js
          grep -q 'frozen-weight' styles.css
          grep -q '取消</button><button id="prevSensoryNodeBtn"' src/app.js

      - name: Commit verified release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release/v093
          mkdir -p docs
          cp /tmp/v093/payload-list.txt docs/v093-payload-list.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.3'
          git push origin HEAD:release-0.9.3
