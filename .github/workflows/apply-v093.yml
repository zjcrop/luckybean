name: Apply Lucky Bean 0.9.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 0

      - name: Wait for complete payload
        id: ready
        shell: bash
        run: |
          if [ -f release/v093-final/complete.txt ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '0.9.3 final payload is not complete yet.'
          fi

      - name: Reconstruct and verify payload
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat release/v093-final/patch.part* | base64 --decode > /tmp/v093.patch.gz
          base64 --decode release/v093-final/logo.b64 > /tmp/app-logo.jpg
          cat release/v093-final/splash.part* | base64 --decode > /tmp/splash.jpg
          base64 --decode release/v093-final/action-grid.b64 | gzip -d > /tmp/action-grid.svg
          echo '89b7f137274b122ff3d77ed97a3d4252cb59d897063814d929fd450375e490f4  /tmp/v093.patch.gz' | sha256sum -c -
          echo '0ac9c3828046fbf442715eb4d760173d4912c8d3b710f1b1d0ac890b34dd7703  /tmp/app-logo.jpg' | sha256sum -c -
          echo '2709478db3a637d76e92287c75e1d16f8d106c97f3057c24c155830b059bf0b4  /tmp/splash.jpg' | sha256sum -c -
          echo 'da98e7997a04b55aa729d3a9f64e8a28d0e72359a786f48a83713ac3b9e248d2  /tmp/action-grid.svg' | sha256sum -c -
          gzip -d -c /tmp/v093.patch.gz > /tmp/v093.patch
          git apply --check /tmp/v093.patch

      - name: Apply patch and assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v093.patch
          mkdir -p public android/app/src/main/res/drawable
          cp /tmp/app-logo.jpg public/app-logo.jpg
          cp /tmp/app-logo.jpg android/app/src/main/res/drawable/app_logo.jpg
          cp /tmp/splash.jpg public/splash.jpg
          cp /tmp/action-grid.svg public/action-grid.svg
          rm -rf release/v093 release/v093-clean release/v093-final

      - name: Synchronize BrewIon codebook
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/zjcrop/BrewIon/main/coffee-qr-codebook/coffee_qr_codebook_v6.json \
            -o public/fallback-codebook.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('public/fallback-codebook.json','utf8'));if(!Array.isArray(b.flavors)||b.flavors.length<20)throw new Error('BrewIon flavors invalid');console.log('flavors',b.flavors.length)"

      - name: Refresh checksums
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          excluded_dirs={'.git','node_modules','release','__pycache__'}
          excluded={'checksums.sha256','docs/smoke-beta-beans.png','docs/smoke-beta-brew.png'}
          rows=[]
          for p in sorted(root.rglob('*'), key=lambda x:x.as_posix()):
              if not p.is_file(): continue
              rel=p.as_posix()
              if any(part in excluded_dirs for part in p.parts) or rel in excluded: continue
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  ./{rel}')
          Path('checksums.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY

      - name: Validate 0.9.3
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/codebook.js
          node --check src/preference-model.js
          npm test
          npm run check
          node -e "const p=require('./package.json');if(p.version!=='0.9.3')process.exit(1)"
          grep -q "APP_VERSION = '0.9.3'" src/utils.js
          grep -q "luckybean-v0.9.3" sw.js
          grep -q 'id="splashScreen"' index.html
          grep -q '点击进入' index.html
          grep -q 'public/action-grid.svg' styles.css
          grep -q 'sensoryIntensity' src/app.js
          grep -q 'dripperPrice' src/app.js
          grep -q 'frozen-weight' styles.css
          grep -q '取消</button><button id="prevSensoryNodeBtn"' src/app.js

      - name: Commit verified release
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: Lucky Bean 0.9.3'
          git push origin HEAD:release-0.9.3
