name: Apply and verify v1.2.1 single sync account

on:
  push:
    branches:
      - fix/v121-single-sync-account
    paths:
      - .github/workflows/apply-v121-single-sync-account.yml

permissions:
  contents: write

concurrency:
  group: luckybean-v121-single-sync-account
  cancel-in-progress: false

jobs:
  implement-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/v121-single-sync-account
          fetch-depth: 0

      - name: Apply the reviewed product tree
        run: |
          test "$(find .delivery -maxdepth 1 -name 'v121-single-account-payload.b64.*' -type f | wc -l)" -eq 7
          cat .delivery/v121-single-account-payload.b64.* > /tmp/v121-single-account-payload.b64
          base64 -d /tmp/v121-single-account-payload.b64 > /tmp/v121-single-account-payload.tgz
          gzip -t /tmp/v121-single-account-payload.tgz
          tar -xzf /tmp/v121-single-account-payload.tgz -C .
          rm -f .delivery/v121-single-account-payload.b64.*
          rmdir .delivery 2>/dev/null || true

      - name: Update version-sensitive regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/v110-local-first-sync-static.mjs')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "assert.match(index, /1\\.2\\.0-test/);": "assert.match(index, /1\\.2\\.1-account-test/);",
              """assert.match(startup, /ensureLocalIdentity/);
          assert.match(startup, /LB-LOCAL-/);
          assert.match(startup, /luckybean:local-app-ready/);
          assert.match(startup, /点击进入/);
          assert.match(startup, /await ensureLocalIdentity\\(\\)[\\s\\S]*await import\\('\\.\\.\\/app\\.js\\?v=1\\.2\\.0-test'\\)/);
          assert.doesNotMatch(startup, /fetch\\s*\\(/);""": """assert.match(startup, /ensureLocalDevice/);
          assert.doesNotMatch(startup, /ensureLocalIdentity|LB-LOCAL-/);
          assert.match(startup, /luckybean:local-app-ready/);
          assert.match(startup, /点击进入/);
          assert.match(startup, /navigator\\.serviceWorker\\.register\\('\\.\\/sw\\.js\\?v=1\\.2\\.1-account-test'/);
          assert.match(startup, /await ensureLocalDevice\\(\\)[\\s\\S]*await import\\('\\.\\.\\/app\\.js\\?v=1\\.2\\.1-account-test'\\)/);
          assert.doesNotMatch(startup, /fetch\\s*\\(/);""",
              "assert.match(panel, /启动和使用不等待服务器/);": "assert.match(panel, /登录服务器同步/);\nassert.match(panel, /自动同步始终启用/);",
              "assert.doesNotMatch(sync, /PASSPHRASE|promptPassphrase|sessionStorage/i);": "assert.doesNotMatch(sync, /PASSPHRASE|promptPassphrase|sessionStorage/i);\nassert.match(sync, /function ensureAutomatic/);\nassert.doesNotMatch(sync, /ENABLE_KEY|setEnabled|getSetting|setSetting/);",
              """assert.match(sw, /CACHE_PREFIX = 'luckybean-v120-test-'/);
          assert.match(sw, /CACHE_NAME = `\\$\\{CACHE_PREFIX\\}1\\.2\\.0-test`/);
          assert.match(sw, /key\\.startsWith\\(CACHE_PREFIX\\) && key !== CACHE_NAME/);
          assert.doesNotMatch(sw, /keys\\.filter\\(key => key !== CACHE_NAME\\)/);""": """assert.match(sw, /CACHE_PREFIX = 'luckybean-v121-account-test-'/);
          assert.match(sw, /CACHE_NAME = `\\$\\{CACHE_PREFIX\\}1\\.2\\.1-account-test`/);
          assert.match(sw, /LEGACY_CACHE_PREFIXES = \\['luckybean-v120-test-'\\]/);
          assert.match(sw, /key\\.startsWith\\(CACHE_PREFIX\\) && key !== CACHE_NAME/);
          assert.match(sw, /LEGACY_CACHE_PREFIXES\\.some/);
          assert.doesNotMatch(sw, /keys\\.filter\\(key => key !== CACHE_NAME\\)/);""",
              "assert.equal(manifest.version, '1.2.0-test');": "assert.equal(manifest.version, '1.2.1-account-test');",
              "console.log('v1.2.0 local-first, isolated cache, authoritative analysis, spatial renderer and formal history checks passed');": "console.log('v1.2.1 single server account, mandatory automatic sync, isolated cache and core contracts passed');"
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected baseline block: {old[:100]}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify source syntax and single-account contracts
        run: |
          node --check src/ui/account-sync-panel.js
          node --check src/services/cloud-auth-service.js
          node --check src/services/cloud-sync-service.js
          node --check src/core/startup-controller.js
          node --check src/features/runtime-features.js
          node --check src/ui/appearance-controller.js
          node --check sw.js
          grep -F '1.2.1-account-test' package.json
          grep -F "CACHE_PREFIX = 'luckybean-v121-account-test-'" sw.js
          grep -F "LEGACY_CACHE_PREFIXES = ['luckybean-v120-test-']" sw.js
          grep -F '登录服务器同步' src/ui/account-sync-panel.js
          grep -F '自动同步始终启用' src/ui/account-sync-panel.js
          grep -F 'function ensureAutomatic' src/services/cloud-sync-service.js
          ! grep -E 'persistIdentity|getSetting|setSetting' src/services/cloud-auth-service.js
          ! grep -E "ENABLE_KEY|setEnabled|reason: 'disabled'|emit\('disabled'" src/services/cloud-sync-service.js
          ! grep -E 'ensureLocalIdentity|LB-LOCAL-|getSetting|setSetting' src/core/startup-controller.js

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run static and all-profile checks
        run: npm run test:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run startup core account interaction and visual tests
        run: |
          python3 -m http.server 4173 > /tmp/luckybean-v121-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:smoke
          npm run test:core
          npm run test:visual

      - name: Commit only the verified product implementation
        run: |
          rm -rf node_modules test-results playwright-report .playwright
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test ! -d .delivery
          git commit -m "fix: use one server account with mandatory automatic sync"
          git push origin HEAD:refs/heads/fix/v121-single-sync-account
