name: Audit formal runtime coupling

on:
  push:
    branches: [test-v107-web]
    paths:
      - 'scripts/audit-formal-runtime.mjs'
      - '.github/workflows/audit-formal-runtime.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-v107-web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit runtime coupling
        run: node scripts/audit-formal-runtime.mjs
