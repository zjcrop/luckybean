name: Expand Lucky Bean v0.6.0 source

on:
  push:
    branches:
      - feat/v0.6.0-implementation
    paths:
      - 'release/luckybean-v0.6.0.zip.b64.part*'
      - '.github/workflows/bootstrap-expand.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'release/luckybean-v0.6.0.zip.b64.part*'
      - '.github/workflows/bootstrap-expand.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-v060-expand
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.6.0-implementation
          fetch-depth: 0

      - name: Validate source package parts
        shell: bash
        run: |
          set -euo pipefail
          total=0
          for part in $(seq 1 16); do
            file="$(printf 'release/luckybean-v0.6.0.zip.b64.part%03d' "$part")"
            test -s "$file"
            size="$(wc -c < "$file")"
            printf '%s %s bytes\n' "$file" "$size"
            if [[ "$part" -lt 16 && "$size" -ne 10000 ]]; then
              echo "Unexpected part size: $file=$size" >&2
              exit 1
            fi
            if [[ "$part" -eq 16 && "$size" -ne 4576 ]]; then
              echo "Unexpected final part size: $file=$size" >&2
              exit 1
            fi
            total=$((total + size))
          done
          test "$total" -eq 154576
          echo "Combined Base64 size: $total bytes"

      - name: Assemble and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luckybean-package"
          cat release/luckybean-v0.6.0.zip.b64.part* > "$RUNNER_TEMP/luckybean-package/luckybean.zip.b64"
          test "$(wc -c < "$RUNNER_TEMP/luckybean-package/luckybean.zip.b64")" -eq 154576
          base64 --decode "$RUNNER_TEMP/luckybean-package/luckybean.zip.b64" > "$RUNNER_TEMP/luckybean-package/luckybean.zip"
          echo 'cef94f064e6baf0adbb33c91a0ed331f7bc5e3b5e0651d9c37530a1369230284  '"$RUNNER_TEMP/luckybean-package/luckybean.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/luckybean-package/luckybean.zip"

      - name: Expand source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luckybean-package/unpacked"
          unzip -q "$RUNNER_TEMP/luckybean-package/luckybean.zip" -d "$RUNNER_TEMP/luckybean-package/unpacked"
          source_dir="$RUNNER_TEMP/luckybean-package/unpacked/luckybean-v0.6.0"
          test -f "$source_dir/index.html"
          test -f "$source_dir/src/app.js"
          test -f "$source_dir/.github/workflows/pages.yml"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='LICENSE' \
            "$source_dir/" ./

      - name: Verify expanded project
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node tests/static-check.mjs
          sha256sum -c checksums.sha256

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No expansion changes to commit.'
            exit 0
          fi
          git commit -m 'feat: expand Lucky Bean v0.6.0 source'
          git push origin HEAD:feat/v0.6.0-implementation
