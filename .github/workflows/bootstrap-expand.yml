name: Expand Lucky Bean v0.6.0 source

on:
  push:
    branches:
      - feat/v0.6.0-implementation
    paths:
      - 'release/luckybean-v0.6.0.zip.b64.part*'
      - '.github/workflows/bootstrap-expand.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-v060-expand
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.6.0-implementation
          fetch-depth: 0

      - name: Check all package parts
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for part in $(seq 1 16); do
            file="$(printf 'release/luckybean-v0.6.0.zip.b64.part%03d' "$part")"
            if [[ ! -s "$file" ]]; then
              echo "Waiting for $file"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and expand source package
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cat $(printf 'release/luckybean-v0.6.0.zip.b64.part%03d ' $(seq 1 16)) | base64 --decode > "$work/luckybean.zip"
          unzip -q "$work/luckybean.zip" -d "$work/unpacked"
          test -f "$work/unpacked/luckybean-v0.6.0/index.html"
          test -f "$work/unpacked/luckybean-v0.6.0/src/app.js"
          test -f "$work/unpacked/luckybean-v0.6.0/.github/workflows/pages.yml"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.gitignore' \
            ! -name 'LICENSE' \
            -exec rm -rf {} +
          cp -a "$work/unpacked/luckybean-v0.6.0/." .

      - name: Verify expanded project
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node tests/static-check.mjs
          sha256sum -c checksums.sha256

      - name: Commit expanded source
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No expansion changes to commit.'
            exit 0
          fi
          git commit -m 'feat: expand Lucky Bean v0.6.0 source'
          git push origin HEAD:feat/v0.6.0-implementation
