name: LuckyBean DS APK

on:
  push:
    branches:
      - luckybean-ds
    paths:
      - '.github/workflows/build-ds-apk.yml'
      - 'android/**'
      - 'contracts/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'package-lock.json'
      - 'package.json'
      - 'public/**'
      - 'recognition-test.html'
      - 'release.json'
      - 'scripts/prepare-paddleocr-vendor.mjs'
      - 'scripts/verify-ocr-runtime.mjs'
      - 'scripts/verify-offline-apk-install.sh'
      - 'src/**'
      - 'styles.css'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckybean-ds-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_runtime:
    uses: ./.github/workflows/prepare-ocr-runtime.yml

  build:
    needs: prepare_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore offline PP-OCRv5 runtime
        uses: actions/download-artifact@v8.0.1
        with:
          name: luckybean-ocr-runtime-${{ github.sha }}
          path: public/vendor/paddleocr/

      - run: npm run verify:ocr

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Assemble DS debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Verify package and prepare download artifact
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -tq "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$apk"
          signing=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$apk")
          printf '%s\n' "$signing"
          grep -Fq 'Verified using v1 scheme (JAR signing): true' <<< "$signing"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$signing"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          [[ "$badging" == *"package: name='com.luckybean.ds'"* ]]
          [[ "$badging" == *"sdkVersion:'26'"* ]]
          apk_entries=$(unzip -Z1 "$apk")
          for required in \
            'assets/web-cache/public/vendor/paddleocr/sdk.mjs' \
            'assets/web-cache/public/vendor/paddleocr/ort/ort-wasm-simd-threaded.wasm' \
            'assets/web-cache/public/vendor/paddleocr/models/PP-OCRv5_mobile_det_onnx_infer.tar' \
            'assets/web-cache/public/vendor/paddleocr/models/PP-OCRv5_mobile_rec_onnx_infer.tar'; do
            if ! grep -Fqx "$required" <<< "$apk_entries"; then
              echo "Missing offline OCR asset in APK: $required" >&2
              exit 1
            fi
          done

          mkdir -p dist
          artifact="dist/LuckyBean-DS-${GITHUB_SHA:0:12}.apk"
          cp "$apk" "$artifact"
          sha256sum "$artifact" > dist/SHA256SUMS.txt
          printf 'source_sha=%s\nbranch=%s\napplication_id=com.luckybean.ds\nbuild_type=debug\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/BUILD_INFO.txt

      - name: Install Android 10 emulator image
        run: sdkmanager 'emulator' 'system-images;android-29;google_apis;x86_64'

      - name: Verify fresh installation on Android 10
        run: |
          expected_code=$(node -p "require('./release.json').androidVersionCode")
          bash scripts/verify-offline-apk-install.sh android/app/build/outputs/apk/debug/app-debug.apk "$expected_code"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-ds-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
