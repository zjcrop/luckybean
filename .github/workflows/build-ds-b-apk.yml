name: LuckyBean DS-B APK

on:
  push:
    branches:
      - LuckyBean-DS-B
    paths:
      - '.github/workflows/build-ds-b-apk.yml'
      - 'android/**'
      - 'contracts/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'public/**'
      - 'recognition-test.html'
      - 'release.json'
      - 'src/**'
      - 'styles.css'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckybean-ds-b-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Assemble DS-B debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Verify package and prepare download artifact
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          [[ "$badging" == *"package: name='com.luckybean.ds'"* ]]

          mkdir -p dist
          artifact="dist/LuckyBean-DS-B-${GITHUB_SHA:0:12}.apk"
          cp "$apk" "$artifact"
          sha256sum "$artifact" > dist/SHA256SUMS.txt
          printf 'source_sha=%s\nbranch=%s\napplication_id=com.luckybean.ds\nbuild_type=debug\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/BUILD_INFO.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-ds-b-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

