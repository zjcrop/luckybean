name: LuckyBean main build

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: luckybean-main-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:static
      - name: Restore official release keystore
        shell: bash
        env:
          LUCKYBEAN_KEYSTORE_B64: ${{ secrets.LUCKYBEAN_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$LUCKYBEAN_KEYSTORE_B64"
          printf '%s' "$LUCKYBEAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/luckybean-release.jks"
          chmod 600 "$RUNNER_TEMP/luckybean-release.jks"
      - name: Build signed Android release APK
        env:
          LUCKYBEAN_KEYSTORE_FILE: ${{ runner.temp }}/luckybean-release.jks
          LUCKYBEAN_STORE_PASSWORD: ${{ secrets.LUCKYBEAN_STORE_PASSWORD }}
          LUCKYBEAN_KEY_ALIAS: ${{ secrets.LUCKYBEAN_KEY_ALIAS }}
          LUCKYBEAN_KEY_PASSWORD: ${{ secrets.LUCKYBEAN_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Verify Android package contract
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          grep -q "versionCode 102313" android/app/build.gradle
          grep -q "versionName '1.23E'" android/app/build.gradle
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.luckybean.app' versionCode='102313' versionName='1.23E'"
          unzip -l "$apk" | grep -q 'assets/web-cache/public/vendor/jsqr/jsQR.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/features/gear-matching-controller.js'
          unzip -p "$apk" assets/web-cache/src/qr.js | grep -Fq 'public/vendor/jsqr/jsQR.js'
          if unzip -p "$apk" assets/web-cache/src/qr.js | grep -Fq 'decodeEncryptedShareEnvelope'; then exit 1; fi
          unzip -p "$apk" assets/web-cache/src/features/gear-matching-controller.js | grep -Fq '滤杯角度'
          unzip -p "$apk" assets/web-cache/src/features/gear-matching-controller.js | grep -Fq '过滤速度'
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq 'selectedBeanIdFromRuntime'
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq 'dripperSnapshot'
          unzip -p "$apk" assets/web-cache/src/domain/matching/flavor-vector.js | grep -Fq 'gear-correction/1.2'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'brewProfileOverride'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'data-brew-row="profile"'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'value="plain"'
          if unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'id="brewSegments"'; then exit 1; fi
          if unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'id="brewDripperMaterial"'; then exit 1; fi
          if unzip -p "$apk" | grep -aEq 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY'; then exit 1; fi
          expected_cert=$(tr -d '[:space:]:' < android/signing/CERT_SHA256.txt | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"
      - name: Package exact tested source
        shell: bash
        run: |
          mkdir -p dist
          zip -qr dist/LuckyBean-1.23E-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts docs DEVELOPMENT_STATUS.md
          cp android/app/build/outputs/apk/release/app-release.apk dist/LuckyBean-1.23E-release.apk
          printf 'source_sha=%s\nversion=1.23E\nversion_code=102313\nanalysis_contract=brew-analysis/2.1\nspatial_contract=brew-spatial/1.3\nmatching_contract=luckybean-match/1.1\nqr_runtime=local-jsqr-1.4.0\ngear_binding=dripper-angle-bypass-filter-speed\nbean_matching=direct-selected-bean-id\nandroid_gallery_uri=clipdata-first\nsmall_brew_layout=five-row\nprofile_default=model-recommended-transient-override\nwater_default=plain-no-added-recipe\n' "$SOURCE_SHA" > dist/BUILD_PROVENANCE.txt
          sha256sum dist/LuckyBean-1.23E-web.zip dist/LuckyBean-1.23E-release.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-v1.23E-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
