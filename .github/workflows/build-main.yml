name: LuckyBean main build

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: luckybean-main-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:static
      - name: Restore official release keystore
        shell: bash
        env:
          LUCKYBEAN_KEYSTORE_B64: ${{ secrets.LUCKYBEAN_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$LUCKYBEAN_KEYSTORE_B64"
          printf '%s' "$LUCKYBEAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/luckybean-release.jks"
          chmod 600 "$RUNNER_TEMP/luckybean-release.jks"
      - name: Build signed Android release APK
        env:
          LUCKYBEAN_KEYSTORE_FILE: ${{ runner.temp }}/luckybean-release.jks
          LUCKYBEAN_STORE_PASSWORD: ${{ secrets.LUCKYBEAN_STORE_PASSWORD }}
          LUCKYBEAN_KEY_ALIAS: ${{ secrets.LUCKYBEAN_KEY_ALIAS }}
          LUCKYBEAN_KEY_PASSWORD: ${{ secrets.LUCKYBEAN_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Verify Android package contract
        shell: bash
        run: |
          # GitHub's `shell: bash` wrapper starts bash with `-o pipefail`.
          # Positive checks below intentionally use `producer | grep -q`; grep
          # closes early after a match and unzip/aapt may then exit on SIGPIPE.
          # Disable inherited pipefail explicitly so grep remains the assertion.
          set -eu
          set +o pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          grep -q "versionCode 102322" android/app/build.gradle
          grep -q "versionName '1.23E'" android/app/build.gradle
          grep -q 'LuckyBeanNavigation' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'getOnBackInvokedDispatcher' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'handleSystemBack' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'recognitionRuntime.chineseRecognizer()' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'Shared bundled OCR runtime warmed in background' android/app/src/main/java/com/luckybean/app/LuckyBeanApplication.java
          grep -q 'android:enableOnBackInvokedCallback="true"' android/app/src/main/AndroidManifest.xml
          test -f "$apk"
          source_app_sha=$(sha256sum src/app.js | awk '{print $1}')
          apk_app_sha=$(unzip -p "$apk" assets/web-cache/src/app.js | sha256sum | awk '{print $1}')
          test "$source_app_sha" = "$apk_app_sha"
          source_engine_sha=$(sha256sum src/brew-engine.js | awk '{print $1}')
          apk_engine_sha=$(unzip -p "$apk" assets/web-cache/src/brew-engine.js | sha256sum | awk '{print $1}')
          test "$source_engine_sha" = "$apk_engine_sha"
          source_catalog_sha=$(sha256sum src/services/brew-profile-catalog-service.js | awk '{print $1}')
          apk_catalog_sha=$(unzip -p "$apk" assets/web-cache/src/services/brew-profile-catalog-service.js | sha256sum | awk '{print $1}')
          test "$source_catalog_sha" = "$apk_catalog_sha"
          printf 'verified_web_asset_sha=%s\n' "$source_app_sha"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.luckybean.app' versionCode='102322' versionName='1.23E'"
          unzip -l "$apk" | grep -q 'assets/web-cache/public/vendor/jsqr/jsQR.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/gear-controller.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/app-layout.css'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/professional-sensory.css'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/sensory-wizard-actions.css'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/bean-card-controller.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/navigation-controller.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/domain/beans/bean-lifecycle-service.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/domain/sensory/brew-optimization-assessment.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/domain/history/history-sensory-service.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/domain/recognition/recognition-pipeline.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/services/brew-calculation-coordinator.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/brew-optimization.css'
          unzip -l "$apk" | grep -q 'assets/web-cache/contracts/brew-optimization-v1.schema.json'
          unzip -l "$apk" | grep -q 'assets/web-cache/contracts/brew-optimization-validation-v1.schema.json'
          unzip -p "$apk" assets/web-cache/src/qr.js | grep -Fq 'public/vendor/jsqr/jsQR.js'
          if unzip -p "$apk" assets/web-cache/src/qr.js | grep -Fq 'decodeEncryptedShareEnvelope'; then exit 1; fi
          unzip -p "$apk" assets/web-cache/src/ui/navigation-controller.js | grep -Fq 'LuckyBeanNavigation'
          unzip -p "$apk" assets/web-cache/src/ui/navigation-controller.js | grep -Fq 'history.back()'
          unzip -p "$apk" assets/web-cache/src/ui/app-components.css | grep -Fq 'gap: 1em'
          unzip -p "$apk" assets/web-cache/src/ui/sensory-wizard-actions.css | grep -A3 -F '[data-v095-prev]' | grep -Fq 'grid-column: 2'
          unzip -p "$apk" assets/web-cache/src/ui/sensory-wizard-actions.css | grep -A3 -F '[data-v095-next]' | grep -Fq 'grid-column: 3'
          unzip -p "$apk" assets/web-cache/src/ui/gear-controller.js | grep -Fq '滤杯角度'
          unzip -p "$apk" assets/web-cache/src/ui/gear-controller.js | grep -Fq '过滤速度'
          unzip -p "$apk" assets/web-cache/src/ui/gear-controller.js | grep -Fq '名称和品牌仅用于识别'
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq 'selectedBeanIdFromRuntime'
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq 'dripperPhysical'
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq 'filterPaperPhysical'
          unzip -p "$apk" assets/web-cache/src/domain/matching/flavor-vector.js | grep -Fq 'gear-physics/1.0'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'brewProfileOverride'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'id="brewServeMode"'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'id="confirmBrewPreparedBtn"'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'preparationSpeech'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'data-brew-row="profile"'
          grep -Fq 'ACTION_ANNOUNCE' android/app/src/main/java/com/luckybean/app/BrewTimerService.java
          grep -Fq 'announceBrewPreparation' android/app/src/main/java/com/luckybean/app/MainActivity.java
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'value="plain"'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'completeOptimizationValidation'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'data-load-optimization'
          unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'processRecognitionDocument'
          unzip -p "$apk" assets/web-cache/src/domain/recognition/recognition-pipeline.js | grep -Fq 'RECOGNITION_PIPELINE_VERSION'
          unzip -p "$apk" assets/web-cache/src/package-capture-controller.js | grep -Fq '翻译与字段整理'
          unzip -p "$apk" assets/web-cache/src/package-capture-controller.js | grep -Fq '确认并进入豆卡'
          if unzip -p "$apk" assets/web-cache/src/ui-layout-controller.js | grep -Fq "addEventListener('click', interceptRecognitionParse"; then exit 1; fi
          unzip -p "$apk" assets/web-cache/src/domain/sensory/brew-optimization-assessment.js | grep -Fq 'totalScoreUsedAsTrigger:false'
          unzip -p "$apk" assets/web-cache/src/renderers/brew-spatial-controller.js | grep -Fq 'retryLastRender'
          unzip -p "$apk" assets/web-cache/src/renderers/brew-spatial-view.js | grep -Fq '用于观察趋势及参数变化的相对影响'
          if unzip -l "$apk" | grep -Eq 'interaction-repair|experience-fixes|gear-regression-fix|legacy-timer-guard|gear-matching-controller'; then exit 1; fi
          if unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'id="brewSegments"'; then exit 1; fi
          if unzip -p "$apk" assets/web-cache/src/app.js | grep -Fq 'id="brewDripperMaterial"'; then exit 1; fi
          secret_scan_dir=$(mktemp -d)
          unzip -qq "$apk" 'assets/web-cache/*' -d "$secret_scan_dir"
          if grep -RIEq -- 'sb_secret_[A-Za-z0-9_-]{12,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$secret_scan_dir"; then exit 1; fi
          rm -rf "$secret_scan_dir"
          expected_cert=$(tr -d '[:space:]:' < android/signing/CERT_SHA256.txt | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"
      - name: Package exact tested source
        shell: bash
        run: |
          mkdir -p dist
          zip -qr dist/LuckyBean-1.23E-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts schemas docs DEVELOPMENT_STATUS.md
          cp android/app/build/outputs/apk/release/app-release.apk dist/LuckyBean-1.23E-release.apk
          printf 'source_sha=%s\nversion=1.23E\nversion_code=102322\nrevision=1.23E-main-sync.11\nanalysis_contract=brew-analysis/2.1\nspatial_contract=brew-spatial/1.3\noptimization_contract=brew-optimization-assessment/1.0\noptimization_validation_contract=brew-optimization-validation/1.0\ncalculation_coordinator=latest-wins-profile-preserving\nspatial_failure=same-input-retry-only\nmatching_contract=luckybean-match/1.1\ngear_physics_contract=gear-physics/1.0\nqr_runtime=local-jsqr-1.4.0\ngear_binding=resolved-physical-snapshot\nbean_matching=direct-selected-bean-id\nandroid_gallery_uri=clipdata-first\nsmall_brew_layout=five-row-hot-cold\nprofile_default=automatic-transient-override\ndose_default=automatic-profile-reference\npreparation_voice=ice-and-first-stage\nwater_default=plain-no-added-recipe\nnavigation_back=internal-stack-overlay-first\nandroid_back=legacy-and-predictive\nbean_metadata_gap=one-em\nsensory_actions=cancel-prev-next-equal-row\nui_architecture=canonical-no-repair-guards\n' "$SOURCE_SHA" > dist/BUILD_PROVENANCE.txt
          sha256sum dist/LuckyBean-1.23E-web.zip dist/LuckyBean-1.23E-release.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-v1.23E-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
