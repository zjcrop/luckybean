name: LuckyBean main signed release

on:
  workflow_run:
    workflows: ["LuckyBean main web deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: luckybean-main-signed-release
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - id: meta
        name: Load canonical release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .displayVersion release.json)
          revision=$(jq -r .revision release.json)
          tag=$(jq -r .releaseTag release.json)
          version_code=$(jq -r .androidVersionCode release.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "DISPLAY_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: Verify immutable Pages and main-test gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          test "$current_main" = "$SOURCE_SHA"
          pages_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/status/${DISPLAY_VERSION}.json?ref=pages-status" --jq '.content' | base64 --decode)
          test "$(printf '%s' "$pages_json" | jq -r '.source_sha')" = "$SOURCE_SHA"
          test "$(printf '%s' "$pages_json" | jq -r '.revision')" = "$RELEASE_REVISION"
          test "$(printf '%s' "$pages_json" | jq -r '.verified')" = true
          test "$(printf '%s' "$pages_json" | jq -r '.browser_smoke')" = true
          test "$(printf '%s' "$pages_json" | jq -r '.same_sha_main_tests')" = true
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test-main.yml/runs?branch=main&head_sha=$SOURCE_SHA&per_page=10")
          status=$(printf '%s' "$runs" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // "missing"')
          conclusion=$(printf '%s' "$runs" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // "missing"')
          test "$status" = completed
          test "$conclusion" = success
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-meta.mjs
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:static
      - name: Restore official release keystore
        shell: bash
        env:
          LUCKYBEAN_KEYSTORE_B64: ${{ secrets.LUCKYBEAN_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$LUCKYBEAN_KEYSTORE_B64"
          printf '%s' "$LUCKYBEAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/luckybean-release.jks"
          chmod 600 "$RUNNER_TEMP/luckybean-release.jks"
      - name: Build signed APK
        env:
          LUCKYBEAN_KEYSTORE_FILE: ${{ runner.temp }}/luckybean-release.jks
          LUCKYBEAN_STORE_PASSWORD: ${{ secrets.LUCKYBEAN_STORE_PASSWORD }}
          LUCKYBEAN_KEY_ALIAS: ${{ secrets.LUCKYBEAN_KEY_ALIAS }}
          LUCKYBEAN_KEY_PASSWORD: ${{ secrets.LUCKYBEAN_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Verify package identity embedded source and certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.luckybean.app' versionCode='${ANDROID_VERSION_CODE}' versionName='${DISPLAY_VERSION}'"
          unzip -p "$apk" assets/web-cache/release.json > /tmp/apk-release.json
          test "$(jq -r .displayVersion /tmp/apk-release.json)" = "$DISPLAY_VERSION"
          test "$(jq -r .revision /tmp/apk-release.json)" = "$RELEASE_REVISION"
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq "application-version\" content=\"$DISPLAY_VERSION\""
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq "release-revision\" content=\"$RELEASE_REVISION\""
          unzip -p "$apk" assets/web-cache/sw.js | grep -Fq "REVISION = '$RELEASE_REVISION'"
          unzip -p "$apk" assets/web-cache/src/contracts/brew-contract-adapter.js | grep -Fq "luckybean-brew-contract-adapter/${DISPLAY_VERSION}.2"
          source_app_sha=$(sha256sum src/app.js | awk '{print $1}')
          apk_app_sha=$(unzip -p "$apk" assets/web-cache/src/app.js | sha256sum | awk '{print $1}')
          test "$source_app_sha" = "$apk_app_sha"
          expected_cert=$(tr -d '[:space:]:' < android/signing/CERT_SHA256.txt | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"
          printf '%s' "$actual_cert" > /tmp/luckybean-cert-sha256.txt
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_name="LuckyBean-${DISPLAY_VERSION}-release.apk"
          web_name="LuckyBean-${DISPLAY_VERSION}-web.zip"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$apk_name"
          zip -qr "dist/$web_name" index.html recognition-test.html manifest.webmanifest release.json sw.js styles.css src public contracts schemas docs DEVELOPMENT_STATUS.md
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$DISPLAY_VERSION" \
            --arg revision "$RELEASE_REVISION" \
            --arg version_code "$ANDROID_VERSION_CODE" \
            --arg signing official-release-keystore \
            --arg brew_result "$(jq -r .brewResultVersion release.json)" \
            --arg brew_plan "$(jq -r .brewPlanVersion release.json)" \
            '{source_sha:$source_sha,version:$version,revision:$revision,version_code:($version_code|tonumber),signing:$signing,brew_result:$brew_result,brew_plan:$brew_plan,web_gate_verified:true,main_test_verified:true}' \
            > dist/BUILD_PROVENANCE.json
          sha256sum "dist/$apk_name" "dist/$web_name" > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-${{ steps.meta.outputs.version }}-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_name="LuckyBean-${DISPLAY_VERSION}-release.apk"
          web_name="LuckyBean-${DISPLAY_VERSION}-web.zip"
          notes="${DISPLAY_VERSION} ${RELEASE_REVISION} signed release. Same-SHA tests, Pages browser smoke, embedded source parity and official certificate are verified before publication."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -f "$RELEASE_TAG" "$SOURCE_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --target "$SOURCE_SHA" --title "LuckyBean ${DISPLAY_VERSION}" --notes "$notes"
            gh release upload "$RELEASE_TAG" "dist/$apk_name" "dist/$web_name" dist/BUILD_PROVENANCE.json dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$apk_name" "dist/$web_name" dist/BUILD_PROVENANCE.json dist/SHA256SUMS.txt --target "$SOURCE_SHA" --title "LuckyBean ${DISPLAY_VERSION}" --notes "$notes"
          fi
          tag_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          test "$tag_sha" = "$SOURCE_SHA"
          printf '%s' "$tag_sha" > /tmp/luckybean-release-target-sha.txt
      - name: Write verifiable release receipt
        shell: bash
        run: |
          set -euo pipefail
          cert=$(cat /tmp/luckybean-cert-sha256.txt)
          release_target_sha=$(cat /tmp/luckybean-release-target-sha.txt)
          apk_name="LuckyBean-${DISPLAY_VERSION}-release.apk"
          web_name="LuckyBean-${DISPLAY_VERSION}-web.zip"
          apk_sha=$(sha256sum "dist/$apk_name" | awk '{print $1}')
          web_sha=$(sha256sum "dist/$web_name" | awk '{print $1}')
          receipt=$(mktemp)
          jq -n \
            --arg version "$DISPLAY_VERSION" \
            --arg revision "$RELEASE_REVISION" \
            --arg source_sha "$SOURCE_SHA" \
            --arg release_tag "$RELEASE_TAG" \
            --arg release_target_sha "$release_target_sha" \
            --arg apk "$apk_name" \
            --arg apk_sha256 "$apk_sha" \
            --arg web_sha256 "$web_sha" \
            --arg certificate_sha256 "$cert" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            '{version:$version,revision:$revision,source_sha:$source_sha,release_tag:$release_tag,release_target_sha:$release_target_sha,release_target_verified:true,apk:$apk,apk_sha256:$apk_sha256,web_sha256:$web_sha256,certificate_sha256:$certificate_sha256,certificate_verified:true,published:true,web_gate_verified:true,main_test_verified:true,release_metadata_verified:true,generated_at:$generated_at}' \
            > "$receipt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin release-status >/dev/null 2>&1; then
            git fetch origin release-status:release-status
            git switch release-status
          else
            git switch --orphan release-status
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p status
          cp "$receipt" "status/${DISPLAY_VERSION}.json"
          git add "status/${DISPLAY_VERSION}.json"
          git commit -m "release-status: LuckyBean ${DISPLAY_VERSION} $SOURCE_SHA" || true
          git push origin HEAD:release-status
