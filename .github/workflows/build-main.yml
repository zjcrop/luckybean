name: LuckyBean main build

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: luckybean-main-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:static
      - name: Build Android debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify Android package contract
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          grep -q "applicationId 'com.luckybean.app'" android/app/build.gradle
          grep -q "versionCode 102308" android/app/build.gradle
          grep -q "versionName '1.23E'" android/app/build.gradle
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.luckybean.app' versionCode='102308' versionName='1.23E'"
          unzip -l "$apk" | grep -q 'assets/web-cache/index.html'
          unzip -l "$apk" | grep -q 'assets/web-cache/public/vendor/jsqr/jsQR.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/qr.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/qr-ui-controller.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/features/interaction-repair-controller.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/ui/interaction-repair.css'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/services/brew-analysis-service.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/brew-engine-core.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/features/freshness-timeline-controller.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/recognition-bridge.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/package-capture-controller.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/native-bridge.js'
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq 'application-version" content="1.23E'
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq 'release-revision" content="1.23E-main-sync.2'
          unzip -p "$apk" assets/web-cache/src/qr.js | grep -Fq 'public/vendor/jsqr/jsQR.js'
          if unzip -p "$apk" assets/web-cache/src/qr.js | grep -Fq 'cdn.jsdelivr.net'; then
            echo 'QR runtime still depends on CDN'
            exit 1
          fi
          unzip -p "$apk" assets/web-cache/src/qr-ui-controller.js | grep -Fq 'cameraRetryBtn'
          unzip -p "$apk" assets/web-cache/src/features/interaction-repair-controller.js | grep -Fq "const FLAVOR_GROUPS = ['花香', '果香', '茶感', '香料', '其他']"
          unzip -p "$apk" assets/web-cache/src/features/interaction-repair-controller.js | grep -Fq 'flavorText: flavorNames.join'
          unzip -p "$apk" assets/web-cache/src/features/interaction-repair-controller.js | grep -Fq '豆卡自动推荐'
          unzip -p "$apk" assets/web-cache/src/features/interaction-repair-controller.js | grep -Fq '使用说明'
          unzip -p "$apk" assets/web-cache/src/ui/interaction-repair.css | grep -Fq 'border-radius:6px!important'
          unzip -p "$apk" assets/web-cache/src/features/freshness-timeline-controller.js | grep -Fq "const STAGES = ['养豆中', '味正盛', '味将尽']"
          unzip -p "$apk" assets/web-cache/src/features/freshness-timeline-controller.js | grep -Fq 'freshnessProfile(bean).progress'
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq "BREW_ANALYSIS_CONTRACT = 'brew-analysis/2.1'"
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq "BREW_SPATIAL_CONTRACT = 'brew-spatial/1.3'"
          unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -Fq "BREW_FLAVOR_STATE_CONTRACT = 'brew-flavor-state/1.0'"
          unzip -p "$apk" assets/web-cache/src/brew-engine-core.js | grep -Fq "'brew-analysis/2.0', 'brew-analysis/2.1'"
          unzip -p "$apk" assets/web-cache/src/domain/matching/flavor-vector.js | grep -Fq "MATCH_CONTRACT = 'luckybean-match/1.1'"
          unzip -p "$apk" assets/web-cache/src/recognition-bridge.js | grep -Fq "dataUrl: nativeSource ? '' : await blobToDataUrl(image.blob)"
          unzip -p "$apk" assets/web-cache/src/package-capture-controller.js | grep -Fq 'bindAndroidImageSource(id, nativeSource)'
          grep -q 'bindImageSource(String imageId, boolean includePreview)' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'ImageDecoder.createSource' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'LuckyBeanAndroid/1.23E' android/app/src/main/java/com/luckybean/app/MainActivity.java
          if unzip -p "$apk" | grep -aEq 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY'; then
            echo 'Server secret material found in APK'
            exit 1
          fi
      - name: Package exact tested source
        shell: bash
        run: |
          mkdir -p dist
          zip -qr dist/LuckyBean-1.23E-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts docs DEVELOPMENT_STATUS.md
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LuckyBean-1.23E-debug.apk
          printf 'source_sha=%s\nversion=1.23E\nversion_code=102308\nanalysis_contract=brew-analysis/2.1\nspatial_contract=brew-spatial/1.3\nmatching_contract=luckybean-match/1.1\nqr_runtime=local-jsqr-1.4.0\nfreshness_timeline=restored-historical-profile\n' "$SOURCE_SHA" > dist/BUILD_PROVENANCE.txt
          sha256sum dist/LuckyBean-1.23E-web.zip dist/LuckyBean-1.23E-debug.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-v1.23E-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
