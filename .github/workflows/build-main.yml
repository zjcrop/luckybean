name: LuckyBean main signed release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-main-signed-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: v1.24B-main.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Validate source
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:static
          grep -Fq 'release-revision" content="1.24B-main.4"' index.html
          grep -Fq 'release-1.24b-polish.js?v=1.24B-main.4' index.html
          grep -Fq 'release-1.24b-transit-controller.js?v=1.24B-main.4' index.html
          grep -Fq 'release-1.24b-group-navigation.js?v=1.24B-main.4' index.html
          grep -Fq 'release-1.24b-about-controller.js?v=1.24B-main.4' index.html
          grep -Fq "REVISION = '1.24B-main.4'" sw.js
          grep -Fq 'main-4-interaction3' sw.js
          grep -Fq 'release-1.24b-ui-policy.js' sw.js
          grep -Fq 'src/ui/sortable-controller.js' sw.js
          grep -Fq 'sensory-tag-sort-controller.js' sw.js
          grep -Fq "feature('shared-sortable'" src/features/runtime-features.js
          grep -Fq 'sensory-tag-sort-controller.js' src/features/runtime-features.js
          grep -Fq 'async function closeActiveGroup' src/bean-groups-controller.js
          ! grep -Fq 'data-v099t-group-back' src/bean-groups-controller.js
          grep -Fq 'api.closeActiveGroup' src/features/release-1.24b-group-navigation.js
          ! grep -Fq 'data-v099t-group-back' src/features/release-1.24b-group-navigation.js
          grep -Fq 'lb-sort-ghost' src/ui/sortable-controller.js
          grep -Fq 'lb-sort-placeholder' src/ui/sortable-controller.js
          grep -Fq 'onPreview' src/ui/sortable-controller.js
          grep -Fq 'onCommit' src/ui/sortable-controller.js
          grep -Fq 'LuckyBeanSortable' src/features/sensory-tag-sort-controller.js
          grep -Fq '双击移除' src/features/sensory-tag-sort-controller.js
          grep -Fq '实时预览松手后的顺序' src/features/sensory-tag-sort-controller.js
          grep -Fq 'professional-sensory-complete' src/features/sensory-tag-sort-controller.js
          grep -Fq "UI_POLICY_REVISION = '1.24B-main.4'" src/features/release-1.24b-ui-policy.js
          grep -Fq "button.textContent = '合并云端'" src/features/release-1.24b-ui-policy.js
          grep -Fq 'aspect-ratio: 2 / 1' src/features/release-1.24b-ui-policy.js
          grep -Fq '#brewContent button:not(.lb-brew-switch)' src/features/release-1.24b-ui-policy.js
          grep -Fq "observe('brewContent')" src/features/release-1.24b-ui-policy.js
          grep -Fq 'release-1.24b-freshness-detail.js' sw.js
          grep -Fq 'recognition-batch-progress-controller.js' sw.js
          grep -Fq 'recognition-field-resolver-1.24b.js' sw.js
          grep -Fq 'grind-psd-reference-service.js' sw.js
      - name: Synchronize Android runtime version marker
        shell: bash
        run: |
          set -euo pipefail
          file=android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -Fq 'LuckyBeanAndroid/1.24B' "$file"
          ! grep -Fq 'LuckyBeanAndroid/1.23E' "$file"
      - name: Restore official release keystore
        shell: bash
        env:
          LUCKYBEAN_KEYSTORE_B64: ${{ secrets.LUCKYBEAN_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$LUCKYBEAN_KEYSTORE_B64"
          printf '%s' "$LUCKYBEAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/luckybean-release.jks"
          chmod 600 "$RUNNER_TEMP/luckybean-release.jks"
      - name: Build signed APK
        env:
          LUCKYBEAN_KEYSTORE_FILE: ${{ runner.temp }}/luckybean-release.jks
          LUCKYBEAN_STORE_PASSWORD: ${{ secrets.LUCKYBEAN_STORE_PASSWORD }}
          LUCKYBEAN_KEY_ALIAS: ${{ secrets.LUCKYBEAN_KEY_ALIAS }}
          LUCKYBEAN_KEY_PASSWORD: ${{ secrets.LUCKYBEAN_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Verify package, embedded source, and certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.luckybean.app' versionCode='102402' versionName='1.24B'"
          grep -Fq 'LuckyBeanAndroid/1.24B' android/app/src/main/java/com/luckybean/app/MainActivity.java
          for asset in \
            assets/web-cache/src/features/release-1.24b-integration.js \
            assets/web-cache/src/features/release-1.24b-finalize.js \
            assets/web-cache/src/features/release-1.24b-transit-controller.js \
            assets/web-cache/src/features/release-1.24b-group-navigation.js \
            assets/web-cache/src/features/release-1.24b-about-controller.js \
            assets/web-cache/src/features/release-1.24b-polish.js \
            assets/web-cache/src/features/release-1.24b-ui-policy.js \
            assets/web-cache/src/features/release-1.24b-freshness-detail.js \
            assets/web-cache/src/features/recognition-batch-progress-controller.js \
            assets/web-cache/src/ui/sortable-controller.js \
            assets/web-cache/src/features/sensory-tag-sort-controller.js \
            assets/web-cache/src/features/runtime-features.js \
            assets/web-cache/src/bean-groups-controller.js \
            assets/web-cache/src/domain/recognition/recognition-field-resolver-1.24b.js \
            assets/web-cache/src/services/grind-psd-reference-service.js \
            assets/web-cache/src/domain/recognition/order-recognition-1.24b.js \
            assets/web-cache/src/data/local-brew-recipes-1.24b.js \
            assets/web-cache/src/release-1.24b.js; do
            unzip -l "$apk" | grep -Fq "$asset"
          done
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq 'release-revision" content="1.24B-main.4"'
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq 'release-1.24b-polish.js?v=1.24B-main.4'
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq 'release-1.24b-transit-controller.js?v=1.24B-main.4'
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq 'release-1.24b-group-navigation.js?v=1.24B-main.4'
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq 'release-1.24b-about-controller.js?v=1.24B-main.4'
          unzip -p "$apk" assets/web-cache/sw.js | grep -Fq "REVISION = '1.24B-main.4'"
          unzip -p "$apk" assets/web-cache/sw.js | grep -Fq 'main-4-interaction3'
          unzip -p "$apk" assets/web-cache/sw.js | grep -Fq 'src/ui/sortable-controller.js'
          unzip -p "$apk" assets/web-cache/sw.js | grep -Fq 'sensory-tag-sort-controller.js'
          unzip -p "$apk" assets/web-cache/src/features/runtime-features.js | grep -Fq "feature('shared-sortable'"
          unzip -p "$apk" assets/web-cache/src/features/runtime-features.js | grep -Fq 'sensory-tag-sort-controller.js'
          unzip -p "$apk" assets/web-cache/src/ui/sortable-controller.js | grep -Fq 'lb-sort-ghost'
          unzip -p "$apk" assets/web-cache/src/ui/sortable-controller.js | grep -Fq 'lb-sort-placeholder'
          unzip -p "$apk" assets/web-cache/src/ui/sortable-controller.js | grep -Fq 'onPreview'
          unzip -p "$apk" assets/web-cache/src/ui/sortable-controller.js | grep -Fq 'onCommit'
          unzip -p "$apk" assets/web-cache/src/features/release-1.24b-ui-policy.js | grep -Fq "UI_POLICY_REVISION = '1.24B-main.4'"
          unzip -p "$apk" assets/web-cache/src/features/release-1.24b-ui-policy.js | grep -Fq "button.textContent = '合并云端'"
          unzip -p "$apk" assets/web-cache/src/features/release-1.24b-ui-policy.js | grep -Fq '#brewContent button:not(.lb-brew-switch)'
          unzip -p "$apk" assets/web-cache/src/bean-groups-controller.js | grep -Fq 'async function closeActiveGroup'
          ! unzip -p "$apk" assets/web-cache/src/bean-groups-controller.js | grep -Fq 'data-v099t-group-back'
          unzip -p "$apk" assets/web-cache/src/features/release-1.24b-group-navigation.js | grep -Fq 'api.closeActiveGroup'
          ! unzip -p "$apk" assets/web-cache/src/features/release-1.24b-group-navigation.js | grep -Fq 'data-v099t-group-back'
          unzip -p "$apk" assets/web-cache/src/features/sensory-tag-sort-controller.js | grep -Fq 'LuckyBeanSortable'
          unzip -p "$apk" assets/web-cache/src/features/sensory-tag-sort-controller.js | grep -Fq '实时预览松手后的顺序'
          unzip -p "$apk" assets/web-cache/src/features/sensory-tag-sort-controller.js | grep -Fq 'professional-sensory-complete'
          unzip -p "$apk" assets/web-cache/src/features/release-1.24b-about-controller.js | grep -Fq '端茶倒水的秦始皇🐻'
          unzip -p "$apk" assets/web-cache/src/features/release-1.24b-freshness-detail.js | grep -Fq '完整赏味期曲线'
          unzip -p "$apk" assets/web-cache/src/features/recognition-batch-progress-controller.js | grep -Fq '正在识别'
          unzip -p "$apk" assets/web-cache/src/domain/recognition/recognition-field-resolver-1.24b.js | grep -Fq 'explicit-label > confidence > multi-image-consensus > weak-inference'
          unzip -p "$apk" assets/web-cache/src/recognition-bridge.js | grep -Fq 'luckybean.recognition.batch.1.24b'
          source_app_sha=$(sha256sum src/app.js | awk '{print $1}')
          apk_app_sha=$(unzip -p "$apk" assets/web-cache/src/app.js | sha256sum | awk '{print $1}')
          test "$source_app_sha" = "$apk_app_sha"
          expected_cert=$(tr -d '[:space:]:' < android/signing/CERT_SHA256.txt | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"
          printf '%s' "$actual_cert" > /tmp/luckybean-cert-sha256.txt
      - name: Package release
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/LuckyBean-1.24B-release.apk
          zip -qr dist/LuckyBean-1.24B-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts schemas docs DEVELOPMENT_STATUS.md
          printf 'source_sha=%s\nversion=1.24B\nversion_code=102402\nrevision=1.24B-main.4\nsigning=official-release-keystore\nandroid_runtime_marker=LuckyBeanAndroid/1.24B\nrecognition_queue=serial-one-image-persistent\nrecognition_arbitration=explicit-confidence-consensus-inference\nbean_lifecycle=ordered-delivered-storage-history\nstorage_modes=room-refrigerated-frozen\nfreshness_detail=full-expandable\norder_ocr=privacy-minimized\ngrind_psd=measured-reference-plus-custom-anchors\ngroup_navigation=canonical-state-api\ncache=main-4-interaction3\nsortable=shared-live-preview-ghost-placeholder\nsensory_sort=single-activate-double-remove-longpress-preview\nbrew_ui=text-interactions\nabout_contacts=inside-about-section\nui_architecture=canonical-1.24b-main.4\n' "$SOURCE_SHA" > dist/BUILD_PROVENANCE.txt
          sha256sum dist/LuckyBean-1.24B-release.apk dist/LuckyBean-1.24B-web.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-v1.24B-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/LuckyBean-1.24B-release.apk dist/LuckyBean-1.24B-web.zip dist/BUILD_PROVENANCE.txt dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/LuckyBean-1.24B-release.apk dist/LuckyBean-1.24B-web.zip dist/BUILD_PROVENANCE.txt dist/SHA256SUMS.txt --target "$SOURCE_SHA" --title "LuckyBean 1.24B" --notes "1.24B main.4 signed release. APK certificate is verified against android/signing/CERT_SHA256.txt before publication."
          fi
      - name: Write verifiable release receipt
        shell: bash
        run: |
          set -euo pipefail
          cert=$(cat /tmp/luckybean-cert-sha256.txt)
          apk_sha=$(sha256sum dist/LuckyBean-1.24B-release.apk | awk '{print $1}')
          web_sha=$(sha256sum dist/LuckyBean-1.24B-web.zip | awk '{print $1}')
          receipt=$(mktemp)
          printf '{"version":"1.24B","revision":"1.24B-main.4","source_sha":"%s","release_tag":"%s","apk":"LuckyBean-1.24B-release.apk","apk_sha256":"%s","web_sha256":"%s","certificate_sha256":"%s","certificate_verified":true,"published":true,"sortable":"shared-live-preview-ghost-placeholder","sensory_sort":"single-activate-double-remove-longpress-preview","brew_ui":"text-interactions","generated_at":"%s"}\n' "$SOURCE_SHA" "$RELEASE_TAG" "$apk_sha" "$web_sha" "$cert" "$(date -u +%FT%TZ)" > "$receipt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin release-status >/dev/null 2>&1; then
            git fetch origin release-status:release-status
            git switch release-status
          else
            git switch --orphan release-status
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p status
          cp "$receipt" status/1.24B.json
          git add status/1.24B.json
          git commit -m "release-status: LuckyBean 1.24B $SOURCE_SHA" || true
          git push origin HEAD:release-status