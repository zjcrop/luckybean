name: LuckyBean main build

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: luckybean-main-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:static
      - name: Build Android debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify Android package contract
        shell: bash
        run: |
          grep -q "applicationId 'com.luckybean.app'" android/app/build.gradle
          grep -q "versionCode 102304" android/app/build.gradle
          grep -q "versionName '1.23D'" android/app/build.gradle
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.luckybean.app' versionCode='102304' versionName='1.23D'"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web-cache/index.html'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web-cache/src/services/brew-profile-catalog-service.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web-cache/src/services/brew-analysis-service.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web-cache/src/renderers/brew-spatial-controller.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web-cache/recognition-test.html'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web-cache/contracts/luckybean-archive-v1.schema.json'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/web-cache/src/domain/recognition/recognition-date-classifier.js'
          grep -q 'addJavascriptInterface(new NativeFileBridge(), "LuckyBeanNative")' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'Intent.ACTION_CREATE_DOCUMENT' android/app/src/main/java/com/luckybean/app/MainActivity.java
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/web-cache/native-bridge.js | grep -Fq 'https://zjcrop.github.io/luckybean/'
          if unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/web-cache/native-bridge.js | grep -aFq 'https://zjcrop.github.io/BrewIon/luckybean/'; then
            echo 'Retired Android share URL found in APK'
            exit 1
          fi
          if unzip -p android/app/build/outputs/apk/debug/app-debug.apk | grep -aEq 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY'; then
            echo 'Server secret material found in APK'
            exit 1
          fi
      - name: Package exact tested source
        shell: bash
        run: |
          mkdir -p dist
          zip -qr dist/LuckyBean-1.23D-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts docs DEVELOPMENT_STATUS.md
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LuckyBean-1.23D-debug.apk
          printf 'source_sha=%s\nversion=1.23D\nversion_code=102304\n' "$SOURCE_SHA" > dist/BUILD_PROVENANCE.txt
          sha256sum dist/LuckyBean-1.23D-web.zip dist/LuckyBean-1.23D-debug.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-v1.23D-${{ env.SOURCE_SHA }}
          path: dist/
          if-no-files-found: error
