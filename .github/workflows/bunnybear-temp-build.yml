name: BunnyBear 2.4 cycle calendar APK

on:
  push:
    branches:
      - 'build/bunnybear-v2.4-cycle-calendar-20260910'
    paths:
      - 'bunnybear_migration/**'
      - '.github/workflows/bunnybear-temp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - name: Restore and verify exact tested cycle patch
        shell: bash
        run: |
          set -euo pipefail
          out=bunnybear_migration/app/src/main/assets/patch
          chunks=bunnybear_migration/patch_chunks
          mkdir -p "$out"
          cat "$chunks"/bb_cycle_core.js.*.b64 | base64 -d > "$out/bb_cycle_core.js"
          cat "$chunks"/bb_runtime_patch.js.*.b64 | base64 -d > "$out/bb_runtime_patch.js"
          cat "$chunks"/bb_v1_5.css.*.b64 | base64 -d > "$out/bb_v2_4.css"
          echo '6b8abb0ee9a8c8df0726bf7dc0f246ad4e2ff44effcfd79d66894043c624cac9  bunnybear_migration/app/src/main/assets/patch/bb_cycle_core.js' | sha256sum -c -
          echo '66bb9c56838e5ad7a8d73f83cee05206f81a9ce219f55521ecb265713f1d0c41  bunnybear_migration/app/src/main/assets/patch/bb_runtime_patch.js' | sha256sum -c -
          echo '16cb59a69be334df41e3f8cb8624275be6618026d7227197ccecc0b8d8f6ab58  bunnybear_migration/app/src/main/assets/patch/bb_v2_4.css' | sha256sum -c -
          node --check "$out/bb_cycle_core.js"
          node --check "$out/bb_runtime_patch.js"
          cp "$out/bb_cycle_core.js" /tmp/bb_cycle_core.cjs
          node - <<'NODE'
          const c=require('/tmp/bb_cycle_core.cjs');
          if(c.VERSION!=='bb-cycle/2.0') throw new Error('cycle core version mismatch: '+String(c.VERSION));
          const rec={
            '2026-01-01':{period_today:1},
            '2026-01-02':{period_today:1},
            '2026-02-05':{period_today:1},
            '2026-02-06':{period_today:1},
            '2026-03-12':{period_today:1},
            '2026-03-13':{period_today:1}
          };
          const d=c.buildDerivedState(rec);
          if(!d || !d.stats || d.stats.center!==35) throw new Error('35-day personal cycle smoke failed');
          if(!Array.isArray(d.historical) || d.historical.length!==2) throw new Error('closed cycle derivation failed');
          console.log('BunnyBear cycle core smoke: PASS');
          NODE
      - name: Fix migration invariant before build
        shell: bash
        run: |
          set -euo pipefail
          src=bunnybear_migration/app/src/main/java/com/yuelan/bb8/MainActivity.java
          grep -Fq 'if (afterFiles < beforeFiles + 1)' "$src"
          sed -i 's/if (afterFiles < beforeFiles + 1)/if (afterFiles != beforeFiles)/' "$src"
          grep -Fq 'if (afterFiles != beforeFiles)' "$src"
      - name: Build APK
        run: gradle --no-daemon -p bunnybear_migration :app:assembleDebug
      - name: Verify APK identity and embedded patch
        shell: bash
        run: |
          set -euo pipefail
          apk=bunnybear_migration/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.yuelan.bb8' versionCode='240' versionName='2.4.0'"
          unzip -l "$apk" | grep -q 'assets/patch/bb_cycle_core.js'
          unzip -l "$apk" | grep -q 'assets/patch/bb_runtime_patch.js'
          unzip -l "$apk" | grep -q 'assets/patch/bb_v2_4.css'
          test "$(unzip -p "$apk" assets/patch/bb_cycle_core.js | sha256sum | awk '{print $1}')" = '6b8abb0ee9a8c8df0726bf7dc0f246ad4e2ff44effcfd79d66894043c624cac9'
          test "$(unzip -p "$apk" assets/patch/bb_runtime_patch.js | sha256sum | awk '{print $1}')" = '66bb9c56838e5ad7a8d73f83cee05206f81a9ce219f55521ecb265713f1d0c41'
          test "$(unzip -p "$apk" assets/patch/bb_v2_4.css | sha256sum | awk '{print $1}')" = '16cb59a69be334df41e3f8cb8624275be6618026d7227197ccecc0b8d8f6ab58'
          unzip -p "$apk" classes.dex >/dev/null
          mkdir -p dist
          cp "$apk" dist/BunnyBear-v2.4.0-cycle-calendar.apk
          sha256sum dist/BunnyBear-v2.4.0-cycle-calendar.apk > dist/SHA256SUMS.txt
          cat > dist/BUILD_NOTES.txt <<'EOF'
          BunnyBear 2.4.0 cycle-calendar migration APK
          package: com.yuelan.bb8
          minSdk: 24 (Android 7.0+)
          First launch must occur while an earlier BunnyBear com.yuelan.bbN APK is still installed.
          The migration host copies the complete old APK AssetManager tree byte-for-byte, retains index.original.html,
          verifies every external image hash before/after patching, then injects the exact tested cycle/calendar patch.
          Source images/assets are never replaced by generated placeholders.
          EOF
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: BunnyBear-v2.4.0-cycle-calendar
          path: dist/
          if-no-files-found: error
