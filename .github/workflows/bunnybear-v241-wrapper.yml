name: BunnyBear 2.4.1 native wrapper

on:
  push:
    branches:
      - 'build/bunnybear-v2.4.1-interaction-20260910'
    paths:
      - 'bunnybear_migration/**'
      - '.github/workflows/bunnybear-v241-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - name: Build native wrapper
        run: gradle --no-daemon -p bunnybear_migration :app:assembleDebug
      - name: Verify and stage wrapper
        shell: bash
        run: |
          set -euo pipefail
          apk=bunnybear_migration/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.yuelan.bb9' versionCode='241' versionName='2.4.1'"
          mkdir -p dist
          cp "$apk" dist/BunnyBear-v2.4.1-native-wrapper.apk
          unzip -p "$apk" classes.dex > dist/classes.dex
          test -s dist/classes.dex
          printf '%s\n' '--- DEX bridge markers (informational) ---'
          strings dist/classes.dex | grep -E 'AndroidApp|finishAndRemoveTask|handleNativeBack|AndroidWebdav|AndroidFiles|AndroidBar' || true
          sha256sum dist/BunnyBear-v2.4.1-native-wrapper.apk dist/classes.dex > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: BunnyBear-v2.4.1-native-wrapper
          path: dist/
          if-no-files-found: error
