name: Keep only Lucky Bean main branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-branches-v091.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete all non-main branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            if [[ "$branch" != "main" ]]; then
              git push origin --delete "$branch" || true
            fi
          done < <(git ls-remote --heads origin | awk '{print $2}')
      - name: Remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-branches-v091.yml
          rm -f .github/workflows/promote-v091.yml
          rm -f .github/workflows/prepare-v091-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: keep only main and remove temporary release workflows'
            git push origin HEAD:main
          fi
