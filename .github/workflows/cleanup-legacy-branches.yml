name: One-time legacy branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete every non-canonical branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          keep_branch() {
            case "$1" in
              main|ci-status|pages-status|release-status) return 0 ;;
              *) return 1 ;;
            esac
          }

          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          failures=0
          for branch in "${branches[@]}"; do
            if keep_branch "$branch"; then
              echo "keep: $branch"
              continue
            fi
            echo "delete: $branch"
            if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null; then
              echo "FAILED: $branch" >&2
              failures=$((failures + 1))
            fi
          done

          mapfile -t remaining < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          printf 'remaining branches:\n%s\n' "${remaining[*]}"
          unexpected=0
          for branch in "${remaining[@]}"; do
            if ! keep_branch "$branch"; then
              echo "UNEXPECTED REMAINING: $branch" >&2
              unexpected=$((unexpected + 1))
            fi
          done
          test "$failures" -eq 0
          test "$unexpected" -eq 0
