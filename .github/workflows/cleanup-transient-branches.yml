name: LuckyBean cleanup transient branches

on:
  workflow_run:
    workflows: ["LuckyBean main signed release"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luckybean-cleanup-transient-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Archive superseded heads and delete verified merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/cleanup-transient-branches.mjs --apply
