name: LuckyBean cleanup transient branches

on:
  workflow_run:
    workflows: ["LuckyBean verified signed release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: luckybean-cleanup-transient-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Delete transient and fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          merged_prs=$(gh pr list --state merged --base main --limit 200 --json headRefName,headRefOid)
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|ci-status|pages-status|release-status) continue ;;
            esac
            [ -n "$branch" ] || continue
            remote_ref="refs/remotes/origin/$branch"
            branch_sha=$(git rev-parse "$remote_ref")
            merged_sha=$(jq -r --arg branch "$branch" '[.[] | select(.headRefName == $branch) | .headRefOid][0] // empty' <<< "$merged_prs")
            if git merge-base --is-ancestor "$remote_ref" refs/remotes/origin/main || { [ -n "$merged_sha" ] && [ "$branch_sha" = "$merged_sha" ]; }; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Preserving unmerged branch: $branch"
            fi
          done
      - name: Verify no merged disposable branches remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          merged_prs=$(gh pr list --state merged --base main --limit 200 --json headRefName,headRefOid)
          unexpected=()
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sort)
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|ci-status|pages-status|release-status) continue ;;
            esac
            [ -n "$branch" ] || continue
            remote_ref="refs/remotes/origin/$branch"
            branch_sha=$(git rev-parse "$remote_ref")
            merged_sha=$(jq -r --arg branch "$branch" '[.[] | select(.headRefName == $branch) | .headRefOid][0] // empty' <<< "$merged_prs")
            if git merge-base --is-ancestor "$remote_ref" refs/remotes/origin/main || { [ -n "$merged_sha" ] && [ "$branch_sha" = "$merged_sha" ]; }; then
              unexpected+=("$branch")
            fi
          done
          if [ "${#unexpected[@]}" -ne 0 ]; then
            echo 'Merged branches remain after cleanup:' >&2
            printf '%s\n' "${unexpected[@]}" >&2
            exit 1
          fi
