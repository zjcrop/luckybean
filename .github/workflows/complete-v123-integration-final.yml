name: Cancel stale LuckyBean v1.2.3 integration run

on:
  push:
    branches: [fix/v123-brewprofiles-integration-final]
    paths: [.github/workflows/complete-v123-integration-final.yml]

permissions:
  contents: read

concurrency:
  group: luckybean-v123-integration-final-isolated
  cancel-in-progress: true

jobs:
  release-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'Stale integration run cancelled; independent v2 workflow owns final verification.'
