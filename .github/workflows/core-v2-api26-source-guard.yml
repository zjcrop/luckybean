name: LuckyBean Android API 26 Source Guard

on:
  push:
    branches:
      - refactor/core-v2-local-first
    paths:
      - '.github/workflows/core-v2-api26-source-guard.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-v2-local-first
          fetch-depth: 0

      - name: Replace Java convenience APIs unsafe on old Android runtimes
        shell: python
        run: |
          from pathlib import Path
          path = Path('android/app/src/main/java/com/luckybean/app/backup/BackupArchiveService.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import java.io.FileReader;\n', 'import java.io.InputStreamReader;\n')
          text = text.replace(
              'new BufferedReader(new FileReader(file, StandardCharsets.UTF_8))',
              'new BufferedReader(new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8))'
          )
          text = text.replace(
              'return Files.readString(file.toPath(), StandardCharsets.UTF_8);',
              'return new String(Files.readAllBytes(file.toPath()), StandardCharsets.UTF_8);'
          )
          path.write_text(text, encoding='utf-8')

      - name: Reject known unsupported convenience methods
        run: |
          if grep -RInE 'Files\.readString|new FileReader\([^,]+,' android/app/src/main/java; then
            echo 'Android API 26 compatibility guard failed.'
            exit 1
          fi

      - name: Commit source compatibility fix
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- android/app/src/main/java/com/luckybean/app/backup/BackupArchiveService.java)" ]; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/luckybean/app/backup/BackupArchiveService.java
          git commit -m 'core-v2(batch-6): make backup I/O API 26 compatible'
          git push origin HEAD:refactor/core-v2-local-first
