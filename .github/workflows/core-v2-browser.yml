name: LuckyBean Core v2 Browser Smoke

on:
  push:
    branches:
      - refactor/core-v2-local-first
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: core-v2-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-source-compat:
    if: ${{ !contains(github.event.head_commit.message || '', 'API 26 compatible backup reader') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/core-v2-local-first
          fetch-depth: 0

      - name: Apply exact Android source compatibility patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('android/app/src/main/java/com/luckybean/app/backup/BackupArchiveService.java')
          text = path.read_text(encoding='utf-8')
          old = 'return Files.readString(file.toPath(), StandardCharsets.UTF_8);'
          marker = 'output.toString(StandardCharsets.UTF_8.name())'
          if old in text:
              new = '''try (InputStream input = new BufferedInputStream(new FileInputStream(file));
             ByteArrayOutputStream output = new ByteArrayOutputStream()) {
            byte[] buffer = new byte[8192];
            int read;
            while ((read = input.read(buffer)) >= 0) output.write(buffer, 0, read);
            return output.toString(StandardCharsets.UTF_8.name());
        }'''
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif marker not in text:
              raise SystemExit('Unexpected BackupArchiveService UTF-8 reader implementation')

      - name: Commit source compatibility patch
        shell: bash
        run: |
          if git diff --quiet -- android/app/src/main/java/com/luckybean/app/backup/BackupArchiveService.java; then
            echo "Compatibility patch already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/luckybean/app/backup/BackupArchiveService.java
          git commit -m "fix(android): API 26 compatible backup reader"
          git push origin HEAD:refactor/core-v2-local-first

  chromium:
    needs: android-source-compat
    if: ${{ always() && (needs.android-source-compat.result == 'success' || needs.android-source-compat.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --ignore-scripts

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > core-v2-http.log 2>&1 &
          echo $! > core-v2-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/core-v2/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat core-v2-http.log
          exit 1

      - name: Run Core v2 browser smoke
        env:
          CORE_V2_BASE_URL: http://127.0.0.1:4173/core-v2/
        run: npx playwright test tests/core-v2-browser.spec.mjs --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-core-v2-browser-evidence
          path: |
            core-v2-http.log
            test-results/
            playwright-report/
          if-no-files-found: warn
