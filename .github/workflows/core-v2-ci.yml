name: LuckyBean Core v2 CI

on:
  push:
    branches:
      - refactor/core-v2-local-first
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-core:
    name: Web core and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run Node tests
        run: npm test

      - name: Run static checks
        run: npm run check

      - name: Validate JSON schemas
        run: |
          node -e "for (const f of ['schemas/v3/bean.schema.json','schemas/v3/backup-manifest.schema.json','schemas/v3/sync-event.schema.json','.release/core-v2-baseline.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"

  android:
    name: Android compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-core-v2-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
