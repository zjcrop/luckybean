name: LuckyBean Core v2 Room Schema

on:
  push:
    branches:
      - refactor/core-v2-local-first
    paths:
      - 'android/app/src/main/java/com/luckybean/app/data/**'
      - 'android/app/build.gradle'
      - 'android/build.gradle'
      - '.github/workflows/core-v2-room-schema.yml'

permissions:
  contents: write

concurrency:
  group: core-v2-room-schema
  cancel-in-progress: true

jobs:
  schema:
    if: ${{ !contains(github.event.head_commit.message, 'generated Room schema') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/core-v2-local-first
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Room schema
        run: gradle --no-daemon -p android clean compileDebugJavaWithJavac

      - name: Commit generated Room schema
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- android/app/schemas)" ]; then
            echo "Room schema unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/schemas
          git commit -m "core-v2(batch-6): generated Room schema"
          git push origin HEAD:refactor/core-v2-local-first
