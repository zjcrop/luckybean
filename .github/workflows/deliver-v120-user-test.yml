name: Package LuckyBean v1.2.0 user test

on:
  push:
    branches:
      - delivery-v120-user-test
    paths:
      - .github/workflows/deliver-v120-user-test.yml

permissions:
  contents: read

concurrency:
  group: luckybean-v120-user-test-package
  cancel-in-progress: false

jobs:
  verify-build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout immutable verified product commit
        uses: actions/checkout@v4
        with:
          ref: a59672ebe29a843927cbc0dcbfab54f2e681d425
          fetch-depth: 1

      - name: Verify syntax contracts complete UI flows and visual baselines
        run: |
          node --check src/app.js
          node --check src/sensory-professional-controller.js
          node --check src/ui/account-sync-panel.js
          node --check src/ui/voice-settings-controller.js
          node --check src/renderers/brew-spatial-controller.js
          node --check src/renderers/brew-spatial-view.js
          node --check src/services/brew-analysis-service.js
          node --check src/brew-engine.js
          node --check src/ui-layout-controller.js
          npm ci --no-audit --no-fund
          npm run test:static
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:smoke
          npm run test:core
          npm run test:visual

      - name: Create immutable Web test package
        run: |
          mkdir -p package/web-preview
          cp index.html manifest.webmanifest sw.js styles.css package/web-preview/
          cp -R src public package/web-preview/
          printf '%s\n' 'a59672ebe29a843927cbc0dcbfab54f2e681d425' > package/SOURCE-SHA.txt
          (cd package && zip -qr LuckyBean-1.2.0-web-preview.zip web-preview)

      - name: Checkout Android shell
        uses: actions/checkout@v4
        with:
          ref: android/v1-source-consolidation
          path: shell

      - name: Assemble local-first Android source
        run: |
          rm -rf android
          cp -R shell/android android
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          required = ["versionCode 100101", "versionName '1.0.1-online-test'", "implementation 'androidx.exifinterface:exifinterface:1.3.7'"]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('unexpected Android Gradle baseline: ' + ', '.join(missing))
          text = text.replace('versionCode 100101', 'versionCode 100120', 1)
          text = text.replace("versionName '1.0.1-online-test'", "versionName '1.2.0-local-first-test'", 1)
          text = text.replace("implementation 'androidx.exifinterface:exifinterface:1.3.7'", "implementation 'androidx.exifinterface:exifinterface:1.3.7'\n    implementation 'androidx.webkit:webkit:1.12.1'", 1)
          text = text.replace("include 'public/**'\n        include 'src/**'\n        include 'styles.css'", "include 'index.html'\n        include 'manifest.webmanifest'\n        include 'sw.js'\n        include 'public/**'\n        include 'src/**'\n        include 'styles.css'", 1)
          gradle.write_text(text, encoding='utf-8')

          java = Path('android/app/src/main/java/com/luckybean/app/MainActivity.java')
          text = java.read_text(encoding='utf-8')
          checks = [
              'private static final String APP_URL = "https://zjcrop.github.io/BrewIon/luckybean/";',
              'private WebView webView;',
              'settings.setUserAgentString(settings.getUserAgentString() + " LuckyBeanAndroidOnline/1.0.1-test");',
              'webView.setWebViewClient(new OnlineAppClient());',
              'private void loadOnlineApp() {'
          ]
          missing = [item for item in checks if item not in text]
          if missing:
              raise SystemExit('unexpected Android MainActivity baseline: ' + ', '.join(missing))
          text = text.replace('import android.webkit.WebResourceRequest;\n', 'import android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\n', 1)
          text = text.replace('import androidx.exifinterface.media.ExifInterface;\n', 'import androidx.exifinterface.media.ExifInterface;\nimport androidx.webkit.WebViewAssetLoader;\n', 1)
          text = text.replace('private static final String APP_URL = "https://zjcrop.github.io/BrewIon/luckybean/";\n    private static final String TRUSTED_HOST = "zjcrop.github.io";\n    private static final String TRUSTED_PATH_PREFIX = "/BrewIon/luckybean/";', 'private static final String APP_URL = "https://appassets.androidplatform.net/assets/web-cache/index.html";\n    private static final String TRUSTED_HOST = "appassets.androidplatform.net";\n    private static final String TRUSTED_PATH_PREFIX = "/assets/web-cache/";', 1)
          text = text.replace('private WebView webView;\n', 'private WebView webView;\n    private WebViewAssetLoader assetLoader;\n', 1)
          text = text.replace('settings.setUserAgentString(settings.getUserAgentString() + " LuckyBeanAndroidOnline/1.0.1-test");', 'settings.setUserAgentString(settings.getUserAgentString() + " LuckyBeanAndroidLocalFirst/1.2.0-test");', 1)
          text = text.replace('webView.addJavascriptInterface(new NativeOcrBridge(this, webView), "LuckyBeanOcrAndroid");\n        webView.setWebViewClient(new OnlineAppClient());', 'webView.addJavascriptInterface(new NativeOcrBridge(this, webView), "LuckyBeanOcrAndroid");\n        assetLoader = new WebViewAssetLoader.Builder()\n            .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))\n            .build();\n        webView.setWebViewClient(new OnlineAppClient());', 1)
          old_load = '    private void loadOnlineApp() {\n        if (!hasNetwork()) {\n            showOfflinePage();\n            return;\n        }\n        webView.loadUrl(APP_URL + "?source=android-online-shell");\n    }\n'
          new_load = '    private void loadOnlineApp() {\n        webView.loadUrl(APP_URL + "?source=android-local-first-test");\n    }\n'
          if old_load not in text:
              raise SystemExit('loadOnlineApp source block not found')
          text = text.replace(old_load, new_load, 1)
          marker = '    private final class OnlineAppClient extends WebViewClient {\n'
          replacement = '    private final class OnlineAppClient extends WebViewClient {\n        @Override\n        public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\n            WebResourceResponse response = assetLoader.shouldInterceptRequest(request.getUrl());\n            return response != null ? response : super.shouldInterceptRequest(view, request);\n        }\n\n'
          if marker not in text:
              raise SystemExit('OnlineAppClient marker not found')
          text = text.replace(marker, replacement, 1)
          text = text.replace('富贵盒子在线版必须联网并完成云端账户验证后使用。', '本地应用资源载入失败，请重新打开应用。', 1)
          java.write_text(text, encoding='utf-8')
          PY

      - name: Validate packaged Web and Android source contracts
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          grep -F '1.2.0-test' package.json
          grep -F '启动和使用不等待服务器' src/ui/account-sync-panel.js
          ! grep -R -F 'data-auth-gate="checking"' index.html src
          grep -F 'versionCode 100120' android/app/build.gradle
          grep -F "versionName '1.2.0-local-first-test'" android/app/build.gradle
          grep -F 'appassets.androidplatform.net/assets/web-cache/index.html' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -F 'WebViewAssetLoader' android/app/src/main/java/com/luckybean/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build local-first APK
        run: |
          gradle --no-daemon --stacktrace -p android clean
          gradle --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Verify APK contents and prepare delivery package
        run: |
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > package/SIGNING-CERTIFICATE.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" > package/APK-BADGING.txt
          grep -F "versionCode='100120'" package/APK-BADGING.txt
          grep -F "versionName='1.2.0-local-first-test-debug'" package/APK-BADGING.txt
          unzip -Z1 "$apk" > package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/index.html' package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/app.js' package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/ui/account-sync-panel.js' package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/renderers/brew-spatial-controller.js' package/APK-CONTENTS.txt
          unzip -p "$apk" assets/web-cache/src/ui/account-sync-panel.js | grep -F '启动和使用不等待服务器'
          cp "$apk" package/LuckyBean-1.2.0-local-first-test.apk
          sha256sum package/LuckyBean-1.2.0-local-first-test.apk package/LuckyBean-1.2.0-web-preview.zip > package/SHA256SUMS.txt

      - name: Upload verified Web and APK delivery
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v120-user-test-delivery
          path: package/
          if-no-files-found: error
          retention-days: 14
