name: LuckyBean main web deploy

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  package-web:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare exact tested web site
        shell: bash
        run: |
          test -f public/vendor/jsqr/jsQR.js
          test -f src/ui/sensory-wizard-actions.css
          test -f src/features/release-1.24b-finalize.js
          test -f src/features/release-1.24b-polish.js
          test -f src/services/grind-psd-reference-service.js
          test -f src/domain/recognition/order-recognition-1.24b.js
          grep -Fq 'release-1.24b-polish.js?v=1.24B-main.2' index.html
          grep -Fq "REVISION = '1.24B-main.2'" sw.js
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.24B","revision":"1.24B-main.2","analysisContract":"brew-analysis/2.1","spatialContract":"brew-spatial/1.3","optimizationContract":"brew-optimization-assessment/1.0","matchingContract":"luckybean-match/1.1","recognitionQueue":"serial-one-image","beanLifecycle":"ordered-owned-archived","storageModes":"room-refrigerated-frozen","freshnessAge":"effective-storage-history","orderOcr":"privacy-minimized","grindPsd":"measured-reference-plus-custom-anchors","localBrewMethods":"offline-no-timer","qrRuntime":"local-jsqr-1.4.0","navigationBack":"internal-stack-overlay-first","uiArchitecture":"canonical-1.24b-complete"}\n' "$SOURCE_SHA" > _site/version.json
          zip -qr LuckyBean-1.24B-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts schemas docs DEVELOPMENT_STATUS.md
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-web-${{ env.SOURCE_SHA }}
          path: |
            _site/
            LuckyBean-1.24B-web.zip
          if-no-files-found: error

  deploy-pages:
    needs: package-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare exact tested web site
        shell: bash
        run: |
          test -f src/features/release-1.24b-polish.js
          test -f src/services/grind-psd-reference-service.js
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.24B","revision":"1.24B-main.2","analysisContract":"brew-analysis/2.1","spatialContract":"brew-spatial/1.3","optimizationContract":"brew-optimization-assessment/1.0","matchingContract":"luckybean-match/1.1","recognitionQueue":"serial-one-image","beanLifecycle":"ordered-owned-archived","storageModes":"room-refrigerated-frozen","freshnessAge":"effective-storage-history","orderOcr":"privacy-minimized","grindPsd":"measured-reference-plus-custom-anchors","localBrewMethods":"offline-no-timer","qrRuntime":"local-jsqr-1.4.0","navigationBack":"internal-stack-overlay-first","uiArchitecture":"canonical-1.24b-complete"}\n' "$SOURCE_SHA" > _site/version.json
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify published commit and complete release resources
        shell: bash
        run: |
          base='https://zjcrop.github.io/luckybean'
          for attempt in {1..24}; do
            index_status=$(curl -L -sS -o /tmp/luckybean-index.html -w '%{http_code}' "$base/")
            version_status=$(curl -L -sS -o /tmp/luckybean-version.json -w '%{http_code}' "$base/version.json")
            polish_status=$(curl -L -sS -o /tmp/luckybean-polish.js -w '%{http_code}' "$base/src/features/release-1.24b-polish.js")
            finalize_status=$(curl -L -sS -o /tmp/luckybean-finalize.js -w '%{http_code}' "$base/src/features/release-1.24b-finalize.js")
            grind_status=$(curl -L -sS -o /tmp/luckybean-grind.js -w '%{http_code}' "$base/src/services/grind-psd-reference-service.js")
            order_status=$(curl -L -sS -o /tmp/luckybean-order.js -w '%{http_code}' "$base/src/domain/recognition/order-recognition-1.24b.js")
            sw_status=$(curl -L -sS -o /tmp/luckybean-sw.js -w '%{http_code}' "$base/sw.js")
            if [ "$index_status" = "200" ] && [ "$version_status" = "200" ] && [ "$polish_status" = "200" ] && [ "$finalize_status" = "200" ] && [ "$grind_status" = "200" ] && [ "$order_status" = "200" ] && [ "$sw_status" = "200" ] \
              && grep -q "$SOURCE_SHA" /tmp/luckybean-version.json \
              && grep -q '"version":"1.24B"' /tmp/luckybean-version.json \
              && grep -q '"revision":"1.24B-main.2"' /tmp/luckybean-version.json \
              && grep -q '"grindPsd":"measured-reference-plus-custom-anchors"' /tmp/luckybean-version.json \
              && grep -Fq 'release-1.24b-polish.js?v=1.24B-main.2' /tmp/luckybean-index.html \
              && grep -Fq "REVISION = '1.24B-main.2'" /tmp/luckybean-sw.js \
              && grep -Fq 'grind-psd-reference-service.js' /tmp/luckybean-sw.js \
              && grep -q 'openCenteredHelp' /tmp/luckybean-polish.js \
              && grep -q '订单录入' /tmp/luckybean-finalize.js \
              && grep -qi 'grind-psd' /tmp/luckybean-grind.js \
              && grep -q 'parseCoffeeOrderText' /tmp/luckybean-order.js; then
              echo "LuckyBean Pages verified for $SOURCE_SHA"
              exit 0
            fi
            echo "Attempt $attempt: index=$index_status version=$version_status polish=$polish_status finalize=$finalize_status grind=$grind_status order=$order_status sw=$sw_status"
            sleep 10
          done
          echo 'LuckyBean Pages verification failed'
          cat /tmp/luckybean-version.json || true
          exit 1
