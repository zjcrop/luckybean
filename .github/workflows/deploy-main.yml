name: LuckyBean main web deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-main
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  build-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate 1.24B source before publishing
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:static
          grep -Fq 'application-version" content="1.24B"' index.html
          grep -Fq 'release-1.24b-polish.js?v=1.24B-main.2' index.html
          grep -Fq "REVISION = '1.24B-main.2'" sw.js
          grep -Fq 'grind-psd-reference-service.js' sw.js
      - name: Prepare exact tested web site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.24B","revision":"1.24B-main.2","recognitionQueue":"serial-one-image","beanLifecycle":"ordered-owned-archived","storageModes":"room-refrigerated-frozen","freshnessAge":"effective-storage-history","orderOcr":"privacy-minimized","grindPsd":"measured-reference-plus-custom-anchors","localBrewMethods":"offline-no-timer","uiArchitecture":"canonical-1.24b-complete"}\n' "$SOURCE_SHA" > _site/version.json
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy-pages:
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify published 1.24B main.2
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/luckybean'
          for attempt in {1..30}; do
            curl -L -fsS "$base/version.json?check=$SOURCE_SHA" -o /tmp/version.json || true
            curl -L -fsS "$base/?check=$SOURCE_SHA" -o /tmp/index.html || true
            curl -L -fsS "$base/sw.js?check=$SOURCE_SHA" -o /tmp/sw.js || true
            if grep -Fq "$SOURCE_SHA" /tmp/version.json 2>/dev/null \
              && grep -Fq '"version":"1.24B"' /tmp/version.json \
              && grep -Fq '"revision":"1.24B-main.2"' /tmp/version.json \
              && grep -Fq 'release-1.24b-polish.js?v=1.24B-main.2' /tmp/index.html \
              && grep -Fq "REVISION = '1.24B-main.2'" /tmp/sw.js; then
              echo "LuckyBean Pages now serves 1.24B-main.2 from $SOURCE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Pages still does not serve the current main commit'
          cat /tmp/version.json || true
          exit 1
