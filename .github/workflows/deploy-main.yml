name: LuckyBean main web deploy

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-main
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_REVISION: 1.24B-main.6

jobs:
  build-site:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - name: Verify same-SHA main test gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          test "$current_main" = "$SOURCE_SHA"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test-main.yml/runs?branch=main&head_sha=$SOURCE_SHA&per_page=10")
          test_status=$(printf '%s' "$runs" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // "missing"')
          test_conclusion=$(printf '%s' "$runs" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // "missing"')
          test "$test_status" = "completed"
          test "$test_conclusion" = "success"
          echo "Same-SHA main tests verified for $SOURCE_SHA"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate 1.24B main.6 source before publishing
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:static
          grep -Fq 'application-version" content="1.24B"' index.html
          grep -Fq 'release-revision" content="1.24B-main.6"' index.html
          grep -Fq "REVISION = '1.24B-main.6'" sw.js
          grep -Fq 'main-6-ui2' sw.js
          grep -Fq 'bean-group-state.js' src/app.js
          grep -Fq 'function openBeanGroup' src/app.js
          grep -Fq 'function closeBeanGroup' src/app.js
          grep -Fq "['process', '按处理法']" src/app.js
          grep -Fq 'data-close-bean-group' src/app.js
          grep -Fq 'beanGroupState' src/bean-groups-controller.js
          ! grep -Fq 'let activeGroup' src/bean-groups-controller.js
          grep -Fq 'LuckyBeanBeanGroupState' src/features/release-1.24b-group-navigation.js
          ! grep -Fq 'dispatchEvent(new MouseEvent' src/features/release-1.24b-group-navigation.js
          grep -Fq 'lb-sort-ghost' src/ui/sortable-controller.js
          grep -Fq 'lb-sort-placeholder' src/ui/sortable-controller.js
          grep -Fq 'LuckyBeanSortable' src/features/sensory-tag-sort-controller.js
          grep -Fq "UI_POLICY_REVISION = '1.24B-main.6'" src/features/release-1.24b-ui-policy.js
          grep -Fq 'main.7 professional score responsive layout' src/release-1.24b.css
      - name: Prepare exact tested web site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.24B","revision":"1.24B-main.6","recognitionQueue":"serial-one-image-persistent","recognitionArbitration":"explicit-confidence-consensus-inference","beanLifecycle":"ordered-delivered-storage-history","storageModes":"room-refrigerated-frozen","freshnessAge":"effective-storage-history","freshnessDetail":"full-expandable","orderOcr":"privacy-minimized","grindPsd":"measured-reference-plus-custom-anchors","localBrewMethods":"offline-no-timer","groupNavigation":"canonical-state-api","sortable":"shared-live-preview-ghost-placeholder","sensorySort":"single-activate-double-remove-longpress-preview","brewUi":"text-interactions","scoreLayout":"viewport-safe-next-line-range","aboutContacts":"inside-about-section","uiArchitecture":"canonical-1.24b-main.6"}\n' "$SOURCE_SHA" > _site/version.json
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy-pages:
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify published source fingerprint
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/luckybean'
          for attempt in {1..30}; do
            curl -L -fsS "$base/version.json?check=$SOURCE_SHA" -o /tmp/version.json || true
            curl -L -fsS "$base/?check=$SOURCE_SHA" -o /tmp/index.html || true
            curl -L -fsS "$base/src/app.js?check=$SOURCE_SHA" -o /tmp/app.js || true
            curl -L -fsS "$base/src/release-1.24b.css?check=$SOURCE_SHA" -o /tmp/release.css || true
            curl -L -fsS "$base/src/domain/beans/bean-group-state.js?check=$SOURCE_SHA" -o /tmp/group-state.js || true
            curl -L -fsS "$base/src/bean-groups-controller.js?check=$SOURCE_SHA" -o /tmp/bean-groups.js || true
            curl -L -fsS "$base/src/features/release-1.24b-group-navigation.js?check=$SOURCE_SHA" -o /tmp/group-navigation.js || true
            if grep -Fq "$SOURCE_SHA" /tmp/version.json 2>/dev/null \
              && grep -Fq '"version":"1.24B"' /tmp/version.json \
              && grep -Fq '"revision":"1.24B-main.6"' /tmp/version.json \
              && grep -Fq '"groupNavigation":"canonical-state-api"' /tmp/version.json \
              && grep -Fq '"scoreLayout":"viewport-safe-next-line-range"' /tmp/version.json \
              && grep -Fq 'release-1.24b-group-navigation.js?v=1.24B-main.6' /tmp/index.html \
              && grep -Fq "['process', '按处理法']" /tmp/app.js \
              && grep -Fq 'data-close-bean-group' /tmp/app.js \
              && grep -Fq 'main.7 professional score responsive layout' /tmp/release.css \
              && grep -Fq 'export const beanGroupState' /tmp/group-state.js \
              && grep -Fq 'beanGroupState' /tmp/bean-groups.js \
              && ! grep -Fq 'let activeGroup' /tmp/bean-groups.js \
              && grep -Fq 'LuckyBeanBeanGroupState' /tmp/group-navigation.js \
              && ! grep -Fq 'dispatchEvent(new MouseEvent' /tmp/group-navigation.js; then
              echo "LuckyBean Pages serves tested source $SOURCE_SHA"
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo 'Pages still does not serve the tested source'
              cat /tmp/version.json || true
              exit 1
            fi
            sleep 10
          done
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Live Pages browser smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const sha = process.env.SOURCE_SHA;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          await context.addInitScript(() => {
            localStorage.setItem('luckybean.onboarding.v2', JSON.stringify({ stage:'existing-user', updatedAt:new Date().toISOString(), reason:'pages-live-gate' }));
          });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(error.message));
          await page.goto(`https://zjcrop.github.io/luckybean/?live-check=${sha}`, { waitUntil:'domcontentloaded', timeout:30000 });
          const splash = page.locator('#splashScreen');
          if (await splash.isVisible().catch(() => false)) await splash.click();
          await page.locator('#appShell').waitFor({ state:'visible', timeout:20000 });
          await page.waitForFunction(() => document.documentElement.dataset.startup === 'ready', null, { timeout:20000 });
          const snapshot = await page.evaluate(() => ({
            startup: document.documentElement.dataset.startup,
            beansActive: document.querySelector('#pageBeans')?.classList.contains('active') || false,
            appHidden: document.querySelector('#appShell')?.classList.contains('hidden') || false,
            groupApi: Boolean(globalThis.LuckyBeanBeanGroupState?.close),
            overflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1
          }));
          if (snapshot.startup !== 'ready' || !snapshot.beansActive || snapshot.appHidden || !snapshot.groupApi || !snapshot.overflow) {
            throw new Error(`Live Pages startup contract failed: ${JSON.stringify(snapshot)}`);
          }
          if (pageErrors.length) throw new Error(`Live Pages pageerror: ${pageErrors.join(' | ')}`);
          await browser.close();
          console.log(`Live Pages browser smoke passed for ${sha}`);
          NODE
      - name: Write verifiable Pages receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=$(mktemp)
          printf '{"version":"1.24B","revision":"1.24B-main.6","source_sha":"%s","pages_url":"https://zjcrop.github.io/luckybean/","verified":true,"browser_smoke":true,"group_navigation":"canonical-state-api","sortable":"shared-live-preview-ghost-placeholder","sensory_sort":"single-activate-double-remove-longpress-preview","brew_ui":"text-interactions","score_layout":"viewport-safe-next-line-range","generated_at":"%s"}\n' "$SOURCE_SHA" "$(date -u +%FT%TZ)" > "$receipt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin pages-status >/dev/null 2>&1; then
            git fetch origin pages-status:pages-status
            git switch pages-status
          else
            git switch --orphan pages-status
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p status
          cp "$receipt" status/1.24B.json
          git add status/1.24B.json
          git commit -m "pages-status: LuckyBean 1.24B $SOURCE_SHA" || true
          git push origin HEAD:pages-status
