name: LuckyBean main web deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-main
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  build-site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate 1.24B source before publishing
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:static
          grep -Fq 'application-version" content="1.24B"' index.html
          grep -Fq 'release-revision" content="1.24B-main.3"' index.html
          grep -Fq 'release-1.24b-polish.js?v=1.24B-main.3' index.html
          grep -Fq 'release-1.24b-transit-controller.js?v=1.24B-main.3' index.html
          grep -Fq 'release-1.24b-group-navigation.js?v=1.24B-main.3' index.html
          grep -Fq 'release-1.24b-about-controller.js?v=1.24B-main.3' index.html
          grep -Fq "REVISION = '1.24B-main.3'" sw.js
          grep -Fq 'release-1.24b-freshness-detail.js' sw.js
          grep -Fq 'recognition-batch-progress-controller.js' sw.js
          grep -Fq 'recognition-field-resolver-1.24b.js' sw.js
          grep -Fq 'grind-psd-reference-service.js' sw.js
          grep -Fq 'release-1.24b-group-navigation.js' sw.js
          grep -Fq 'release-1.24b-about-controller.js' sw.js
      - name: Prepare exact tested web site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.24B","revision":"1.24B-main.3","recognitionQueue":"serial-one-image-persistent","recognitionArbitration":"explicit-confidence-consensus-inference","beanLifecycle":"ordered-delivered-storage-history","storageModes":"room-refrigerated-frozen","freshnessAge":"effective-storage-history","freshnessDetail":"full-expandable","orderOcr":"privacy-minimized","grindPsd":"measured-reference-plus-custom-anchors","localBrewMethods":"offline-no-timer","groupNavigation":"canonical-group-back","aboutContacts":"inside-about-section","uiArchitecture":"canonical-1.24b-complete"}\n' "$SOURCE_SHA" > _site/version.json
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy-pages:
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify published 1.24B main.3
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/luckybean'
          for attempt in {1..30}; do
            curl -L -fsS "$base/version.json?check=$SOURCE_SHA" -o /tmp/version.json || true
            curl -L -fsS "$base/?check=$SOURCE_SHA" -o /tmp/index.html || true
            curl -L -fsS "$base/sw.js?check=$SOURCE_SHA" -o /tmp/sw.js || true
            curl -L -fsS "$base/src/features/release-1.24b-finalize.js?check=$SOURCE_SHA" -o /tmp/finalize.js || true
            curl -L -fsS "$base/src/features/release-1.24b-transit-controller.js?check=$SOURCE_SHA" -o /tmp/transit.js || true
            curl -L -fsS "$base/src/features/release-1.24b-group-navigation.js?check=$SOURCE_SHA" -o /tmp/group.js || true
            curl -L -fsS "$base/src/features/release-1.24b-about-controller.js?check=$SOURCE_SHA" -o /tmp/about.js || true
            curl -L -fsS "$base/src/features/release-1.24b-polish.js?check=$SOURCE_SHA" -o /tmp/polish.js || true
            curl -L -fsS "$base/src/features/release-1.24b-freshness-detail.js?check=$SOURCE_SHA" -o /tmp/freshness.js || true
            curl -L -fsS "$base/src/features/recognition-batch-progress-controller.js?check=$SOURCE_SHA" -o /tmp/progress.js || true
            curl -L -fsS "$base/src/domain/recognition/recognition-field-resolver-1.24b.js?check=$SOURCE_SHA" -o /tmp/resolver.js || true
            if grep -Fq "$SOURCE_SHA" /tmp/version.json 2>/dev/null \
              && grep -Fq '"version":"1.24B"' /tmp/version.json \
              && grep -Fq '"revision":"1.24B-main.3"' /tmp/version.json \
              && grep -Fq '"recognitionQueue":"serial-one-image-persistent"' /tmp/version.json \
              && grep -Fq 'release-1.24b-group-navigation.js?v=1.24B-main.3' /tmp/index.html \
              && grep -Fq 'release-1.24b-about-controller.js?v=1.24B-main.3' /tmp/index.html \
              && grep -Fq "REVISION = '1.24B-main.3'" /tmp/sw.js \
              && grep -Fq '订单录入' /tmp/finalize.js \
              && grep -Fq '已购' /tmp/transit.js \
              && grep -Fq 'data-v099t-group-back' /tmp/group.js \
              && grep -Fq '端茶倒水的秦始皇🐻' /tmp/about.js \
              && grep -Fq 'openCenteredHelp' /tmp/polish.js \
              && grep -Fq '完整赏味期曲线' /tmp/freshness.js \
              && grep -Fq '正在识别' /tmp/progress.js \
              && grep -Fq 'explicit-label > confidence > multi-image-consensus > weak-inference' /tmp/resolver.js; then
              echo "LuckyBean Pages now serves 1.24B-main.3 from $SOURCE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Pages still does not serve the current main commit'
          cat /tmp/version.json || true
          exit 1
      - name: Write verifiable Pages receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=$(mktemp)
          printf '{"version":"1.24B","revision":"1.24B-main.3","source_sha":"%s","pages_url":"https://zjcrop.github.io/luckybean/","verified":true,"generated_at":"%s"}\n' "$SOURCE_SHA" "$(date -u +%FT%TZ)" > "$receipt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin pages-status >/dev/null 2>&1; then
            git fetch origin pages-status:pages-status
            git switch pages-status
          else
            git switch --orphan pages-status
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p status
          cp "$receipt" status/1.24B.json
          git add status/1.24B.json
          git commit -m "pages-status: LuckyBean 1.24B $SOURCE_SHA" || true
          git push origin HEAD:pages-status
