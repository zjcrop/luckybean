name: LuckyBean main web deploy

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-main-gated
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-site:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
      - id: meta
        name: Load canonical release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .displayVersion release.json)
          revision=$(jq -r .revision release.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "DISPLAY_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
      - name: Verify immutable same-SHA test gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          test "$current_main" = "$SOURCE_SHA"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test-main.yml/runs?branch=main&head_sha=$SOURCE_SHA&per_page=10")
          status=$(printf '%s' "$runs" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // "missing"')
          conclusion=$(printf '%s' "$runs" | jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // "missing"')
          test "$status" = completed
          test "$conclusion" = success
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate deployable source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-meta.mjs
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:static
      - name: Prepare exact tested web site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest release.json sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          jq -n \
            --arg commit "$SOURCE_SHA" \
            --arg version "$DISPLAY_VERSION" \
            --arg revision "$RELEASE_REVISION" \
            --arg brewResult "$(jq -r .brewResultVersion release.json)" \
            --arg brewPlan "$(jq -r .brewPlanVersion release.json)" \
            '{commit:$commit,version:$version,revision:$revision,brewResult:$brewResult,brewPlan:$brewPlan,gate:"same-sha-main-tests",uiArchitecture:"canonical-release-metadata"}' \
            > _site/version.json
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy-pages:
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  verify-pages:
    needs: [build-site, deploy-pages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DISPLAY_VERSION: ${{ needs.build-site.outputs.version }}
      RELEASE_REVISION: ${{ needs.build-site.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify exact published identity and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          base='https://zjcrop.github.io/luckybean'
          found=false
          for attempt in {1..30}; do
            curl -L -fsS "$base/version.json?check=$SOURCE_SHA" -o /tmp/version.json || true
            curl -L -fsS "$base/release.json?check=$SOURCE_SHA" -o /tmp/release.json || true
            curl -L -fsS "$base/?check=$SOURCE_SHA" -o /tmp/index.html || true
            curl -L -fsS "$base/sw.js?check=$SOURCE_SHA" -o /tmp/sw.js || true
            if test "$(jq -r .commit /tmp/version.json 2>/dev/null)" = "$SOURCE_SHA" \
              && test "$(jq -r .version /tmp/version.json 2>/dev/null)" = "$DISPLAY_VERSION" \
              && test "$(jq -r .revision /tmp/version.json 2>/dev/null)" = "$RELEASE_REVISION" \
              && test "$(jq -r .displayVersion /tmp/release.json 2>/dev/null)" = "$DISPLAY_VERSION" \
              && grep -Fq "application-version\" content=\"$DISPLAY_VERSION\"" /tmp/index.html \
              && grep -Fq "release-revision\" content=\"$RELEASE_REVISION\"" /tmp/index.html \
              && grep -Fq "REVISION = '$RELEASE_REVISION'" /tmp/sw.js; then
              found=true
              break
            fi
            sleep 10
          done
          test "$found" = true
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const sha=process.env.SOURCE_SHA;
          const expectedVersion=process.env.DISPLAY_VERSION;
          const expectedRevision=process.env.RELEASE_REVISION;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.addInitScript(()=>localStorage.setItem('luckybean.onboarding.v2',JSON.stringify({stage:'existing-user',updatedAt:new Date().toISOString(),reason:'pages-124p-gate'})));
          const page=await context.newPage();
          const pageErrors=[];
          page.on('pageerror',error=>pageErrors.push(error.message));
          await page.goto(`https://zjcrop.github.io/luckybean/?live-check=${sha}`,{waitUntil:'domcontentloaded',timeout:30000});
          const splash=page.locator('#splashScreen');
          if(await splash.isVisible().catch(()=>false)) await splash.click();
          await page.locator('#appShell').waitFor({state:'visible',timeout:20000});
          await page.waitForFunction(()=>document.documentElement.dataset.startup==='ready',null,{timeout:20000});
          const runtime=await page.evaluate(()=>({
            version:document.querySelector('meta[name="application-version"]')?.content||'',
            revision:document.querySelector('meta[name="release-revision"]')?.content||'',
            bodyVersion:document.body?.dataset.release||'',
            runtimeRevision:globalThis.LuckyBeanRuntimeFeatures?.revision||'',
            runtimeFailures:globalThis.LuckyBeanRuntimeFeatures?.failures?.length??-1,
            overflow:document.documentElement.scrollWidth<=document.documentElement.clientWidth+1,
            startup:document.documentElement.dataset.startup
          }));
          if(runtime.version!==expectedVersion||runtime.bodyVersion!==expectedVersion||runtime.revision!==expectedRevision||runtime.runtimeRevision!==expectedRevision||runtime.runtimeFailures!==0||!runtime.overflow||runtime.startup!=='ready') throw new Error(`1.24P Pages runtime mismatch: ${JSON.stringify(runtime)}`);
          if(pageErrors.length) throw new Error(`Pages pageerror: ${pageErrors.join(' | ')}`);
          await browser.close();
          NODE
      - name: Write verifiable Pages receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=$(mktemp)
          jq -n \
            --arg version "$DISPLAY_VERSION" \
            --arg revision "$RELEASE_REVISION" \
            --arg source_sha "$SOURCE_SHA" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            '{version:$version,revision:$revision,source_sha:$source_sha,pages_url:"https://zjcrop.github.io/luckybean/",verified:true,browser_smoke:true,same_sha_main_tests:true,release_metadata:true,generated_at:$generated_at}' \
            > "$receipt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin pages-status >/dev/null 2>&1; then
            git fetch origin pages-status:pages-status
            git switch pages-status
          else
            git switch --orphan pages-status
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p status
          cp "$receipt" "status/${DISPLAY_VERSION}.json"
          git add "status/${DISPLAY_VERSION}.json"
          git commit -m "pages-status: LuckyBean ${DISPLAY_VERSION} $SOURCE_SHA" || true
          git push origin HEAD:pages-status
