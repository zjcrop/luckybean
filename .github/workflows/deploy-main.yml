name: LuckyBean main web deploy

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  package-web:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare exact tested web site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.2.3-main-test"}\n' "$SOURCE_SHA" > _site/version.json
          zip -qr LuckyBean-1.2.3-main-test-web.zip index.html manifest.webmanifest sw.js styles.css src public contracts
      - uses: actions/upload-artifact@v4
        with:
          name: luckybean-main-web-${{ env.SOURCE_SHA }}
          path: |
            _site/
            LuckyBean-1.2.3-main-test-web.zip
          if-no-files-found: error

  deploy-pages:
    needs: package-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/configure-pages@v5
      - name: Prepare exact tested web site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.2.3-main-test"}\n' "$SOURCE_SHA" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify published commit and core resources
        shell: bash
        run: |
          base='https://zjcrop.github.io/luckybean'
          for attempt in {1..24}; do
            index_status=$(curl -L -sS -o /tmp/luckybean-index.html -w '%{http_code}' "$base/")
            version_status=$(curl -L -sS -o /tmp/luckybean-version.json -w '%{http_code}' "$base/version.json")
            app_status=$(curl -L -sS -o /tmp/luckybean-app.js -w '%{http_code}' "$base/src/app.js")
            manifest_status=$(curl -L -sS -o /tmp/luckybean-manifest.json -w '%{http_code}' "$base/manifest.webmanifest")
            if [ "$index_status" = "200" ] && [ "$version_status" = "200" ] && [ "$app_status" = "200" ] && [ "$manifest_status" = "200" ]               && grep -qi '<html' /tmp/luckybean-index.html               && grep -q "$SOURCE_SHA" /tmp/luckybean-version.json               && grep -q 'buildBrewInput' /tmp/luckybean-app.js; then
              echo "LuckyBean Pages verified for $SOURCE_SHA"
              exit 0
            fi
            echo "Attempt $attempt: index=$index_status version=$version_status app=$app_status manifest=$manifest_status"
            sleep 10
          done
          echo 'LuckyBean Pages verification failed'
          cat /tmp/luckybean-version.json || true
          exit 1
