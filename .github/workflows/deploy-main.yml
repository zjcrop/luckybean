name: LuckyBean main web deploy

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  package-web:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare exact tested web site
        shell: bash
        run: |
          test -f public/vendor/jsqr/jsQR.js
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.23E","revision":"1.23E-main-sync.2","analysisContract":"brew-analysis/2.1","spatialContract":"brew-spatial/1.3","matchingContract":"luckybean-match/1.1","qrRuntime":"local-jsqr-1.4.0"}\n' "$SOURCE_SHA" > _site/version.json
          zip -qr LuckyBean-1.23E-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts docs DEVELOPMENT_STATUS.md
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-web-${{ env.SOURCE_SHA }}
          path: |
            _site/
            LuckyBean-1.23E-web.zip
          if-no-files-found: error

  deploy-pages:
    needs: package-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare exact tested web site
        shell: bash
        run: |
          test -f public/vendor/jsqr/jsQR.js
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.23E","revision":"1.23E-main-sync.2","analysisContract":"brew-analysis/2.1","spatialContract":"brew-spatial/1.3","matchingContract":"luckybean-match/1.1","qrRuntime":"local-jsqr-1.4.0"}\n' "$SOURCE_SHA" > _site/version.json
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify published commit and core resources
        shell: bash
        run: |
          base='https://zjcrop.github.io/luckybean'
          for attempt in {1..24}; do
            index_status=$(curl -L -sS -o /tmp/luckybean-index.html -w '%{http_code}' "$base/")
            version_status=$(curl -L -sS -o /tmp/luckybean-version.json -w '%{http_code}' "$base/version.json")
            app_status=$(curl -L -sS -o /tmp/luckybean-app.js -w '%{http_code}' "$base/src/app.js")
            qr_status=$(curl -L -sS -o /tmp/luckybean-qr.js -w '%{http_code}' "$base/src/qr.js")
            jsqr_status=$(curl -L -sS -o /tmp/luckybean-jsqr.js -w '%{http_code}' "$base/public/vendor/jsqr/jsQR.js")
            repair_status=$(curl -L -sS -o /tmp/luckybean-repair.js -w '%{http_code}' "$base/src/features/interaction-repair-controller.js")
            manifest_status=$(curl -L -sS -o /tmp/luckybean-manifest.json -w '%{http_code}' "$base/manifest.webmanifest")
            recognition_status=$(curl -L -sS -o /tmp/luckybean-recognition.html -w '%{http_code}' "$base/recognition-test.html")
            archive_status=$(curl -L -sS -o /tmp/luckybean-archive-schema.json -w '%{http_code}' "$base/contracts/luckybean-archive-v1.schema.json")
            if [ "$index_status" = "200" ] && [ "$version_status" = "200" ] && [ "$app_status" = "200" ] && [ "$qr_status" = "200" ] && [ "$jsqr_status" = "200" ] && [ "$repair_status" = "200" ] && [ "$manifest_status" = "200" ] && [ "$recognition_status" = "200" ] && [ "$archive_status" = "200" ] \
              && grep -qi '<html' /tmp/luckybean-index.html \
              && grep -q "$SOURCE_SHA" /tmp/luckybean-version.json \
              && grep -q '"version":"1.23E"' /tmp/luckybean-version.json \
              && grep -q '"revision":"1.23E-main-sync.2"' /tmp/luckybean-version.json \
              && grep -q 'buildBrewInput' /tmp/luckybean-app.js \
              && grep -q 'public/vendor/jsqr/jsQR.js' /tmp/luckybean-qr.js \
              && grep -q '模型推荐结果' /tmp/luckybean-repair.js \
              && grep -q '使用说明' /tmp/luckybean-repair.js \
              && grep -q '日期归属' /tmp/luckybean-recognition.html; then
              echo "LuckyBean Pages verified for $SOURCE_SHA"
              exit 0
            fi
            echo "Attempt $attempt: index=$index_status version=$version_status app=$app_status qr=$qr_status jsqr=$jsqr_status repair=$repair_status manifest=$manifest_status recognition=$recognition_status archive=$archive_status"
            sleep 10
          done
          echo 'LuckyBean Pages verification failed'
          cat /tmp/luckybean-version.json || true
          exit 1
