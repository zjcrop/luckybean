name: LuckyBean main web deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public _site/
          touch _site/.nojekyll
          zip -qr LuckyBean-1.2.3-main-test-web.zip index.html manifest.webmanifest sw.js styles.css src public
      - uses: actions/upload-artifact@v4
        with:
          name: luckybean-main-web
          path: |
            _site/
            LuckyBean-1.2.3-main-test-web.zip

  deploy-pages:
    needs: package-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare web site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify published page
        shell: bash
        run: |
          for attempt in {1..18}; do
            status=$(curl -L -sS -o /tmp/luckybean-pages.html -w '%{http_code}' https://zjcrop.github.io/luckybean/)
            if [ "$status" = "200" ] && grep -qi '<html' /tmp/luckybean-pages.html; then
              echo "LuckyBean Pages is reachable: HTTP $status"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; waiting for Pages propagation"
            sleep 10
          done
          echo "LuckyBean Pages did not become reachable"
          cat /tmp/luckybean-pages.html || true
          exit 1
