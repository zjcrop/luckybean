name: LuckyBean main web deploy

on:
  workflow_run:
    workflows: ["LuckyBean main tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: luckybean-pages-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  package-web:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare exact tested web site
        shell: bash
        run: |
          test -f public/vendor/jsqr/jsQR.js
          test -f src/ui/sensory-wizard-actions.css
          test -f src/features/release-1.24b-finalize.js
          test -f src/domain/recognition/order-recognition-1.24b.js
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.24B","revision":"1.24B-main.1","analysisContract":"brew-analysis/2.1","spatialContract":"brew-spatial/1.3","optimizationContract":"brew-optimization-assessment/1.0","matchingContract":"luckybean-match/1.1","recognitionQueue":"serial-one-image","beanLifecycle":"ordered-owned-archived","storageModes":"room-refrigerated-frozen","freshnessAge":"effective-storage-history","orderOcr":"privacy-minimized","localBrewMethods":"offline-no-timer","qrRuntime":"local-jsqr-1.4.0","navigationBack":"internal-stack-overlay-first","uiArchitecture":"canonical-plus-1.24b-integration"}\n' "$SOURCE_SHA" > _site/version.json
          zip -qr LuckyBean-1.24B-web.zip index.html recognition-test.html manifest.webmanifest sw.js styles.css src public contracts schemas docs DEVELOPMENT_STATUS.md
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-web-${{ env.SOURCE_SHA }}
          path: |
            _site/
            LuckyBean-1.24B-web.zip
          if-no-files-found: error

  deploy-pages:
    needs: package-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6.0.0
      - name: Prepare exact tested web site
        shell: bash
        run: |
          test -f public/vendor/jsqr/jsQR.js
          test -f src/ui/sensory-wizard-actions.css
          test -f src/features/release-1.24b-finalize.js
          mkdir -p _site
          cp index.html recognition-test.html manifest.webmanifest sw.js styles.css _site/
          cp -R src public contracts schemas _site/
          touch _site/.nojekyll
          printf '{"commit":"%s","version":"1.24B","revision":"1.24B-main.1","analysisContract":"brew-analysis/2.1","spatialContract":"brew-spatial/1.3","optimizationContract":"brew-optimization-assessment/1.0","matchingContract":"luckybean-match/1.1","recognitionQueue":"serial-one-image","beanLifecycle":"ordered-owned-archived","storageModes":"room-refrigerated-frozen","freshnessAge":"effective-storage-history","orderOcr":"privacy-minimized","localBrewMethods":"offline-no-timer","qrRuntime":"local-jsqr-1.4.0","navigationBack":"internal-stack-overlay-first","uiArchitecture":"canonical-plus-1.24b-integration"}\n' "$SOURCE_SHA" > _site/version.json
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.0

  verify-pages:
    needs: deploy-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify published commit and canonical resources
        shell: bash
        run: |
          base='https://zjcrop.github.io/luckybean'
          for attempt in {1..24}; do
            index_status=$(curl -L -sS -o /tmp/luckybean-index.html -w '%{http_code}' "$base/")
            version_status=$(curl -L -sS -o /tmp/luckybean-version.json -w '%{http_code}' "$base/version.json")
            app_status=$(curl -L -sS -o /tmp/luckybean-app.js -w '%{http_code}' "$base/src/app.js")
            qr_status=$(curl -L -sS -o /tmp/luckybean-qr.js -w '%{http_code}' "$base/src/qr.js")
            jsqr_status=$(curl -L -sS -o /tmp/luckybean-jsqr.js -w '%{http_code}' "$base/public/vendor/jsqr/jsQR.js")
            guide_status=$(curl -L -sS -o /tmp/luckybean-guide.js -w '%{http_code}' "$base/src/ui/flavor-guide-controller.js")
            gear_status=$(curl -L -sS -o /tmp/luckybean-gear.js -w '%{http_code}' "$base/src/ui/gear-controller.js")
            nav_status=$(curl -L -sS -o /tmp/luckybean-navigation.js -w '%{http_code}' "$base/src/ui/navigation-controller.js")
            components_status=$(curl -L -sS -o /tmp/luckybean-components.css -w '%{http_code}' "$base/src/ui/app-components.css")
            layout_status=$(curl -L -sS -o /tmp/luckybean-layout.css -w '%{http_code}' "$base/src/ui/app-layout.css")
            sensory_status=$(curl -L -sS -o /tmp/luckybean-sensory.css -w '%{http_code}' "$base/src/ui/professional-sensory.css")
            sensory_actions_status=$(curl -L -sS -o /tmp/luckybean-sensory-actions.css -w '%{http_code}' "$base/src/ui/sensory-wizard-actions.css")
            manifest_status=$(curl -L -sS -o /tmp/luckybean-manifest.json -w '%{http_code}' "$base/manifest.webmanifest")
            recognition_status=$(curl -L -sS -o /tmp/luckybean-recognition.html -w '%{http_code}' "$base/recognition-test.html")
            release_status=$(curl -L -sS -o /tmp/luckybean-release.js -w '%{http_code}' "$base/src/features/release-1.24b-finalize.js")
            order_status=$(curl -L -sS -o /tmp/luckybean-order.js -w '%{http_code}' "$base/src/domain/recognition/order-recognition-1.24b.js")
            archive_status=$(curl -L -sS -o /tmp/luckybean-archive-schema.json -w '%{http_code}' "$base/contracts/luckybean-archive-v1.schema.json")
            optimization_status=$(curl -L -sS -o /tmp/luckybean-optimization.js -w '%{http_code}' "$base/src/domain/sensory/brew-optimization-assessment.js")
            coordinator_status=$(curl -L -sS -o /tmp/luckybean-coordinator.js -w '%{http_code}' "$base/src/services/brew-calculation-coordinator.js")
            old_repair_status=$(curl -L -sS -o /dev/null -w '%{http_code}' "$base/src/features/interaction-repair-controller.js")
            old_gear_status=$(curl -L -sS -o /dev/null -w '%{http_code}' "$base/src/features/gear-matching-controller.js")
            if [ "$index_status" = "200" ] && [ "$version_status" = "200" ] && [ "$app_status" = "200" ] && [ "$qr_status" = "200" ] && [ "$jsqr_status" = "200" ] && [ "$guide_status" = "200" ] && [ "$gear_status" = "200" ] && [ "$nav_status" = "200" ] && [ "$components_status" = "200" ] && [ "$layout_status" = "200" ] && [ "$sensory_status" = "200" ] && [ "$sensory_actions_status" = "200" ] && [ "$manifest_status" = "200" ] && [ "$recognition_status" = "200" ] && [ "$release_status" = "200" ] && [ "$order_status" = "200" ] && [ "$archive_status" = "200" ] && [ "$optimization_status" = "200" ] && [ "$coordinator_status" = "200" ] \
              && grep -qi '<html' /tmp/luckybean-index.html \
              && grep -q "$SOURCE_SHA" /tmp/luckybean-version.json \
              && grep -q '"version":"1.24B"' /tmp/luckybean-version.json \
              && grep -q '"revision":"1.24B-main.1"' /tmp/luckybean-version.json \
              && grep -q '"recognitionQueue":"serial-one-image"' /tmp/luckybean-version.json \
              && grep -q '"storageModes":"room-refrigerated-frozen"' /tmp/luckybean-version.json \
              && grep -q '"optimizationContract":"brew-optimization-assessment/1.0"' /tmp/luckybean-version.json \
              && grep -q '"navigationBack":"internal-stack-overlay-first"' /tmp/luckybean-version.json \
              && grep -q 'buildBrewInput' /tmp/luckybean-app.js \
              && grep -q 'totalScoreUsedAsTrigger:false' /tmp/luckybean-optimization.js \
              && grep -q 'latest: revision === this.revision' /tmp/luckybean-coordinator.js \
              && grep -q 'public/vendor/jsqr/jsQR.js' /tmp/luckybean-qr.js \
              && grep -q '<strong>自动</strong>' /tmp/luckybean-guide.js \
              && grep -q '使用说明' /tmp/luckybean-guide.js \
              && grep -q '滤杯角度' /tmp/luckybean-gear.js \
              && grep -q 'LuckyBeanNavigation' /tmp/luckybean-navigation.js \
              && grep -q 'history.back()' /tmp/luckybean-navigation.js \
              && grep -q 'gap: 1em' /tmp/luckybean-components.css \
              && grep -q -- '--viewport-height' /tmp/luckybean-layout.css \
              && grep -q -- '--cup-tag-selected-bg' /tmp/luckybean-sensory.css \
              && grep -q '订单录入' /tmp/luckybean-release.js \
              && grep -q 'parseCoffeeOrderText' /tmp/luckybean-order.js \
              && grep -A3 -F '[data-v095-prev]' /tmp/luckybean-sensory-actions.css | grep -Fq 'grid-column: 2' \
              && grep -A3 -F '[data-v095-next]' /tmp/luckybean-sensory-actions.css | grep -Fq 'grid-column: 3' \
              && grep -q '日期归属' /tmp/luckybean-recognition.html \
              && [ "$old_repair_status" != "200" ] && [ "$old_gear_status" != "200" ]; then
              echo "LuckyBean Pages verified for $SOURCE_SHA"
              exit 0
            fi
            echo "Attempt $attempt: index=$index_status version=$version_status app=$app_status release=$release_status order=$order_status"
            sleep 10
          done
          echo 'LuckyBean Pages verification failed'
          cat /tmp/luckybean-version.json || true
          exit 1
