name: Diagnose delivered offline APKs

on:
  push:
    branches: [LuckyBean-DS-B]
    paths: ['.github/workflows/diagnose-delivered-apks.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'
      - name: Install package inspection tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download delivered DS APK
        uses: actions/download-artifact@v8.0.1
        with:
          name: luckybean-ds-apk-7eb1e353da0ce1e624a63567118fc0cb68334274
          run-id: 40403196876
          github-token: ${{ github.token }}
          path: delivered/ds
      - name: Download delivered DS-B APK
        uses: actions/download-artifact@v8.0.1
        with:
          name: luckybean-ds-b-apk-28ccdfb3771979f9d6fad923d45620c7d6841213
          run-id: 40403197533
          github-token: ${{ github.token }}
          path: delivered/dsb
      - name: Verify both delivered packages
        shell: bash
        run: |
          set -euo pipefail
          for apk in delivered/ds/*.apk delivered/dsb/*.apk; do
            echo "Checking $apk"
            sha256sum "$apk"
            unzip -tq "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > badging.txt
            sed -n '1,15p' badging.txt
          done
      - name: Install emulator and Android 10 image
        run: sdkmanager 'emulator' 'system-images;android-29;google_apis;x86_64'
      - name: Install both APKs on a fresh Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n luckybean-diagnostic -k 'system-images;android-29;google_apis;x86_64' --device pixel_2 --force
          accel_args=()
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else accel_args=(-accel off); fi
          "$ANDROID_HOME/emulator/emulator" -avd luckybean-diagnostic -port 5554 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect "${accel_args[@]}" > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" >/dev/null 2>&1 || true' EXIT
          timeout 180 adb -s emulator-5554 wait-for-device
          ready=false
          for i in $(seq 1 120); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then tail -n 100 emulator.log; exit 1; fi
          for apk in delivered/ds/*.apk delivered/dsb/*.apk; do
            echo "Installing $apk"
            adb -s emulator-5554 uninstall com.luckybean.ds >/dev/null 2>&1 || true
            timeout 120 adb -s emulator-5554 push "$apk" /data/local/tmp/luckybean-diagnostic.apk
            set +e
            timeout 120 adb -s emulator-5554 shell pm install /data/local/tmp/luckybean-diagnostic.apk > install.log 2>&1
            status=$?
            set -e
            cat install.log
            timeout 30 adb -s emulator-5554 shell dumpsys package com.luckybean.ds > installed.txt
            if ! grep -q 'versionCode=102436 ' installed.txt; then
              echo "Installation failed, status $status" >&2
              exit 1
            fi
            echo "Verified installed package com.luckybean.ds, versionCode 102436"
            adb -s emulator-5554 uninstall com.luckybean.ds
          done
