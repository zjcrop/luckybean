name: Diagnose v1.2.0 browser startup

on:
  push:
    branches:
      - fix/v120-requirements-clean
    paths:
      - .github/workflows/diagnose-v120-browser-startup.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v120-requirements-clean
          fetch-depth: 0

      - name: Reproduce uncommitted implementation tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap, subprocess

          original = Path('.github/workflows/implement-v120-requirements.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^        run: \|\n          python3 - <<'PY'\n(?P<script>.*?)^          PY\n", original)
          script = textwrap.dedent(match.group('script'))
          script = script.replace('本地功能无需登录。数据先写入本机；登录云端后，新变化等待约8秒批量增量同步。', '本地功能无需登录。数据先写入本机；登录云端后，新变化等待约8秒批量增量同步。启动和使用不等待服务器。')
          script = script.replace('if (token) headers.authorization = `Bearer ${token}`;', 'Object.assign(headers, token ? { authorization: `Bearer ${token}` } : {});')
          Path('/tmp/apply.py').write_text(script, encoding='utf-8')
          subprocess.run(['python3', '/tmp/apply.py'], check=True)

          resume = Path('.github/workflows/resume-v120-implementation.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"(?ms)^        run: \|\n          python3 - <<'PY'\n(?P<script>.*?)^          PY\n", resume)
          if len(blocks) < 2:
              raise SystemExit(f'expected two python blocks in resume workflow, got {len(blocks)}')
          cleanup = textwrap.dedent(blocks[1])
          Path('/tmp/cleanup.py').write_text(cleanup, encoding='utf-8')
          subprocess.run(['python3', '/tmp/cleanup.py'], check=True)
          PY

      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/sensory-professional-controller.js
          node --check src/ui/account-sync-panel.js
          node --check src/ui/voice-settings-controller.js
          node --check src/renderers/brew-spatial-controller.js
          node --check src/services/brew-analysis-service.js

      - name: Install browser runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture startup console and page errors
        run: |
          python3 -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          page.on('console', message => console.log('BROWSER_CONSOLE', message.type(), message.text()));
          page.on('pageerror', error => console.log('BROWSER_PAGEERROR', error.stack || error.message));
          page.on('requestfailed', request => console.log('REQUEST_FAILED', request.url(), request.failure()?.errorText));
          await page.route('https://vaxwncdcuvbpvdbbketb.supabase.co/**', route => route.abort('failed'));
          await page.route('https://raw.githubusercontent.com/**', route => route.abort('failed'));
          await page.goto('http://127.0.0.1:4173/?diagnose-v120=1', { waitUntil: 'domcontentloaded' });
          await page.locator('#splashScreen').click();
          await page.waitForTimeout(5000);
          console.log('APP_STATE', await page.evaluate(() => ({
            appShell: document.querySelector('#appShell')?.className,
            pageBeans: document.querySelector('#pageBeans')?.className,
            startup: globalThis.LuckyBeanStartup,
            runtime: globalThis.LuckyBeanRuntimeFeatures,
            html: document.documentElement.dataset
          })));
          await browser.close();
          JS
