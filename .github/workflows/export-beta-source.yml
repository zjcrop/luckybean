name: Export Beta Source Snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/v0.8.0
      - name: Create source archive
        run: |
          set -euo pipefail
          zip -qr luckybean-beta-source.zip . -x '.git/*' -x 'node_modules/*'
          sha256sum luckybean-beta-source.zip > luckybean-beta-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: luckybean-beta-source
          path: |
            luckybean-beta-source.zip
            luckybean-beta-source.zip.sha256
          if-no-files-found: error
          retention-days: 1
