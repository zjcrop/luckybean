name: Export Lucky Bean Beta Source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.export-beta-source-trigger'

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.8 beta source
        uses: actions/checkout@v4
        with:
          ref: beta/v0.8.0
          fetch-depth: 1
      - name: Validate baseline
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json'); if(p.version!=='0.8.0-beta.1') process.exit(1)"
      - name: Package source
        run: |
          set -euo pipefail
          zip -qr luckybean-v0.8.0-beta-source.zip . \
            -x '.git/*' 'node_modules/*' '*.zip'
          sha256sum luckybean-v0.8.0-beta-source.zip > luckybean-v0.8.0-beta-source.zip.sha256
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v0.8.0-beta-source
          path: |
            luckybean-v0.8.0-beta-source.zip
            luckybean-v0.8.0-beta-source.zip.sha256
          if-no-files-found: error
          retention-days: 1
