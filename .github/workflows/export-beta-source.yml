name: Export Lucky Bean Beta Source

on:
  push:
    branches: [main]
    paths:
      - '.apply-v090-gate'
      - 'release/v090/**'
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.apply-v090-gate'
      - 'release/v090/**'

permissions:
  contents: write

concurrency:
  group: luckybean-beta-v090-registered-gate
  cancel-in-progress: false

jobs:
  export-source:
    if: github.event_name == 'push' || (github.event.pull_request.title == 'chore(beta): gate Lucky Bean v0.9.0-beta.1' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout gate payload
        uses: actions/checkout@v4
        with:
          path: _gate
          fetch-depth: 1

      - name: Checkout exact v0.8 Beta baseline
        uses: actions/checkout@v4
        with:
          ref: beta/v0.9.0
          path: _src
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Reconstruct and verify v0.9 patch
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./_src/package.json'); if(p.version!=='0.8.0-beta.1') process.exit(1)"
          test "$(find _gate/release/v090 -name 'part*.b64' | wc -l)" -eq 6
          cat _gate/release/v090/part*.b64 | tr -d '\n\r' | base64 -d > /tmp/luckybean-v090.patch.xz
          echo 'e738e1498ddfd2e40cdc52959a589760a6310ca6f022c5e3cd7b48b122a1df7f  /tmp/luckybean-v090.patch.xz' | sha256sum -c -
          xz -dc /tmp/luckybean-v090.patch.xz > /tmp/luckybean-v090.patch
          echo 'a7f4303defc686cdf9aa0421d4b973ec42bd4e4fe91655723a85bfa130baf3e6  /tmp/luckybean-v090.patch' | sha256sum -c -
          cd _src
          git apply --check /tmp/luckybean-v090.patch
          git apply /tmp/luckybean-v090.patch

      - name: Validate reconstructed v0.9 source
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json'); if(p.version!=='0.9.0-beta.1') process.exit(1)"
          test -s src/brew-model-v09.js
          grep -q 'lucky-brew-model-0.9.0-beta.1' src/brew-model-v09.js
          grep -q '轨迹图' docs/v0.9.0-beta-release-note.md
          grep -q 'filter_after' docs/browser-smoke-result.json
          grep -q '"page_errors": \[\]' docs/browser-smoke-result.json

      - name: Commit atomic v0.9 Beta source
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(beta): implement Lucky Bean v0.9.0-beta.1'
          git push origin HEAD:beta/v0.9.0
