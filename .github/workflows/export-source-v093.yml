name: Export Lucky Bean 0.9.3 source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'release-0.9.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.9.3
          fetch-depth: 1
      - name: Remove temporary transfer files
        run: rm -rf release/v093
      - uses: actions/upload-artifact@v4
        with:
          name: luckybean-v093-source
          path: .
          include-hidden-files: true
          retention-days: 1
