name: Finalize LuckyBean 1.24B main.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-finalize-124b-main3
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'apply final 1.24B main.3 completion') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Apply final completion migration
        run: node scripts/finalize-1.24b-main3.mjs
      - name: Verify syntax before commit
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit final completion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No completion changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js src package.json package-lock.json DEVELOPMENT_STATUS.md tests .github/workflows scripts
          git commit -m 'release: apply final 1.24B main.3 completion'
          git push origin HEAD:main
