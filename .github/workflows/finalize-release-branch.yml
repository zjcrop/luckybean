name: Finalize isolated LuckyBean 1.24B release

on:
  push:
    branches: [release-1.24b-final]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-124b-final-branch
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'finalize isolated 1.24B main.3 tree') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release-1.24b-final
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Normalize final revision identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src tests android .github/workflows -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.java' -o -name '*.gradle' -o -name '*.yml' -o -name '*.yaml' -o -name '*.css' \) -print0)
          files+=(index.html sw.js DEVELOPMENT_STATUS.md)
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            sed -i 's/1\.24B-main\.2/1.24B-main.3/g' "$file"
            sed -i 's/\${CACHE_PREFIX}main-2/\${CACHE_PREFIX}main-3/g' "$file"
          done
          grep -R -n -F '1.24B-main.2' index.html src tests android .github/workflows/build-main.yml .github/workflows/deploy-main.yml .github/workflows/full-integration-pr.yml && exit 1 || true
      - name: Install and verify
        run: |
          npm ci
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run test:static
      - name: Commit final tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js src tests android .github/workflows DEVELOPMENT_STATUS.md package.json package-lock.json
          git commit -m 'release: finalize isolated 1.24B main.3 tree'
          git push origin HEAD:release-1.24b-final
