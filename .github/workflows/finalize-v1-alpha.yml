name: Finalize Lucky Bean v1.0.0-alpha

on:
  push:
    branches: [main]
    paths:
      - '.release/v1.0.0-alpha-finalize.trigger'

permissions:
  contents: write

concurrency:
  group: luckybean-v1-alpha-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Finalize source and run checks
        id: finalize
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/finalize-v1-alpha.py
          python -m py_compile tools/finalize-v1-alpha.py
          npm test
          npm run check
          node --check src/app.js
          node --check src/v096-package-capture.js
          grep -Fq 'versionName '\''1.0.0-alpha'\''' android/app/build.gradle
          grep -Fq 'versionCode 100001' android/app/build.gradle
          grep -Fq 'LuckyBeanAndroid/1.0.0-alpha' android/app/src/main/java/com/luckybean/app/MainActivity.java

      - name: Commit finalized source
        if: steps.finalize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json index.html manifest.webmanifest sw.js README.md src/utils.js android/app/build.gradle android/app/src/main/java/com/luckybean/app/MainActivity.java docs/release-v1.0.0-alpha.md
          if ! git diff --cached --quiet; then
            git commit -m 'release: finalize Lucky Bean v1.0.0-alpha'
            git push origin HEAD:main
          fi

      - name: Record finalization status
        if: always()
        shell: bash
        env:
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p .release
          cat > .release/v1.0.0-alpha-finalize-status.json <<EOF
          {
            "status": "${FINALIZE_OUTCOME}",
            "run_id": "${GITHUB_RUN_ID}",
            "trigger_sha": "${GITHUB_SHA}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release/v1.0.0-alpha-finalize-status.json
          git commit -m "ci: record v1.0.0-alpha finalization ${FINALIZE_OUTCOME}" || true
          git push origin HEAD:main

      - name: Fail when finalization failed
        if: steps.finalize.outcome != 'success'
        run: exit 1
