name: Fix cold brew water balance validator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cold-brew-water-balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Patch validator and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('src/brew-engine-core.js')
          text = core.read_text()
          old = """  if (Number.isFinite(Number(plan.totals?.waterG)) && Math.abs(total - Number(plan.totals.waterG)) > 1) {
    throw new Error('分段注水量与总量不守恒');
  }
  return plan;
}"""
          new = """  const brewWater = Number(plan.totals?.brewWaterG);
  const recipeWater = Number(plan.totals?.waterG);
  const ice = Number(plan.totals?.iceG ?? 0);
  const bypass = Number(plan.totals?.bypassWaterG ?? 0);
  const stageTarget = Number.isFinite(brewWater) && brewWater > 0 ? brewWater : recipeWater;
  if (Number.isFinite(stageTarget) && Math.abs(total - stageTarget) > 1) {
    throw new Error('分段注水量与热萃水量不守恒');
  }
  if (Number.isFinite(recipeWater) && Number.isFinite(brewWater) && brewWater > 0
      && Math.abs(recipeWater - (brewWater + ice + bypass)) > 1) {
    throw new Error('热萃水、冰块、旁路水与配方总量不守恒');
  }
  return plan;
}"""
          if old not in text:
              raise SystemExit('target validator block not found')
          core.write_text(text.replace(old, new, 1))

          test = Path('test/brew-authoritative-plan.test.js')
          t = test.read_text()
          marker = "test('cold brew validates stage water against brew water and recipe total independently'"
          if marker not in t:
              t += """

test('cold brew validates stage water against brew water and recipe total independently', () => {
  const cold = {
    ...authoritativePlan(),
    analysisContract: 'brew-analysis/2.1',
    stages: [
      { index: 1, durationSec: 30, stageWaterG: 50, cumulativeWaterG: 50, temperatureC: 88 },
      { index: 2, durationSec: 45, stageWaterG: 100, cumulativeWaterG: 150, temperatureC: 92 }
    ],
    totals: { brewWaterG: 150, iceG: 100, bypassWaterG: 0, waterG: 250 }
  };
  assert.equal(validatePlan(cold), cold);

  assert.throws(
    () => validatePlan({ ...cold, totals: { ...cold.totals, brewWaterG: 160 } }),
    /分段注水量与热萃水量不守恒/
  );
  assert.throws(
    () => validatePlan({ ...cold, totals: { ...cold.totals, waterG: 260 } }),
    /热萃水、冰块、旁路水与配方总量不守恒/
  );
});
"""
              test.write_text(t)
          PY
          node --check src/brew-engine-core.js
          node --test test/brew-authoritative-plan.test.js
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'LuckyBean Release Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add src/brew-engine-core.js test/brew-authoritative-plan.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: validate cold brew water balances by semantic component'
          git push origin HEAD:main
