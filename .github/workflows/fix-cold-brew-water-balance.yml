name: Fix cold brew water balance validator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cold-brew-water-balance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Patch validator and regression test
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/cold_balance_patch.py
          python /tmp/cold_balance_patch.py
          node --check src/brew-engine-core.js
          node --test test/brew-authoritative-plan.test.js
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'LuckyBean Release Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add src/brew-engine-core.js test/brew-authoritative-plan.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: validate cold brew water balances by semantic component'
          git push origin HEAD:main
