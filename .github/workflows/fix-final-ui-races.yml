name: Fix final UI races

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-ui-races.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Patch freshness observer and deterministic UI tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Production fix: observe the class transition that turns a newly-rendered bean card into a one-line card.
          path = Path('src/features/freshness-timeline-controller.js')
          text = path.read_text(encoding='utf-8')
          old = """new MutationObserver(records => {
            const relevant = records.some(record => [...record.addedNodes].some(node => node.nodeType === 1 && (
              node.matches?.('.bean-card,.popup-menu,#beanGroups') || node.querySelector?.('.bean-card,.popup-menu,#beanGroups')
            )));
            if (relevant) queue();
          }).observe(document.body, { childList: true, subtree: true });"""
          new = """new MutationObserver(records => {
            const relevant = records.some(record => {
              if (record.type === 'attributes') {
                return record.target?.nodeType === 1 && record.target.matches?.('.bean-card[data-bean-id]');
              }
              return [...record.addedNodes].some(node => node.nodeType === 1 && (
                node.matches?.('.bean-card,.popup-menu,#beanGroups') || node.querySelector?.('.bean-card,.popup-menu,#beanGroups')
              ));
            });
            if (relevant) queue();
          }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'data-bean-id'] });"""
          if old not in text:
            raise SystemExit('freshness observer anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2. Flavor picker: wait for the semantic five-group result instead of assuming asynchronous codebook work finishes in 100 ms.
          path = Path('tests/v123e-interaction-repair-ui.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  await page.waitForTimeout(100);
            const labels = await page.locator('[data-overlay=\"flavors\"] .flavor-group h3').allTextContents();
            expect(labels).toEqual(['花香', '果香', '茶感', '香料', '其他']);"""
          new = """  const groups = page.locator('[data-overlay=\"flavors\"] .flavor-group');
            await expect(groups).toHaveCount(5, { timeout: 15000 });
            const labels = await groups.locator('h3').allTextContents();
            expect(labels).toEqual(['花香', '果香', '茶感', '香料', '其他']);"""
          if old not in text:
            raise SystemExit('flavor wait anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 3. Gear persistence: verify in a fresh page in the SAME BrowserContext (same IndexedDB/localStorage), avoiding same-page navigation races.
          path = Path('tests/v120-requirements-ui.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  await reloadAfterPendingNavigation(page);
            const splash = page.locator('#splashScreen');
            if (await splash.isVisible()) await splash.click();
            await expect(page.locator('#appShell')).toBeVisible({ timeout: 15000 });
            await page.locator('[data-page-target=\"settings\"]').click();
            await page.locator('#privateGearCategory > summary').click();

            for (const kind of ['filter', 'dripper', 'grinder']) {
              await expect(page.locator(`[data-gear-kind=\"${kind}\"]`)).not.toHaveAttribute('open', '');
            }
            await page.locator('[data-gear-kind=\"filter\"] > summary').click();
            await expect(page.locator('[data-filter-item]')).toContainText('测试品牌 测试滤纸');
            await page.locator('[data-gear-kind=\"filter\"] > summary').click();
            await page.locator('[data-gear-kind=\"dripper\"] > summary').click();
            await expect(page.locator('[data-dripper-item]').filter({ hasText: '测试滤杯' })).toHaveCount(1);
            await page.locator('[data-gear-kind=\"dripper\"] > summary').click();
            await page.locator('[data-gear-kind=\"grinder\"] > summary').click();
            await expect(page.locator('[data-grinder-item]')).toContainText('测试磨豆机');
            await expect(page.locator('[data-grinder-item]')).toContainText('23格');"""
          new = """  const persistedPage = await page.context().newPage();
            await openApp(persistedPage, 'requirements-gear-persisted=1');
            await persistedPage.locator('[data-page-target=\"settings\"]').click();
            await persistedPage.locator('#privateGearCategory > summary').click();

            for (const kind of ['filter', 'dripper', 'grinder']) {
              await expect(persistedPage.locator(`[data-gear-kind=\"${kind}\"]`)).not.toHaveAttribute('open', '');
            }
            await persistedPage.locator('[data-gear-kind=\"filter\"] > summary').click();
            await expect(persistedPage.locator('[data-filter-item]')).toContainText('测试品牌 测试滤纸');
            await persistedPage.locator('[data-gear-kind=\"filter\"] > summary').click();
            await persistedPage.locator('[data-gear-kind=\"dripper\"] > summary').click();
            await expect(persistedPage.locator('[data-dripper-item]').filter({ hasText: '测试滤杯' })).toHaveCount(1);
            await persistedPage.locator('[data-gear-kind=\"dripper\"] > summary').click();
            await persistedPage.locator('[data-gear-kind=\"grinder\"] > summary').click();
            await expect(persistedPage.locator('[data-grinder-item]')).toContainText('测试磨豆机');
            await expect(persistedPage.locator('[data-grinder-item]')).toContainText('23格');
            await persistedPage.close();"""
          if old not in text:
            raise SystemExit('private gear persistence anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Static lock for the actual freshness production race fix.
          path = Path('tests/v123e-freshness-timeline-regression.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = "assert.match(controller, /const hasUnknownCard = cards\\.some\\(card => !beanMap\\.has\\(String\\(card\\.dataset\\.beanId \\|\\| ''\\)\\)\\)/);"
          addition = anchor + "\nassert.match(controller, /attributes: true/);\nassert.match(controller, /attributeFilter: \\['class', 'data-bean-id'\\]/);"
          if 'attributeFilter:' not in text:
            if anchor not in text:
              raise SystemExit('freshness static anchor not found')
            text = text.replace(anchor, addition, 1)
            path.write_text(text, encoding='utf-8')
          PY
          node --check src/features/freshness-timeline-controller.js
          node --check tests/v123e-interaction-repair-ui.spec.mjs
          node --check tests/v120-requirements-ui.spec.mjs
          node tests/v123e-freshness-timeline-regression.mjs
      - name: Commit race fixes
        shell: bash
        run: |
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add src/features/freshness-timeline-controller.js tests/v123e-freshness-timeline-regression.mjs tests/v123e-interaction-repair-ui.spec.mjs tests/v120-requirements-ui.spec.mjs
          git commit -m 'fix: make async UI controllers deterministic'
          git push origin HEAD:main
