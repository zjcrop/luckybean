name: Fix reminder trigger order

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-reminder-trigger-order.yml'
      - 'scripts/repair-reminder-trigger-order.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Apply reminder-only repair
        run: python scripts/repair-reminder-trigger-order.py
      - name: Validate reminder-only repair
        run: |
          node --check src/app.js
          node --check src/core/startup-controller.js
          node tests/v124b-recommendation-prompt-regression.mjs
          grep -Fq "APP_MODULE_REVISION = '1.24B-main.15-reminder-trigger'" src/core/startup-controller.js
          grep -Fq 'startup-controller.js?v=1.24B-main.15-reminder-trigger' index.html
          ! grep -Fq 'const RECOMMENDATION_PROMPTS' src/app.js
          ! grep -Fq '直取榜首，不问其余。' src/app.js
          git diff --check
      - name: Commit repaired runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/core/startup-controller.js index.html tests
          git diff --cached --quiet && exit 0
          git commit -m 'Fire legacy reminder before selection focus animation'
          git push origin HEAD:main
