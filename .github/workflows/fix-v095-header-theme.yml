name: Repair Lucky Bean v0.9.5 header and theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v095-header-theme.yml'

permissions:
  contents: write

concurrency:
  group: luckybean-v095-header-theme-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused repair
        run: python scripts/fix-v095-header-theme.py

      - name: Validate repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v095-ui.js
          npm test
          npm run check
          grep -q 'flex-flow: row nowrap !important' styles-v095.css
          grep -q 'button.onclick = event =>' src/v095-ui.js
          grep -q 'button.dataset.v095ThemeIcon !== ui.theme' src/v095-ui.js

      - name: Remove one-time repair files
        run: |
          rm -f scripts/fix-v095-header-theme.py
          rmdir scripts 2>/dev/null || true
          rm -f .github/workflows/fix-v095-header-theme.yml

      - name: Commit repaired main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep header controls horizontal and restore theme toggle'
          git push origin HEAD:main
