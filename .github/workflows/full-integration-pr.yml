name: LuckyBean integration Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckybean-integration-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-29;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        id: compile
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon -p android :app:assembleDebug 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify native execution and canonical web contracts
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -eu
          set +o pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          grep -q "versionCode 102402" android/app/build.gradle
          grep -q "versionName '1.24B'" android/app/build.gradle
          grep -q 'LuckyBeanAndroid/1.24B' android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -q 'SystemClock.elapsedRealtime()' android/app/src/main/java/com/luckybean/app/BrewTimerService.java

          contract_tmp=$(mktemp -d)
          trap 'rm -rf "$contract_tmp" || true' EXIT
          extract_entry() {
            entry="$1"
            target="$contract_tmp/$(printf '%s' "$entry" | tr '/.' '__')"
            if ! unzip -p "$apk" "$entry" > "$target"; then
              echo "APK contract entry missing or unreadable: $entry" >&2
              exit 1
            fi
            printf '%s' "$target"
          }
          assert_entry_contains() {
            entry="$1"
            needle="$2"
            target=$(extract_entry "$entry")
            if ! grep -Fq "$needle" "$target"; then
              echo "APK contract marker missing: $entry :: $needle" >&2
              exit 1
            fi
          }
          assert_entry_absent() {
            entry="$1"
            needle="$2"
            target=$(extract_entry "$entry")
            if grep -Fq "$needle" "$target"; then
              echo "Forbidden APK contract marker present: $entry :: $needle" >&2
              exit 1
            fi
          }

          assert_entry_contains assets/web-cache/index.html 'release-revision" content="1.24B-main.6"'
          assert_entry_contains assets/web-cache/sw.js "REVISION = '1.24B-main.6'"
          assert_entry_contains assets/web-cache/sw.js 'main-6-ui2'
          assert_entry_contains assets/web-cache/src/features/runtime-features.js '1.24B-main.6'
          assert_entry_contains assets/web-cache/src/features/runtime-features.js "feature('shared-sortable'"
          assert_entry_contains assets/web-cache/src/features/runtime-features.js 'sensory-tag-sort-controller.js'
          assert_entry_contains assets/web-cache/src/domain/beans/bean-group-state.js 'export const beanGroupState'
          assert_entry_contains assets/web-cache/src/bean-groups-controller.js 'beanGroupState.groupKey'
          assert_entry_contains assets/web-cache/src/bean-groups-controller.js 'async function closeActiveGroup'
          assert_entry_absent assets/web-cache/src/bean-groups-controller.js 'let activeGroup'
          assert_entry_contains assets/web-cache/src/features/release-1.24b-group-navigation.js 'LuckyBeanBeanGroupState'
          assert_entry_absent assets/web-cache/src/features/release-1.24b-group-navigation.js 'dispatchEvent(new MouseEvent'
          assert_entry_contains assets/web-cache/src/ui/sortable-controller.js 'lb-sort-ghost'
          assert_entry_contains assets/web-cache/src/ui/sortable-controller.js 'lb-sort-placeholder'
          assert_entry_contains assets/web-cache/src/ui/sortable-controller.js 'onPreview'
          assert_entry_contains assets/web-cache/src/ui/sortable-controller.js 'onCommit'
          assert_entry_contains assets/web-cache/src/features/sensory-tag-sort-controller.js 'LuckyBeanSortable'
          assert_entry_contains assets/web-cache/src/features/sensory-tag-sort-controller.js 'professional-sensory-complete'
          assert_entry_contains assets/web-cache/src/features/release-1.24b-ui-policy.js "UI_POLICY_REVISION = '1.24B-main.6'"
          assert_entry_contains assets/web-cache/src/release-1.24b.css 'main.7 professional score responsive layout'
          assert_entry_contains assets/web-cache/src/recognition-bridge.js "dataUrl: nativeSource ? '' : await blobToDataUrl(image.blob)"
          assert_entry_contains assets/web-cache/src/package-capture-controller.js 'bindAndroidImageSource(id, nativeSource)'
          assert_entry_contains assets/web-cache/src/services/brew-analysis-service.js "BREW_ANALYSIS_CONTRACT = 'brew-analysis/2.1'"
          assert_entry_contains assets/web-cache/src/services/brew-analysis-service.js "BREW_SPATIAL_CONTRACT = 'brew-spatial/1.3'"

          source_css_sha=$(sha256sum src/release-1.24b.css | awk '{print $1}')
          apk_css_file=$(extract_entry assets/web-cache/src/release-1.24b.css)
          apk_css_sha=$(sha256sum "$apk_css_file" | awk '{print $1}')
          test "$source_css_sha" = "$apk_css_sha" || {
            echo "APK CSS differs from canonical source" >&2
            exit 1
          }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$contract_tmp/badging.txt"
          grep -Fq "package: name='com.luckybean.app' versionCode='102402' versionName='1.24B'" "$contract_tmp/badging.txt" || {
            echo "APK package identity mismatch" >&2
            exit 1
          }
          printf 'canonical-state-api\nshared-live-preview-ghost-placeholder\nsingle-activate-double-remove-longpress-preview\nbrew_ui=text-interactions\n' > android-contracts.txt
          echo 'APK canonical contract verification passed'
          rm -rf "$contract_tmp"
          trap - EXIT
          exit 0

      - name: Android 10 runtime startup smoke
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n luckybean-api29 -k 'system-images;android-29;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'luckybean-api29'
          accel_args=()
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; else accel_args=(-accel off); fi
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd luckybean-api29 -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data "${accel_args[@]}" > android-emulator.log 2>&1 &
          emulator_serial=''
          for i in $(seq 1 60); do
            emulator_serial=$(timeout --kill-after=2s 5s adb devices | awk '$1 ~ /^emulator-/ && $2 == "device" { print $1; exit }' || true)
            [ -n "$emulator_serial" ] && break
            sleep 2
          done
          [ -n "$emulator_serial" ] || { tail -n 200 android-emulator.log >&2 || true; exit 1; }
          boot_completed=''
          for i in $(seq 1 120); do
            boot_completed=$(timeout --kill-after=2s 5s adb -s "$emulator_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$boot_completed" = "1" ] && break
            sleep 2
          done
          [ "$boot_completed" = "1" ] || { tail -n 200 android-emulator.log >&2 || true; exit 1; }
          timeout --kill-after=15s 300s adb -s "$emulator_serial" install -r "$apk"
          timeout --kill-after=2s 10s adb -s "$emulator_serial" logcat -c || true
          set +e
          timeout --kill-after=5s 30s adb -s "$emulator_serial" shell am start -W -n com.luckybean.app/.MainActivity > android-start.txt 2>&1
          start_status=$?
          set -e
          sleep 8
          timeout --kill-after=5s 30s adb -s "$emulator_serial" logcat -d -v threadtime > android-runtime.log
          cat android-start.txt
          if [ "$start_status" -ne 0 ] || ! timeout --kill-after=2s 10s adb -s "$emulator_serial" shell pidof com.luckybean.app >/dev/null; then
            grep -n -E 'FATAL EXCEPTION|AndroidRuntime|com\.luckybean\.app|Caused by:' android-runtime.log | tail -n 200 >&2 || true
            exit 1
          fi
          if grep -A40 -B10 'FATAL EXCEPTION: main' android-runtime.log | grep -q 'com.luckybean.app'; then exit 1; fi

      - name: Package integration APK
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LuckyBean-1.24B-full-integration-debug.apk
          sha256sum dist/LuckyBean-1.24B-full-integration-debug.apk > dist/SHA256SUMS.txt
          printf 'source_sha=%s\nbranch=%s\nversion=1.24B\nversion_code=102402\nrevision=1.24B-main.6\ncache=main-6-ui2\ngroup_navigation=canonical-state-api\nsortable=shared-live-preview-ghost-placeholder\nsensory_sort=single-activate-double-remove-longpress-preview\nbrew_ui=text-interactions\nscore_layout=viewport-safe-next-line-range\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/BUILD_PROVENANCE.txt

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-full-integration-android-${{ github.sha }}
          path: |
            android-build.log
            android-emulator.log
            android-start.txt
            android-runtime.log
            android-contracts.txt
            dist/
          if-no-files-found: warn

      - name: Fail if Android compile failed
        if: steps.compile.outputs.status != '0'
        run: exit 1
