name: LuckyBean integration Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckybean-integration-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Prepare packaged QR dependency
        run: npm ci
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-29;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.3.1'

      - name: Compile debug APK
        id: compile
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon -p android :app:assembleDebug 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify reviewed Room schema
        if: steps.compile.outputs.status == '0'
        run: git diff --exit-code -- android/app/schemas

      - name: Verify native execution and canonical web contracts
        if: steps.compile.outputs.status == '0'
        run: python3 scripts/verify_android_apk_contracts.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Android 10 runtime startup smoke
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"

          avdmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name avdmanager -print \
            | grep -E '/[0-9]+([.][0-9]+)*/bin/avdmanager$' \
            | sort -V \
            | tail -n 1)
          test -n "$avdmanager"
          timeout --kill-after=10s 90s \
            "$avdmanager" create avd \
            -n luckybean-api29 \
            -k 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2' \
            --force > avd-create.log 2>&1
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx 'luckybean-api29'
          test -f "$ANDROID_AVD_HOME/luckybean-api29.avd/config.ini"

          accel_args=()
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            "$ANDROID_HOME/emulator/emulator-check" accel > emulator-accel.log 2>&1 || true
          else
            accel_args=(-accel off)
            printf 'KVM unavailable; using software acceleration\n' > emulator-accel.log
          fi

          emulator_serial=''
          emulator_pid=''
          start_emulator() {
            local attempt="$1"
            local log="android-emulator-${attempt}.log"
            adb kill-server >/dev/null 2>&1 || true
            adb start-server >/dev/null
            nohup "$ANDROID_HOME/emulator/emulator" \
              -avd luckybean-api29 \
              -port 5554 \
              -no-window -noaudio -no-boot-anim -no-metrics \
              -gpu swiftshader_indirect -no-snapshot -wipe-data \
              "${accel_args[@]}" > "$log" 2>&1 &
            emulator_pid=$!
            emulator_serial='emulator-5554'

            if ! timeout --kill-after=10s 120s adb -s "$emulator_serial" wait-for-device; then
              tail -n 200 "$log" >&2 || true
              return 1
            fi

            boot_completed=''
            for i in $(seq 1 90); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then
                tail -n 200 "$log" >&2 || true
                return 1
              fi
              boot_completed=$(adb -s "$emulator_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              [ "$boot_completed" = '1' ] && return 0
              sleep 2
            done
            tail -n 200 "$log" >&2 || true
            return 1
          }

          cleanup_emulator() {
            if [ -n "${emulator_serial:-}" ]; then
              adb -s "$emulator_serial" emu kill >/dev/null 2>&1 || true
            fi
            if [ -n "${emulator_pid:-}" ]; then
              kill "$emulator_pid" >/dev/null 2>&1 || true
            fi
            pkill -f 'qemu-system-x86_64-headless' >/dev/null 2>&1 || true
            pkill -f 'emulator.*luckybean-api29' >/dev/null 2>&1 || true
            emulator_serial=''
            emulator_pid=''
            sleep 2
          }

          runtime_ready=false
          for attempt in 1 2; do
            if start_emulator "$attempt"; then
              runtime_ready=true
              break
            fi
            cleanup_emulator
          done
          if [ "$runtime_ready" != 'true' ]; then
            echo 'Android API29 emulator failed to become boot-ready after two bounded attempts' >&2
            cat avd-create.log >&2 || true
            exit 1
          fi

          pm_ready=false
          for i in $(seq 1 45); do
            if timeout --kill-after=2s 8s adb -s "$emulator_serial" shell pm path android > package-manager-ready.txt 2>&1 \
              && grep -q '^package:' package-manager-ready.txt; then
              pm_ready=true
              break
            fi
            sleep 2
          done
          if [ "$pm_ready" != 'true' ]; then
            echo 'Android Package Manager did not become ready' >&2
            cat package-manager-ready.txt >&2 || true
            exit 1
          fi

          adb -s "$emulator_serial" shell settings put global airplane_mode_on 1
          adb -s "$emulator_serial" shell svc wifi disable
          adb -s "$emulator_serial" shell svc data disable
          timeout --kill-after=10s 600s gradle --no-daemon -p android :app:connectedDebugAndroidTest 2>&1 | tee android-room-tests.log

          remote_apk='/data/local/tmp/LuckyBean-integration.apk'
          timeout --kill-after=10s 120s adb -s "$emulator_serial" push "$apk" "$remote_apk" > android-push.txt 2>&1
          set +e
          timeout --kill-after=10s 120s adb -s "$emulator_serial" shell pm install -r "$remote_apk" > android-install.txt 2>&1
          install_status=$?
          set -e
          cat android-install.txt

          # API29 package manager can finish installing the APK but leave the host-side
          # adb shell command blocked until timeout. Device state is authoritative:
          # accept a non-zero/timeout shell status only when dumpsys proves that the
          # exact release.json version is actually installed. This keeps the runtime
          # gate strict without misclassifying an adb transport hang as install failure.
          expected_version=$(python3 -c "import json; print(json.load(open('release.json', encoding='utf-8'))['displayVersion'])")
          expected_code=$(python3 -c "import json; print(json.load(open('release.json', encoding='utf-8'))['androidVersionCode'])")
          package_verified=false
          if timeout --kill-after=5s 30s adb -s "$emulator_serial" shell dumpsys package com.luckybean.app > android-package-dump.txt 2>&1 \
            && grep -q 'installed=true' android-package-dump.txt \
            && grep -q "versionCode=${expected_code} " android-package-dump.txt \
            && grep -q "versionName=${expected_version}" android-package-dump.txt; then
            package_verified=true
          fi

          if [ "$install_status" -eq 0 ] && grep -q '^Success' android-install.txt; then
            test "$package_verified" = 'true' || {
              echo 'pm install reported Success but installed package identity is wrong or missing' >&2
              cat android-package-dump.txt >&2 || true
              exit 1
            }
          elif [ "$package_verified" = 'true' ]; then
            echo "pm install shell returned status ${install_status}, but device-side package state verifies the exact LuckyBean release; continuing runtime startup smoke"
          else
            echo "Android package install failed with status $install_status and device-side package verification failed" >&2
            cat android-package-dump.txt >&2 || true
            exit 1
          fi
          adb -s "$emulator_serial" shell rm -f "$remote_apk" >/dev/null 2>&1 || true


          timeout --kill-after=2s 10s adb -s "$emulator_serial" logcat -c || true
          set +e
          timeout --kill-after=5s 30s adb -s "$emulator_serial" shell am start -W -n com.luckybean.app/.MainActivity > android-start.txt 2>&1
          start_status=$?
          set -e
          sleep 8
          timeout --kill-after=5s 30s adb -s "$emulator_serial" logcat -d -v threadtime > android-runtime.log
          cat android-start.txt
          if [ "$start_status" -ne 0 ] || ! timeout --kill-after=2s 10s adb -s "$emulator_serial" shell pidof com.luckybean.app >/dev/null; then
            grep -n -E 'FATAL EXCEPTION|AndroidRuntime|com\.luckybean\.app|Caused by:' android-runtime.log | tail -n 200 >&2 || true
            exit 1
          fi
          if grep -A40 -B10 'FATAL EXCEPTION: main' android-runtime.log | grep -q 'com.luckybean.app'; then
            exit 1
          fi

      - name: Package integration APK
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(python3 -c "import json; print(json.load(open('release.json', encoding='utf-8'))['displayVersion'])")
          artifact="dist/LuckyBean-${version}-full-integration-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$artifact"
          sha256sum "$artifact" > dist/SHA256SUMS.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path('release.json').read_text(encoding='utf-8'))
          lines = [
              f"source_sha={os.environ['GITHUB_SHA']}",
              f"branch={os.environ['GITHUB_REF_NAME']}",
              f"version={release['displayVersion']}",
              f"version_code={release['androidVersionCode']}",
              f"revision={release['revision']}",
              f"cache={release['cacheRevision']}",
              f"android_user_agent={release['androidUserAgent']}",
              "group_navigation=canonical-state-api",
              "sortable=shared-live-preview-ghost-placeholder",
              "sensory_sort=single-activate-double-remove-longpress-preview",
              "brew_ui=text-interactions",
              "score_layout=viewport-safe-next-line-range",
          ]
          Path('dist/BUILD_PROVENANCE.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-full-integration-android-${{ github.sha }}
          path: |
            android-build.log
            avd-create.log
            emulator-accel.log
            android-emulator*.log
            package-manager-ready.txt
            android-push.txt
            android-install.txt
            android-room-tests.log
            android/app/schemas/
            android/app/build/outputs/androidTest-results/
            android-package-dump.txt
            android-start.txt
            android-runtime.log
            android-contracts.txt
            dist/
          if-no-files-found: warn

      - name: Fail if Android compile failed
        if: steps.compile.outputs.status != '0'
        run: exit 1


  signed_candidate:
    name: Signed Core v2 device candidate
    needs: android
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/core-v2-schema10-room'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.3.1'
      - name: Require successful main tests for this exact candidate head
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CANDIDATE_HEAD_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "LuckyBean main tests")] | sort_by(.created_at) | last | (.conclusion // .status // "missing")')
            if [ "$state" = success ]; then exit 0; fi
            case "$state" in failure|cancelled|timed_out|action_required) echo "Main gate failed: $state" >&2; exit 1;; esac
            sleep 10
          done
          echo 'Exact-head main gate did not complete successfully within 15 minutes' >&2
          exit 1
      - name: Restore official key for private device candidate
        env:
          LUCKYBEAN_KEYSTORE_B64: ${{ secrets.LUCKYBEAN_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$LUCKYBEAN_KEYSTORE_B64"
          printf '%s' "$LUCKYBEAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/luckybean-candidate.jks"
          chmod 600 "$RUNNER_TEMP/luckybean-candidate.jks"
      - name: Build signed candidate
        env:
          LUCKYBEAN_KEYSTORE_FILE: ${{ runner.temp }}/luckybean-candidate.jks
          LUCKYBEAN_STORE_PASSWORD: ${{ secrets.LUCKYBEAN_STORE_PASSWORD }}
          LUCKYBEAN_KEY_ALIAS: ${{ secrets.LUCKYBEAN_KEY_ALIAS }}
          LUCKYBEAN_KEY_PASSWORD: ${{ secrets.LUCKYBEAN_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease
      - name: Verify reviewed schema, packaged contracts and official certificate
        run: |
          set -euo pipefail
          git diff --exit-code -- android/app/schemas
          apk=android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_android_apk_contracts.py "$apk"
          expected_cert=$(tr -d '[:space:]:' < android/signing/CERT_SHA256.txt | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$actual_cert" = "$expected_cert"
          mkdir -p candidate
          cp "$apk" candidate/LuckyBean-Core-v2-device-candidate.apk
          sha256sum candidate/*.apk > candidate/SHA256SUMS.txt
          printf 'tested_merge_sha=%s\npr_head_sha=%s\nsigning=official-release-keystore\nstatus=device-acceptance-pending\n' "$GITHUB_SHA" '${{ github.event.pull_request.head.sha }}' > candidate/BUILD_PROVENANCE.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-core-v2-signed-candidate-${{ github.event.pull_request.head.sha }}
          path: candidate/
          if-no-files-found: error
