name: LuckyBean integration Android

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luckybean-splash-test-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Make splash persistence test deterministic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/v120-requirements-ui.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''  await white.click();\n  await reloadAfterPendingNavigation(page);\n  await expect(page.locator('#splashScreen')).toHaveAttribute('data-splash-variant', 'white');\n  await expect(page.locator('#splashScreen')).toHaveCSS('background-color', 'rgb(243, 239, 229)');'''
          new = '''  await white.click();\n  const persistedSplash = await page.evaluate(() => JSON.parse(localStorage.getItem('luckybean.ui.v095') || '{}').splash);\n  expect(persistedSplash).toBe('white');\n  await page.goto(`${BASE_URL}/?requirements-splash-preview-persisted=1`, { waitUntil: 'domcontentloaded' });\n  await page.waitForFunction(() => document.documentElement.dataset.appearanceController === 'ready');\n  await expect(page.locator('#splashScreen')).toHaveAttribute('data-splash-variant', 'white');\n  await expect(page.locator('#splashScreen')).toHaveCSS('background-color', 'rgb(243, 239, 229)');'''
          if text.count(old) != 1:
              raise SystemExit(f'splash persistence reload block count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git fetch origin main
          git show origin/main:.github/workflows/full-integration-pr.yml > .github/workflows/full-integration-pr.yml
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add tests/v120-requirements-ui.spec.mjs .github/workflows/full-integration-pr.yml
          git diff --cached --check
          git commit -m 'make splash persistence regression deterministic'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
