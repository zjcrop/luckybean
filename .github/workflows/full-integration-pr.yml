name: LuckyBean integration Android

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luckybean-final-release-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Normalize current account UI test contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/v120-requirements-ui.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = "await expect(page.locator('[data-cloud-login]')).toHaveText('登录服务器同步');"
          new = "await expect(page.locator('[data-cloud-login]')).toHaveText('登录 / 注册服务器同步');"
          if text.count(old) != 1:
              raise SystemExit(f'old account expectation count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git fetch origin main
          git show origin/main:.github/workflows/full-integration-pr.yml > .github/workflows/full-integration-pr.yml
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add tests/v120-requirements-ui.spec.mjs .github/workflows/full-integration-pr.yml
          git diff --cached --check
          git commit -m 'align account UI regression with combined login registration entry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
