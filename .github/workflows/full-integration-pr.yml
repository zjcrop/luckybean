name: LuckyBean integration Android

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luckybean-final-source-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Rewrite remaining legacy UI hooks at source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app.js')
          text = app.read_text(encoding='utf-8')
          old = '<button type="button" data-add-mode="photo">拍照识别</button>'
          new = '<button type="button" data-add-mode="photo">拍袋录入</button>'
          if text.count(old) != 1:
              raise SystemExit(f'app photo label source count={text.count(old)}')
          app.write_text(text.replace(old, new), encoding='utf-8')

          capture = Path('src/package-capture-controller.js')
          text = capture.read_text(encoding='utf-8')
          old = '''new MutationObserver(() => {\n  const button = document.querySelector('[data-add-mode="photo"]');\n  if (button && button.textContent !== '拍袋录入') button.textContent = '拍袋录入';\n}).observe(document.body, { childList: true, subtree: true });\n'''
          if text.count(old) != 1:
              raise SystemExit(f'package capture observer count={text.count(old)}')
          capture.write_text(text.replace(old, ''), encoding='utf-8')

          layout = Path('src/ui-layout-controller.js')
          text = layout.read_text(encoding='utf-8')
          old = '  new MutationObserver(queueSync).observe(document.body, { childList: true, subtree: true });\n'
          new = '''  document.addEventListener('luckybean:app-refreshed', queueSync);\n  for (const selector of ['#beanGroups', '#brewContent', '#overlayRoot']) {\n    const target = document.querySelector(selector);\n    if (target) new MutationObserver(queueSync).observe(target, { childList: true, subtree: true });\n  }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'ui layout body observer count={text.count(old)}')
          layout.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git fetch origin main
          git show origin/main:.github/workflows/full-integration-pr.yml > .github/workflows/full-integration-pr.yml
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add src/app.js src/package-capture-controller.js src/ui-layout-controller.js .github/workflows/full-integration-pr.yml
          git diff --cached --check
          git commit -m 'remove remaining global UI observers at source'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
