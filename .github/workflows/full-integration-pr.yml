name: LuckyBean integration Android

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luckybean-last-three-release-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Fix final canonical release contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path('src/ui/app-components.css')
          text = css.read_text(encoding='utf-8')
          old = '''.v095-splash-choice [data-splash-variant="red"] { background: #993333 !important; }\n.v095-splash-choice [data-splash-variant="white"] { background: #f3efe5 !important; }\n.v095-splash-choice [data-splash-variant] img { background: transparent !important; }'''
          new = '''#appearanceSettings .v095-splash-choice button[data-appearance-splash="red"] { background: #993333 !important; }\n#appearanceSettings .v095-splash-choice button[data-appearance-splash="white"] { background: #f3efe5 !important; }\n#appearanceSettings .v095-splash-choice button[data-appearance-splash] img { background: transparent !important; }'''
          if text.count(old) != 1:
              raise SystemExit(f'splash preview rule count={text.count(old)}')
          css.write_text(text.replace(old, new), encoding='utf-8')

          groups = Path('src/bean-groups-controller.js')
          text = groups.read_text(encoding='utf-8')
          old_class = 'return `<article class="bean-card compact${selected ? \' recommended v099l-selected\' : \'\'}" data-bean-id="${esc(bean.id)}" tabindex="0">'
          new_class = 'return `<article class="bean-card compact lb-one-line-bean${selected ? \' recommended v099l-selected\' : \'\'}" data-bean-id="${esc(bean.id)}" tabindex="0">'
          if text.count(old_class) != 1:
              raise SystemExit(f'group bean card class count={text.count(old_class)}')
          text = text.replace(old_class, new_class)
          old_track = '<div class="bean-freshness-progress" aria-label="时间轴已填充${progress}%">'
          new_track = '<div class="bean-freshness-progress" data-lb-freshness-timeline aria-label="时间轴已填充${progress}%">'
          if text.count(old_track) != 1:
              raise SystemExit(f'group freshness track count={text.count(old_track)}')
          groups.write_text(text.replace(old_track, new_track), encoding='utf-8')

          test = Path('tests/v120-requirements-ui.spec.mjs')
          text = test.read_text(encoding='utf-8')
          old = '''    oldPanel.dataset.v099fAccountSync = '1';\n    oldPanel.textContent = '旧服务器登录';\n    root.append(oldPanel);\n  });'''
          new = '''    oldPanel.dataset.v099fAccountSync = '1';\n    oldPanel.textContent = '旧服务器登录';\n    root.append(oldPanel);\n    document.dispatchEvent(new CustomEvent('luckybean:settings-rendered'));\n  });'''
          if text.count(old) != 1:
              raise SystemExit(f'account lifecycle test block count={text.count(old)}')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git fetch origin main
          git show origin/main:.github/workflows/full-integration-pr.yml > .github/workflows/full-integration-pr.yml
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add src/ui/app-components.css src/bean-groups-controller.js tests/v120-requirements-ui.spec.mjs .github/workflows/full-integration-pr.yml
          git diff --cached --check
          git commit -m 'close final three release regression contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
