name: LuckyBean integration Android

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: luckybean-release-regression-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Repair canonical lifecycle contracts at source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path('src/ui/app-components.css')
          text = css.read_text(encoding='utf-8')
          old = '.lb-onboarding { align-items: center; }\n.lb-onboarding > div { max-width: 420px; text-align: center; }'
          new = '.lb-onboarding { align-items: center; pointer-events: none; }\n.lb-onboarding > div { max-width: 420px; text-align: center; pointer-events: auto; }'
          if text.count(old) != 1: raise SystemExit('onboarding css contract not found exactly once')
          css.write_text(text.replace(old, new), encoding='utf-8')

          layout = Path('src/ui-layout-controller.js')
          text = layout.read_text(encoding='utf-8')
          old = "  document.addEventListener('click', interceptRecognitionParse, true);\n  document.addEventListener('click', blankGroupCollapse, true);\n"
          new = "  document.addEventListener('click', interceptRecognitionParse, true);\n  document.addEventListener('click', blankGroupCollapse, true);\n  document.addEventListener('click', event => {\n    if (!event.target.closest?.('[data-page-target=\"settings\"]')) return;\n    requestAnimationFrame(() => document.dispatchEvent(new CustomEvent('luckybean:settings-rendered')));\n  });\n"
          if text.count(old) != 1: raise SystemExit('ui lifecycle insertion point not found exactly once')
          layout.write_text(text.replace(old, new), encoding='utf-8')

          gear = Path('src/ui/gear-controller.js')
          text = gear.read_text(encoding='utf-8')
          old = '<button type="button" class="close-button" data-lb-gear-close aria-label="关闭">×</button>'
          new = '<button type="button" class="close-button" data-close-overlay data-lb-gear-close aria-label="关闭">×</button>'
          if text.count(old) != 1: raise SystemExit('gear close button contract not found exactly once')
          gear.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/v127-user-regressions-ui.spec.mjs')
          text = test.read_text(encoding='utf-8')
          old = '''  const sentinel = page.locator('[data-lb-matching-gear][data-lb-legacy-gear-disabled]');\n  await expect(sentinel).toHaveCount(1, { timeout: 10000 });\n  await expect(sentinel).toBeHidden();\n'''
          new = '''  await expect(page.locator('[data-lb-matching-gear][data-lb-legacy-gear-disabled]')).toHaveCount(0);\n'''
          if text.count(old) != 1: raise SystemExit('legacy gear sentinel precondition not found exactly once')
          text = text.replace(old, new)
          old2 = '''  await expect(page.locator('[data-lb-matching-gear]')).toHaveCount(1);\n  await expect(page.locator('[data-lb-matching-gear][data-lb-legacy-gear-disabled]')).toBeHidden();\n'''
          new2 = '''  await expect(page.locator('[data-lb-matching-gear]')).toHaveCount(0);\n  await expect(page.locator('[data-lb-matching-gear][data-lb-legacy-gear-disabled]')).toHaveCount(0);\n'''
          if text.count(old2) != 1: raise SystemExit('legacy gear sentinel postcondition not found exactly once')
          test.write_text(text.replace(old2, new2), encoding='utf-8')
          PY

          git fetch origin main
          git show origin/main:.github/workflows/full-integration-pr.yml > .github/workflows/full-integration-pr.yml
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add src/ui/app-components.css src/ui-layout-controller.js src/ui/gear-controller.js tests/v127-user-regressions-ui.spec.mjs .github/workflows/full-integration-pr.yml
          git diff --cached --check
          git commit -m 'restore canonical settings lifecycle and nonblocking onboarding'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
