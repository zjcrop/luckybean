name: LuckyBean local-first follow-up

on:
  push:
    branches:
      - perf/local-first-data-v2-20260906
    paths:
      - scripts/patch-local-first-followup.mjs
      - .github/workflows/local-first-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/local-first-data-v2-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply follow-up invariants
        run: node scripts/patch-local-first-followup.mjs
      - name: Syntax and architecture checks
        run: |
          node --check src/app.js
          node --check src/db-storage-core.js
          node --check src/services/cloud-sync-service.js
          node tests/v124p-local-first-data-architecture.mjs
      - name: Commit follow-up
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js
          git commit -m 'fix: reset lazy data scopes on directory refresh'
          git push origin HEAD:perf/local-first-data-v2-20260906
