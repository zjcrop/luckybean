name: LuckyBean local-first follow-up

on:
  push:
    branches:
      - perf/local-first-data-v2-20260906
    paths:
      - scripts/patch-local-first-followup.mjs
      - scripts/patch-runtime-lazy-final.mjs
      - src/features/runtime-features.js
      - tests/v124p-runtime-lazy-architecture.mjs
      - .github/workflows/local-first-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/local-first-data-v2-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply local-first invariants
        run: |
          node scripts/patch-local-first-followup.mjs
          node scripts/patch-runtime-lazy-final.mjs
      - name: Syntax and architecture checks
        run: |
          node --check src/app.js
          node --check src/db-storage-core.js
          node --check src/services/cloud-sync-service.js
          node --check src/features/runtime-features.js
          node --check src/features/full-integration-controller-v3.js
          node --check src/features/freshness-timeline-controller.js
          node --check src/recognition-paddle-ocr.js
          node tests/v124p-local-first-data-architecture.mjs
          node tests/v124p-runtime-lazy-architecture.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/features/full-integration-controller-v3.js src/features/freshness-timeline-controller.js src/recognition-paddle-ocr.js
          git commit -m 'perf: finish lazy runtime and summary fast path'
          git push origin HEAD:perf/local-first-data-v2-20260906
