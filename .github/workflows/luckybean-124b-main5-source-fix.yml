name: LuckyBean 1.24B main.5 source fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/luckybean-124b-main5-source-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical source fixes
        run: |
          python scripts/luckybean-main5-source-fix.py
          python scripts/luckybean-main5-revision-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run recognition regression suite
        run: npm run test:recognition
      - name: Run static suite
        run: npm run test:static
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local web server
        shell: bash
        run: |
          python -m http.server 4173 > /tmp/luckybean-main5-http.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/luckybean-main5-http.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/luckybean-main5-http.log
          exit 1
      - name: Run core suite
        run: npm run test:core
      - name: Verify diff
        run: |
          git diff --check
          git status --short
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete sensory OCR and roast display corrections'
          git push origin HEAD:main

