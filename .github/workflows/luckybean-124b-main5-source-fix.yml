name: LuckyBean 1.24B main.5 source fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/luckybean-124b-main5-source-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply canonical source fixes
        run: |
          python scripts/luckybean-main5-source-fix.py
          python scripts/luckybean-main5-revision-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run recognition regression suite
        run: npm run test:recognition
      - name: Run static suite
        id: static
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:static 2>&1 | tee static-main5.log
      - name: Upload static diagnostics
        if: steps.static.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: main5-static-diagnostics
          path: static-main5.log
      - name: Stop on static failure
        if: steps.static.outcome == 'failure'
        run: exit 1
      - name: Run core suite
        run: npm run test:core
      - name: Verify diff
        run: |
          git diff --check
          git status --short
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete sensory OCR and roast display corrections'
          git push origin HEAD:main

