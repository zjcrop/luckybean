name: LuckyBean v1.0.7 Bootstrap Validation

on:
  issues:
    types:
      - opened
  pull_request_target:
    branches:
      - main
    types:
      - ready_for_review
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: luckybean-v107-bootstrap
  cancel-in-progress: true

jobs:
  materialize-test-build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'LB-V107-BOOTSTRAP-20260804') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.number == 25 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'android/v1-source-consolidation')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mark controlled run start
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `CI started: ${context.runId}`
            });

      - name: Checkout controlled consolidation branch
        uses: actions/checkout@v4
        with:
          repository: zjcrop/luckybean
          ref: android/v1-source-consolidation
          fetch-depth: 0
          persist-credentials: true

      - name: Verify, decode and materialize consolidated source
        run: |
          cat .consolidation/payload.* > /tmp/materialize.b64
          test "$(wc -c < /tmp/materialize.b64)" -eq 26852
          echo "c1e0e3284090a56d4e31685446b9adf06afb60759570144c847bfc1a2a745ffd  /tmp/materialize.b64" | sha256sum -c -
          base64 --decode /tmp/materialize.b64 > /tmp/materialize.py.gz
          gzip -t /tmp/materialize.py.gz
          gzip -dc /tmp/materialize.py.gz > /tmp/materialize_v107.py
          python3 /tmp/materialize_v107.py
          sed -i 's#refactor/v1-consolidated#android/v1-source-consolidation#g' .github/workflows/android-v1-online-shell.yml
          rm -rf .consolidation

      - name: JavaScript syntax and focused tests
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npm run check
          python3 tests/browser-smoke.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: luckybean-online-shell-debug-keystore-v1

      - name: Build Android test APK
        run: gradle --no-daemon --stacktrace -p android clean assembleDebug

      - name: Verify and collect artifacts
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee SIGNING-CERTIFICATE.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='100107'"
          unzip -t "$apk" >/dev/null
          unzip -l "$apk" | grep -q 'assets/web-cache/src/app.js'
          unzip -l "$apk" | grep -q 'assets/web-cache/src/v099f-cloud-codec.js'
          mkdir -p artifacts web-preview
          cp "$apk" artifacts/LuckyBean-1.0.7-consolidated-test.apk
          cp SIGNING-CERTIFICATE.txt artifacts/
          sha256sum artifacts/LuckyBean-1.0.7-consolidated-test.apk > artifacts/SHA256SUMS.txt
          cp index.html manifest.webmanifest sw.js styles.css web-preview/
          cp -R src public web-preview/
          zip -qr artifacts/LuckyBean-1.0.7-web-preview.zip web-preview

      - name: Commit validated consolidated source to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '/artifacts/\n/web-preview/\n/SIGNING-CERTIFICATE.txt\n' >> .git/info/exclude
          git add -A
          git diff --cached --check
          git commit -m "refactor: consolidate LuckyBean 1.0.7 source and record workflows"
          git push origin HEAD:android/v1-source-consolidation

      - name: Upload APK and Web preview
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v107-consolidated-test
          path: artifacts/
          if-no-files-found: error

      - name: Mark controlled run success
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `CI passed: ${context.runId}`
            });
