name: LuckyBean v1.0.8 Local-First Test Package

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: luckybean-v108-local-first-package
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'LB-V108-PACKAGE-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Report build start
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `LuckyBean 1.0.8 build started: ${context.runId}`
            });

      - name: Checkout Web test source
        uses: actions/checkout@v4
        with:
          ref: test-v107-web
          path: web

      - name: Checkout Android shell
        uses: actions/checkout@v4
        with:
          ref: android/v1-source-consolidation
          path: shell

      - name: Assemble local-first source tree
        run: |
          rm -rf web/android
          cp -R shell/android web/android
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('web/android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace("versionCode 100101", "versionCode 100108")
          text = text.replace("versionName '1.0.1-online-test'", "versionName '1.0.8-local-first-test'")
          text = text.replace("implementation 'androidx.exifinterface:exifinterface:1.3.7'", "implementation 'androidx.exifinterface:exifinterface:1.3.7'\n    implementation 'androidx.webkit:webkit:1.12.1'")
          text = text.replace("include 'public/**'\n        include 'src/**'\n        include 'styles.css'", "include 'index.html'\n        include 'manifest.webmanifest'\n        include 'sw.js'\n        include 'public/**'\n        include 'src/**'\n        include 'styles.css'")
          gradle.write_text(text, encoding='utf-8')

          java = Path('web/android/app/src/main/java/com/luckybean/app/MainActivity.java')
          text = java.read_text(encoding='utf-8')
          text = text.replace('import android.webkit.WebResourceRequest;\n', 'import android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\n')
          text = text.replace('import androidx.exifinterface.media.ExifInterface;\n', 'import androidx.exifinterface.media.ExifInterface;\nimport androidx.webkit.WebViewAssetLoader;\n')
          text = text.replace('private static final String APP_URL = "https://zjcrop.github.io/BrewIon/luckybean/";\n    private static final String TRUSTED_HOST = "zjcrop.github.io";\n    private static final String TRUSTED_PATH_PREFIX = "/BrewIon/luckybean/";', 'private static final String APP_URL = "https://appassets.androidplatform.net/assets/web-cache/index.html";\n    private static final String TRUSTED_HOST = "appassets.androidplatform.net";\n    private static final String TRUSTED_PATH_PREFIX = "/assets/web-cache/";')
          text = text.replace('private WebView webView;\n', 'private WebView webView;\n    private WebViewAssetLoader assetLoader;\n')
          text = text.replace('settings.setUserAgentString(settings.getUserAgentString() + " LuckyBeanAndroidOnline/1.0.1-test");', 'settings.setUserAgentString(settings.getUserAgentString() + " LuckyBeanAndroidLocalFirst/1.0.8-test");')
          text = text.replace('webView.addJavascriptInterface(new NativeOcrBridge(this, webView), "LuckyBeanOcrAndroid");\n        webView.setWebViewClient(new OnlineAppClient());', 'webView.addJavascriptInterface(new NativeOcrBridge(this, webView), "LuckyBeanOcrAndroid");\n        assetLoader = new WebViewAssetLoader.Builder()\n            .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))\n            .build();\n        webView.setWebViewClient(new OnlineAppClient());')
          old_load = '''    private void loadOnlineApp() {
                  if (!hasNetwork()) {
                      showOfflinePage();
                      return;
                  }
                  webView.loadUrl(APP_URL + "?source=android-online-shell");
              }
          '''
          new_load = '''    private void loadOnlineApp() {
                  webView.loadUrl(APP_URL + "?source=android-local-first");
              }
          '''
          if old_load not in text:
              raise SystemExit('loadOnlineApp source block not found')
          text = text.replace(old_load, new_load)
          marker = '    private final class OnlineAppClient extends WebViewClient {\n'
          intercept = '''    private final class OnlineAppClient extends WebViewClient {
                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                      WebResourceResponse response = assetLoader.shouldInterceptRequest(request.getUrl());
                      return response != null ? response : super.shouldInterceptRequest(view, request);
                  }

          '''
          if marker not in text:
              raise SystemExit('OnlineAppClient marker not found')
          text = text.replace(marker, intercept, 1)
          java.write_text(text, encoding='utf-8')
          PY

      - name: Validate Web changes
        run: |
          find web/src -name '*.js' -print0 | xargs -0 -n1 node --check
          grep -F 'v108-local-first-history.js?v=1.0.8-test' web/index.html
          grep -F 'data-v108-manage-history' web/src/v108-local-first-history.js
          grep -F 'prevSensoryNodeBtn' web/src/v108-local-first-history.js
          grep -F 'luckybean:auth-missing' web/src/v108-local-first-history.js
          grep -F 'verifySession: restore' web/src/v099d-supabase-auth.js
          grep -F 'class="app-shell"' web/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build local-first APK
        run: |
          gradle --no-daemon --stacktrace -p web/android clean
          gradle --no-daemon --stacktrace -p web/android :app:assembleDebug

      - name: Verify APK and collect packages
        run: |
          apk="$(find web/android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > web/SIGNING-CERTIFICATE.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" > web/APK-BADGING.txt
          grep -F "versionCode='100108'" web/APK-BADGING.txt
          unzip -Z1 "$apk" > web/APK-CONTENTS.txt
          grep -F 'assets/web-cache/index.html' web/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/v108-local-first-history.js' web/APK-CONTENTS.txt
          unzip -p "$apk" assets/web-cache/index.html | grep -F '1.0.8-test'
          unzip -p "$apk" assets/web-cache/src/v108-local-first-history.js | grep -F '管理全部冲煮记录'
          mkdir -p package/web-preview
          cp "$apk" package/LuckyBean-1.0.8-local-first-test.apk
          cp web/SIGNING-CERTIFICATE.txt web/APK-BADGING.txt web/APK-CONTENTS.txt package/
          sha256sum package/LuckyBean-1.0.8-local-first-test.apk > package/SHA256SUMS.txt
          cp web/index.html web/manifest.webmanifest web/sw.js web/styles.css package/web-preview/
          cp -R web/src web/public package/web-preview/
          (cd package && zip -qr LuckyBean-1.0.8-web-preview.zip web-preview)

      - name: Upload APK and Web preview
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v108-local-first-test
          path: package/
          if-no-files-found: error

      - name: Report build success
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `LuckyBean 1.0.8 build passed: ${context.runId}`
            });
