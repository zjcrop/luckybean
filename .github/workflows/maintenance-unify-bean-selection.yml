name: One-shot unify bean selection grouping

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/unify-bean-selection.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Apply canonical selection migration
        run: python3 .github/scripts/unify-bean-selection.py
      - name: Validate syntax and focused static contracts
        run: |
          node --check src/app.js
          node --check src/features/release-1.24b-ui-policy.js
          grep -Fq "openBeanGroup(groupKey(bean, state.settings.groupMethod || 'country'), { animation: state.groupAnimationMode });" src/app.js
          ! grep -Fq 'recommendationExpandedAll' src/app.js
          ! grep -Fq 'recommendation-all-groups' src/app.js
          grep -Fq "['price', '价冠', '#000000'" src/app.js
          grep -Fq "['remaining', '拾余', '#808080'" src/app.js
          grep -Fq 'LuckyBeanBeanGroupState' .github/workflows/build-main.yml
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js src/features/release-1.24b-ui-policy.js .github/workflows/build-main.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify bean selection with single-group navigation'
          git push origin HEAD:main
