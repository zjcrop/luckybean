name: LuckyBean 1.24P native version migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-124p-native.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Replace legacy Android UA with BuildConfig version
        shell: bash
        run: |
          set -euo pipefail
          file=android/app/src/main/java/com/luckybean/app/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/java/com/luckybean/app/MainActivity.java')
          text=path.read_text()
          old='settings.setUserAgentString(settings.getUserAgentString() + " LuckyBeanAndroid/1.24B");'
          new='settings.setUserAgentString(settings.getUserAgentString() + " LuckyBeanAndroid/" + BuildConfig.VERSION_NAME);'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('Expected legacy Android UA line was not found')
          path.write_text(text.replace(old,new,1))
          PY
          grep -Fq 'LuckyBeanAndroid/" + BuildConfig.VERSION_NAME' "$file"
          ! grep -Fq 'LuckyBeanAndroid/1.24B' "$file"
      - name: Commit exact migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/com/luckybean/app/MainActivity.java
          git commit -m 'build: derive Android UA from package version'
          git push origin HEAD:main
