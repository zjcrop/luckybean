name: One-time 1.24P recognition preflight migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-124p-recognition-preflight.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Apply current-architecture recognition migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f'missing migration anchor in {path}: {old[:90]!r}')
                  return False
              p.write_text(s.replace(old,new,1))
              return True

          # app.js: preserve current date-review/entity-safety flow; add harvest first-class field and preflight.
          replace('src/app.js',
            "import { loadCodebook, makeIndex, displayName, optionsHtml, relatedRows, parseNaturalLanguage, REMOTE_CODEBOOK_URL } from './codebook.js';",
            "import { loadCodebook, makeIndex, displayName, optionsHtml, relatedRows, parseNaturalLanguage, parseHarvestSeasonValue, REMOTE_CODEBOOK_URL } from './codebook.js';")
          replace('src/app.js',
            "return [codeName('regions', bean.regionCode, ''), codeName('processes', bean.processCode, '')].filter(Boolean).join(' · ') || '产区与处理法未记录';",
            "return [codeName('regions', bean.regionCode, ''), bean.harvestSeason ? `产季 ${bean.harvestSeason}` : '', codeName('processes', bean.processCode, '')].filter(Boolean).join(' · ') || '产区与处理法未记录';")
          replace('src/app.js',
            "${fieldHtml('beanVariety','豆种',`<select id=\"beanVariety\" class=\"control\">${beanSelectOptions('varieties',state.codebook.varieties,bean.varietyCode)}</select>`,'required')}\n        ${fieldHtml('beanProcess'",
            "${fieldHtml('beanVariety','豆种',`<select id=\"beanVariety\" class=\"control\">${beanSelectOptions('varieties',state.codebook.varieties,bean.varietyCode)}</select>`,'required')}\n        ${fieldHtml('beanHarvestSeason','产季',`<input id=\"beanHarvestSeason\" class=\"control\" maxlength=\"20\" value=\"${esc(bean.harvestSeason || (bean.harvestYear ? String(bean.harvestYear) : ''))}\" placeholder=\"例如 2025/26\">`)}\n        ${fieldHtml('beanProcess'")
          replace('src/app.js',
            ".map(([key, value]) => `<div class=\"evidence-row\" data-evidence-field=\"${esc(key)}\" data-evidence-value=\"${esc(String(value))}\"><span>${esc(labels[key]||key)}</span><span>${esc(value)}</span><span>${Math.round((confidence[key]||0)*100)}%</span></div>`)",
            ".map(([key, value]) => `<div class=\"evidence-row\" data-evidence-field=\"${esc(key)}\" data-evidence-value=\"${esc(String(value))}\"><span>${esc(labels[key]||key)}</span><span>${esc(value)}</span><span>待确认</span></div>`)")
          replace('src/app.js',
            "const now = new Date().toISOString();\n    const record = {",
            "const now = new Date().toISOString();\n    const harvestInput = formValue('beanHarvestSeason');\n    const harvestParsed = parseHarvestSeasonValue(harvestInput);\n    const record = {")
          replace('src/app.js',
            "countryCode, regionCode: formValue('beanRegion'), entityCode: formValue('beanEntity'), varietyCode, processCode: formValue('beanProcess'),\n      roastColor:",
            "countryCode, regionCode: formValue('beanRegion'), entityCode: formValue('beanEntity'), varietyCode, processCode: formValue('beanProcess'),\n      harvestSeason: harvestParsed.normalizedValue || harvestInput, harvestYear: harvestParsed.harvestYear || 0, harvestEndYear: harvestParsed.harvestEndYear || 0,\n      roastColor:")
          replace('src/app.js',
            "varietyCode: formValue('beanVariety'), processCode: formValue('beanProcess'), roastColor:",
            "varietyCode: formValue('beanVariety'), harvestSeason: formValue('beanHarvestSeason'), processCode: formValue('beanProcess'), roastColor:")
          replace('src/app.js',
            "openBeanForm(merged, { type: 'text', text: sourceText, recognitionDocument, evidence: parsed.evidence, confidence: parsed.confidence, parseMetadata: parsed.parseMetadata });\n}\n\nfunction openRecognitionDateReview",
            "openRecognitionPreflight({ merged, parsed, sourceText, dateDecision, recognitionDocument });\n}\n\nfunction recognitionPreflightRows(bean = {}, parsed = {}) {\n  const review = new Set(parsed.parseMetadata?.recognition?.reviewFields || []);\n  const flavorText = (bean.flavorCodes || []).map(code => codeName('flavors', code, '')).filter(Boolean).join('、');\n  const rows = [\n    ['countryCode','国家', codeName('countries', bean.countryCode, bean.countryCustomName || '')],\n    ['regionCode','产区', codeName('regions', bean.regionCode, bean.regionCustomName || '')],\n    ['entityCode','庄园 / 处理站', codeName('entities', bean.entityCode, bean.entityCustomName || '')],\n    ['varietyCode','豆种', codeName('varieties', bean.varietyCode, bean.varietyCustomName || '')],\n    ['harvestYear','产季', bean.harvestSeason || (bean.harvestYear ? String(bean.harvestYear) : '')],\n    ['processCode','处理法', codeName('processes', bean.processCode, bean.processCustomName || '')],\n    ['altitude','海拔', bean.altitude ? `${bean.altitude} m` : ''],\n    ['roasterName','烘焙商', bean.roasterName || ''],\n    ['roastDate','烘焙日期', bean.roastDate || ''],\n    ['roastCode','烘焙度', ROAST_NAME.get(bean.roastCode) || ''],\n    ['roastColor','烘焙色值', bean.roastColor ? `Agtron ${bean.roastColor}` : ''],\n    ['flavorCodes','风味', flavorText || (bean.customFlavorNames || []).join('、')],\n    ['initialWeight','净含量', bean.initialWeight ? `${bean.initialWeight} g` : '']\n  ];\n  return rows.map(([field,label,value]) => ({ field, label, value: String(value || '').trim() || '—', review: review.has(field) }));\n}\n\nfunction recognitionPreflightExtra(parsed, dateDecision) {\n  const items = [];\n  for (const candidate of dateDecision?.candidates || []) {\n    if (candidate.decision === 'exclude') items.push(`${candidate.fieldLabel}：${candidate.normalizedValue || candidate.rawValue}`);\n    else if (candidate.decision === 'review') items.push(`未自动写入日期：${candidate.rawValue}`);\n  }\n  for (const value of parsed.customFlavorNames || []) items.push(`未编码风味：${value}`);\n  return [...new Set(items)];\n}\n\nfunction openRecognitionPreflight({ merged, parsed, sourceText, dateDecision, recognitionDocument }) {\n  const rows = recognitionPreflightRows(merged, parsed);\n  const extra = recognitionPreflightExtra(parsed, dateDecision);\n  const correctedCount = Object.values(parsed.parseMetadata || {}).filter(item => item && typeof item === 'object' && item.normalizedValue && item.rawValue && item.normalizedValue !== item.rawValue).length;\n  const rowHtml = rows.map(row => `<div class=\"recognition-preflight-row${row.review ? ' is-review' : ''}\"><span>${esc(row.label)}${row.review ? ' · 待确认' : ''}</span><strong>${esc(row.value)}</strong></div>`).join('');\n  const extraHtml = extra.length ? `<section class=\"recognition-preflight-extra\"><h3>其他识别信息</h3>${extra.map(item => `<p>${esc(item)}</p>`).join('')}</section>` : '';\n  const detailSummary = `已自动识别、翻译并整理${correctedCount ? `，其中规范化 ${correctedCount} 项` : ''}。原始文字与置信度仅保留在识别元数据中。`;\n  const content = `${dialogHeader('识别信息确认', '已自动识别、翻译并整理标签信息；待确认项不会静默写入标准编码')}<section class=\"recognition-preflight-card\"><div class=\"recognition-preflight-grid\">${rowHtml}</div>${extraHtml}<details class=\"recognition-source-details\"><summary>查看识别原文</summary><pre>${esc(sourceText)}</pre></details></section><div class=\"row recognition-preflight-actions\"><button id=\"preflightBackBtn\" class=\"button subtle\" type=\"button\">返回识别</button><span class=\"grow\"></span><button id=\"preflightConfirmBtn\" class=\"button primary\" type=\"button\">确认并填入</button></div>`;\n  const overlay = showOverlay(content, { full: true, id: 'recognition-preflight' });\n  bindClose(overlay);\n  $('#preflightBackBtn').addEventListener('click', () => openTextRecognition(sourceText, merged, recognitionDocument));\n  $('#preflightConfirmBtn').addEventListener('click', () => openBeanForm(merged, { type: 'text', text: sourceText, recognitionDocument, evidence: parsed.evidence, confidence: parsed.confidence, parseMetadata: parsed.parseMetadata, preflightSummary: detailSummary }));\n}\n\nfunction openRecognitionDateReview")
          replace('src/app.js', "粘贴豆袋文字，系统按 BrewIon 词表提取字段", "支持简体、繁体、英文、日文和韩文；系统先识别、归一化，再进入固定格式确认")
          replace('src/app.js', "例如：埃塞俄比亚 古吉 日晒 Heirloom，浅烘，2026-07-20，海拔2100m，净重150g，茉莉、蓝莓、蜂蜜", "例如：埃塞俄比亚 古吉 日晒 Heirloom，2026产季，浅烘，2026-07-20，海拔2100m")
          replace('src/app.js', "低置信度字段会要求人工确认；确认后表单仅显示最终值，识别证据保留为内部来源记录。", "识别结果会先按固定字段顺序展示；确认后再填入豆卡。置信度不在普通界面显示，只保留为内部来源记录。")
          replace('src/app.js', ">识别并填表</button>", ">识别并整理</button>")
          # QR: keep harvest as field instead of duplicating it in notes when the old line is still present.
          replace('src/app.js',
            "decoded.notes = [`扫码识别`, decoded.agtron ? `Agtron ${decoded.agtron}` : '', decoded.harvestYear ? `产季 ${decoded.harvestYear}` : ''].filter(Boolean).join('；');",
            "decoded.harvestSeason = decoded.harvestSeason || (decoded.harvestYear ? String(decoded.harvestYear) : '');\n    decoded.notes = [`扫码识别`, decoded.agtron ? `Agtron ${decoded.agtron}` : ''].filter(Boolean).join('；');",
            required=False)

