          "  variety: ['品种','豆种','树种','咖啡品种','栽培种','種屬','品種','豆種','樹種','variety','varietal','cultivar','botanical variety','var.','var','cv.','cv'],": "  variety: ['品种','豆种','树种','咖啡品种','栽培种','種屬','品種','豆種','樹種','栽培品種','품종','재배 품종','variety','varietal','cultivar','botanical variety','var.','var','cv.','cv'],",
          "  process: ['处理法','处理方式','处理','精制法','后制处理','后制法','加工法','加工方式','发酵方式','处理工艺','處理法','處理方式','後製法','process','processing','processing method','post-harvest process','proc.','proc','method'],": "  process: ['处理法','处理方式','处理','精制法','后制处理','后制法','加工法','加工方式','发酵方式','处理工艺','處理法','處理方式','後製法','精製方法','精製法','加工方法','処理方法','가공 방식','가공법','프로세싱','정제 방식','process','processing','processing method','post-harvest process','proc.','proc','method'],",
          "  roastDate: ['烘焙日期','烘焙日','烘豆日期','烘焙时间','出炉日期','焙炒日期','烘烤日期','烘焙日期','烘焙日','烘豆日期','烘焙時間','出爐日期','roast date','roasted on','roasting date','date roasted','roast on','rst date','rst dt','rd'],": "  roastDate: ['烘焙日期','烘焙日','烘豆日期','烘焙时间','出炉日期','焙炒日期','烘烤日期','烘焙時間','出爐日期','焙煎日','焙煎日付','焙煎年月日','로스팅 날짜','로스팅일','배전일','roast date','roasted on','roasting date','date roasted','roast on','rst date','rst dt','rd'],",
          "  harvest: ['产季','收获季','采收季','采收年份','收获年份','年度','生豆产季','產季','收穫季','採收季','crop','crop year','harvest','harvest year','season','crop season','cy'],": "  harvest: ['产季','收获季','采收季','采收年份','收获年份','年度','生豆产季','收获年度','產季','收穫季','採收季','採收年份','收穫年份','生豆產季','收穫年度','採收年度','クロップ','クロップ年','クロップ年度','収穫年','収穫年度','収穫期','収穫シーズン','年産','크롭','크롭 연도','수확 연도','수확년도','수확기','수확 시기','수확 시즌','생산 연도','crop','crop year','harvest','harvest year','season','crop season','cy'],",
