          Path('docs/recognition-preflight.md').write_text('''# Recognition Preflight 1.24P

LuckyBean inserts a fixed-format confirmation stage between recognition parsing and the formal bean-card draft.

## Flow

`OCR -> layout relations -> multilingual normalization -> field audit -> date ownership review (when required) -> fixed-format preflight -> user confirmation -> bean form`

Confidence percentages are not shown in the ordinary UI. Confidence and source evidence remain internal recognition provenance for conflict resolution and traceability.

## Languages

Field anchors and selected canonical value aliases cover Simplified Chinese, Traditional Chinese, English, Japanese, and Korean. Original OCR text is retained when a display value is normalized.

## Harvest season

`harvestSeason` is an optional first-class bean field. `harvestYear` and `harvestEndYear` are derived when the value is parseable. Explicit crop/harvest lines remain harvest data and are excluded by the current parser's labelled-field isolation from roast, altitude, and weight fallback inference.

## Safety

Knowledge entities marked `blockAutomaticEntityResolution` remain review candidates instead of silently receiving a stable entity code. Explicit stable core codes remain compatible with historical encoded input. Existing date-ownership review remains authoritative and is not bypassed by preflight.

## Fixed preflight order

Country, region, farm/station, variety, harvest season, process, altitude, roaster, roast date, roast level, roast color, flavor, and net weight are shown in stable order. Missing values are `—` rather than guessed.
''')

