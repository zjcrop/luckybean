          lex = {
          "  country: ['产地国','原产国','原产地','国家','产地','origin','country of origin','origin country','country'],": "  country: ['产地国','原产国','原产地','国家','产地','產地國','原產國','原產地','國家','產地','生産国','原産国','原産地','생산국','원산국','원산지','origin','country of origin','origin country','country'],",
