                      s,
                      "evidence: structuredClone(source.evidence || {}), confidence: structuredClone(source.confidence || {}), confirmedAt:",
                      "evidence: structuredClone(source.internalEvidence || source.evidence || {}), confidence: structuredClone(source.internalConfidence || source.confidence || {}), confirmedAt:"
                  )
