          css=Path('src/ui/app-components.css')
          c=css.read_text()
          marker='/* recognition-preflight/1.24P */'
          if marker not in c:
              c += '''\n\n/* recognition-preflight/1.24P */\n.recognition-preflight-card{max-width:760px;margin:0 auto;display:grid;gap:14px}\n.recognition-preflight-grid{border:1px solid rgba(190,151,80,.24);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.025)}\n.recognition-preflight-row{display:grid;grid-template-columns:minmax(92px,34%) 1fr;gap:12px;align-items:center;padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.07)}\n.recognition-preflight-row:last-child{border-bottom:0}.recognition-preflight-row.is-review{outline:1px solid rgba(190,151,80,.35);outline-offset:-1px}\n.recognition-preflight-row span{font-size:12px;color:var(--muted,#aaa)}.recognition-preflight-row strong{font-size:14px;font-weight:600;word-break:break-word}\n.recognition-preflight-extra,.recognition-source-details{padding:12px 14px;border:1px solid rgba(190,151,80,.2);border-radius:14px;background:rgba(255,255,255,.02)}\n.recognition-preflight-extra h3{margin:0 0 8px;font-size:13px}.recognition-preflight-extra p{margin:4px 0;font-size:12px;color:var(--muted,#aaa)}\n.recognition-source-details pre{white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:34vh;overflow:auto}\n.recognition-preflight-actions{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg,#090a0a) 28%)}\n.recognition-audit-details{grid-column:1/-1;margin-top:4px}\n@media(max-width:520px){.recognition-preflight-row{grid-template-columns:90px 1fr}}\n'''
              css.write_text(c)

          Path('docs/recognition-preflight.md').write_text('''# Recognition Preflight 1.24P\n\nLuckyBean inserts a confirmation stage between OCR parsing and the formal bean-card draft.\n\n## Flow\n\n`OCR -> layout relations -> multilingual normalization -> field audit -> date ownership review (when required) -> fixed-format preflight -> user confirmation -> bean form`\n\nThe ordinary UI does not expose confidence percentages. Confidence and source evidence remain internal recognition metadata for conflict resolution and traceability.\n\n## Supported label languages\n\nField anchors and selected canonical value aliases cover Simplified Chinese, Traditional Chinese, English, Japanese, and Korean. Original OCR text is retained even when a display value is normalized or translated.\n\n## Harvest season\n\n`harvestSeason` is an optional first-class bean field, with derived `harvestYear` and `harvestEndYear` where a year or year range is parseable. Explicit crop/harvest lines are treated as harvest data and are not permitted to silently become roast, altitude, or weight values.\n\n## Safety\n\nAmbiguous Knowledge entities marked `blockAutomaticEntityResolution` remain review candidates rather than silently receiving a stable entity code. Explicit stable core codes remain compatible with historical QR/encoded inputs.\n\n## Fixed preflight order\n\nCountry, region, farm/station, variety, harvest season, process, altitude, roaster, roast date, roast level, roast color, flavor, and net weight are displayed in a stable order. Missing values remain visibly blank (`—`) instead of being guessed.\n''')

          Path('test/harvest-multilingual-preflight.test.js').write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { DEFAULT_LABEL_LEXICON, parseHarvestSeasonValue, parseNaturalLanguage } from '../src/codebook.js';\nimport { RECOGNITION_FIELD_ALIASES, recognitionDocumentFromText } from '../src/domain/recognition/recognition-document.js';\n\nconst emptyBook = { countries: [], regions: [], entities: [], varieties: [], processes: [], flavors: [] };\n\ntest('harvest aliases cover simplified/traditional/English/Japanese/Korean', () => {\n  for (const token of ['产季','產季','crop year','クロップ年度','収穫年','수확년도','크롭 연도']) {\n    assert.ok(DEFAULT_LABEL_LEXICON.harvest.includes(token), token);\n    assert.ok(RECOGNITION_FIELD_ALIASES.harvest.includes(token), token);\n  }\n});\n\ntest('harvest parser normalizes Chinese, Japanese and Korean seasons', () => {\n  assert.equal(parseHarvestSeasonValue('產季：2025/26').normalizedValue, '2025/2026');\n  assert.equal(parseHarvestSeasonValue('25/26クロップ').normalizedValue, '2025/2026');\n  assert.equal(parseHarvestSeasonValue('수확년도 2026').normalizedValue, '2026');\n  assert.equal(parseHarvestSeasonValue('2026年産').normalizedValue, '2026');\n});\n\ntest('harvest line cannot leak into roast altitude or weight', () => {\n  const result = parseNaturalLanguage('產季：2025/26\\n品種：ゲイシャ', emptyBook);\n  assert.equal(result.harvestSeason, '2025/2026');\n  assert.equal(result.roastCode, undefined);\n  assert.equal(result.altitude, undefined);\n  assert.equal(result.initialWeight, undefined);\n});\n\ntest('layout parser recognizes reversed Japanese and Korean harvest labels', () => {\n  const ja = recognitionDocumentFromText('2025/26：クロップ年度');\n  const ko = recognitionDocumentFromText('2026：수확년도');\n  assert.equal(ja.relations[0]?.field, 'harvest');\n  assert.equal(ko.relations[0]?.field, 'harvest');\n});\n\ntest('explicit labeled numeric roast level is normalized without scanning crop numbers', () => {\n  const result = parseNaturalLanguage('CROP YEAR: 2025/26\\nROAST LEVEL: L2', emptyBook);\n  assert.equal(result.harvestSeason, '2025/2026');\n  assert.equal(result.roastCode, 'RL-L2');\n});\n''')
          PY
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run recognition target gates
        run: |
          node --check src/app.js
          node --check src/codebook.js
          node --check src/domain/recognition/recognition-document.js
          node --test test/harvest-multilingual-preflight.test.js test/coffee-knowledge-entity-resolution-safety.test.js
          npm run test:static
      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js src/codebook.js src/domain/recognition/recognition-document.js src/ui/app-components.css docs/recognition-preflight.md test/harvest-multilingual-preflight.test.js
          git commit -m 'feat: complete multilingual recognition preflight and harvest field'
          git push origin HEAD:main
