name: One-time 1.24P recognition preflight migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-124p-recognition-preflight.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply recognition migration
        run: python3 scripts/migrate_124p_recognition_preflight.py
      - name: Validate migrated source
        run: |
          node --check src/app.js
          node --check src/codebook.js
          node --check src/domain/recognition/recognition-document.js
          node --test test/harvest-multilingual-preflight.test.js test/coffee-knowledge-entity-resolution-safety.test.js
          npm run test:static
      - name: Commit migrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js src/codebook.js src/domain/recognition/recognition-document.js src/ui/app-components.css docs/recognition-preflight.md test/harvest-multilingual-preflight.test.js
          git commit -m 'feat: complete multilingual recognition preflight and harvest field'
          git push origin HEAD:main
