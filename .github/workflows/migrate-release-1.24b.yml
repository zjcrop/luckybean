name: LuckyBean one-pass 1.24B migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-124b-one-pass-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Apply all current-version migrations
        run: node scripts/migrate-release-1.24b.mjs
      - name: Verify no stale current-version locks remain
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude-dir=node_modules \
            "APP_VERSION = '1\\.23E'|versionName '1\\.23E'|versionCode 102322|LuckyBeanAndroid/1\\.23E|1\\.23E-main-sync\\.(3|4|11)" \
            src android tests .github package.json package-lock.json index.html DEVELOPMENT_STATUS.md
          grep -Fq "LuckyBeanAndroid/1.24B" android/app/src/main/java/com/luckybean/app/MainActivity.java
          grep -Fq "versionName '1.24B'" android/app/build.gradle
          grep -Fq '"version": "1.24.2"' package.json
      - name: Commit migration as one changeset
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src android tests .github package.json package-lock.json DEVELOPMENT_STATUS.md
          git commit -m 'release: migrate all current references to LuckyBean 1.24B'
          git push origin HEAD:main
