name: LuckyBean OCR compression integrity hotfix finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-compression-integrity-hotfix-finalize.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed OCR transform and complete release identity updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ocr-compression-integrity-hotfix.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY"
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'reviewed-hotfix-transform', 'exec'), {'__name__': '__main__'})

          # Current-release test assertions, including regex-escaped literals.
          for name in [
              'tests/v124p-release-contract.mjs',
              'tests/v124p-auth-ocr-ai-hotfix-static.mjs',
              'tests/v124p-local-first-data-architecture.mjs',
              'tests/v124p-startup-auth-hotfix-static.mjs'
          ]:
              p = Path(name)
              s = p.read_text()
              s = s.replace('1.24P-main.3', '1.24P-main.4')
              s = s.replace(r'1\.24P-main\.3', r'1\.24P-main\.4')
              s = s.replace('102419', '102420')
              s = s.replace('1.24.17', '1.24.18')
              s = s.replace('main-3-local-first-ai', 'main-4-ocr-compression-integrity')
              p.write_text(s)

          # Runtime fallbacks must match the cache-busted release identity.
          for name in [
              'src/core/startup-controller.js',
              'src/features/runtime-features.js',
              'src/features/release-1.24b-ui-policy.js'
          ]:
              p = Path(name)
              s = p.read_text().replace('1.24P-main.3', '1.24P-main.4')
              p.write_text(s)
          PY

          cat > test/ocr-worker-compression-integrity.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const runtime = fs.readFileSync('src/recognition-paddle-ocr.js', 'utf8');
          const vendor = fs.readFileSync('scripts/prepare-paddleocr-vendor.mjs', 'utf8');

          test('PP-OCR Worker integrity is based on decoded manifest identity, not transfer Content-Length', () => {
            assert.match(runtime, /loadRuntimeManifest/);
            assert.match(runtime, /workerBytes/);
            assert.match(runtime, /workerSha256/);
            assert.match(runtime, /content-encoding/);
            assert.match(runtime, /transferBytes/);
            assert.match(runtime, /crypto\?\.subtle/);
            assert.doesNotMatch(runtime, /expectedBytes > 0 && expectedBytes !== bytes\.byteLength/);
          });

          test('vendoring records decoded Worker byte length and SHA-256 in manifest', () => {
            assert.match(vendor, /createHash/);
            assert.match(vendor, /Buffer\.byteLength\(workerSource, 'utf8'\)/);
            assert.match(vendor, /workerSha256/);
            assert.match(vendor, /workerBytes: workerIntegrity\.workerBytes/);
            assert.match(vendor, /workerSha256: workerIntegrity\.workerSha256/);
          });

          test('compressed transfer length is not a decoded-body truncation signal', () => {
            const compressedTransferBytes = 3_622_327;
            const decodedWorkerBytes = 11_341_486;
            assert.notEqual(compressedTransferBytes, decodedWorkerBytes);
            assert.equal(decodedWorkerBytes, 11_341_486);
          });
          EOF

      - name: Regenerate vendor and run complete static/recognition gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/validate-release-meta.mjs
          node --check src/recognition-paddle-ocr.js
          node --check scripts/prepare-paddleocr-vendor.mjs
          npm run test:static
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('public/vendor/paddleocr/manifest.json', 'utf8'));
          const worker = fs.readFileSync('public/vendor/paddleocr/worker.js');
          const digest = crypto.createHash('sha256').update(worker).digest('hex');
          if (worker.length !== manifest.workerBytes) throw new Error(`worker byte mismatch: ${worker.length} != ${manifest.workerBytes}`);
          if (digest !== manifest.workerSha256) throw new Error(`worker digest mismatch: ${digest} != ${manifest.workerSha256}`);
          console.log(`PP-OCR Worker integrity verified: ${worker.length} decoded bytes ${digest}`);
          NODE
          test -z "$(grep -RIl --exclude-dir=.git --exclude='patch-final-recognition-v124p.mjs' '1.24P-main.3' tests test src index.html sw.js release.json package.json || true)"
          test -z "$(grep -RIl --exclude-dir=.git --exclude='patch-final-recognition-v124p.mjs' -F '1\.24P-main\.3' tests test src || true)"
      - name: Commit final product hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recognition-paddle-ocr.js scripts/prepare-paddleocr-vendor.mjs test/ocr-worker-compression-integrity.test.js release.json package.json package-lock.json index.html sw.js tests/v124p-release-contract.mjs tests/v124p-auth-ocr-ai-hotfix-static.mjs tests/v124p-local-first-data-architecture.mjs tests/v124p-startup-auth-hotfix-static.mjs src/core/startup-controller.js src/features/runtime-features.js src/features/release-1.24b-ui-policy.js
          git diff --cached --check
          git commit -m 'fix: restore compressed PP-OCR Worker loading in 1.24P-main.4'
          git push origin HEAD:main
