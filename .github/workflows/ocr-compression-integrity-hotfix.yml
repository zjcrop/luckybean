name: LuckyBean OCR compression integrity hotfix gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-compression-integrity-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Apply compression-aware OCR integrity fix and release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          # 1) Vendor manifest becomes the decoded-content integrity authority.
          p = Path('scripts/prepare-paddleocr-vendor.mjs')
          s = p.read_text()
          needle = "import { fileURLToPath } from 'node:url';\n"
          assert needle in s
          s = s.replace(needle, needle + "import { createHash } from 'node:crypto';\n", 1)
          old = """  const workerSource = await fetchText(workerUrl);\n  if (workerSource.length < 100000) throw new Error(`PaddleOCR worker bundle is unexpectedly small (${workerSource.length} chars)`);\n  await fs.writeFile(path.join(targetRoot, 'worker.js'), workerSource, 'utf8');\n\n  const roiSource"""
          new = """  const workerSource = await fetchText(workerUrl);\n  if (workerSource.length < 100000) throw new Error(`PaddleOCR worker bundle is unexpectedly small (${workerSource.length} chars)`);\n  const workerBytes = Buffer.byteLength(workerSource, 'utf8');\n  const workerSha256 = createHash('sha256').update(workerSource, 'utf8').digest('hex');\n  await fs.writeFile(path.join(targetRoot, 'worker.js'), workerSource, 'utf8');\n\n  const roiSource"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """  await fs.writeFile(path.join(targetRoot, 'roi-worker.js'), roiSource, 'utf8');\n}\n"""
          new = """  await fs.writeFile(path.join(targetRoot, 'roi-worker.js'), roiSource, 'utf8');\n  return Object.freeze({ workerBytes, workerSha256 });\n}\n"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """await prepareSdkAndWorkers();\nawait Promise.all([prepareOrt(), prepareModels()]);\n\nconst manifest = {"""
          new = """const workerIntegrity = await prepareSdkAndWorkers();\nawait Promise.all([prepareOrt(), prepareModels()]);\n\nconst manifest = {"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """  worker: 'worker.js',\n  roiWorker: 'roi-worker.js',"""
          new = """  worker: 'worker.js',\n  workerBytes: workerIntegrity.workerBytes,\n  workerSha256: workerIntegrity.workerSha256,\n  roiWorker: 'roi-worker.js',"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Browser validates decoded bytes/hash against the self-hosted manifest.
          p = Path('src/recognition-paddle-ocr.js')
          s = p.read_text()
          s = s.replace("const VERSION = '0.4.8';", "const VERSION = '0.4.9';", 1)
          s = s.replace("let modulePromise = null;\n", "let modulePromise = null;\nlet runtimeManifestPromise = null;\n", 1)
          marker = """function supportsPreloadedBlobWorker() {\n  return !WEBKIT\n    && typeof Blob === 'function'\n    && typeof Worker === 'function'\n    && typeof globalThis.URL?.createObjectURL === 'function'\n    && typeof globalThis.URL?.revokeObjectURL === 'function';\n}\n"""
          insert = marker + """async function loadRuntimeManifest() {\n  if (!runtimeManifestPromise) {\n    runtimeManifestPromise = fetch(assetUrl('manifest.json'), { cache:'no-store' })\n      .then(async response => {\n        if (!response.ok) throw new Error(`PP-OCRv5 runtime manifest HTTP ${response.status}`);\n        const manifest = await response.json();\n        const workerBytes = Number(manifest?.workerBytes || 0);\n        const workerSha256 = String(manifest?.workerSha256 || '').trim().toLowerCase();\n        if (!Number.isSafeInteger(workerBytes) || workerBytes < WORKER_BUNDLE_MIN_BYTES || !/^[a-f0-9]{64}$/.test(workerSha256)) {\n          throw new Error('PP-OCRv5 runtime manifest 缺少有效 Worker 完整性元数据');\n        }\n        return Object.freeze({ workerBytes, workerSha256 });\n      })\n      .catch(error => { runtimeManifestPromise = null; throw error; });\n  }\n  return runtimeManifestPromise;\n}\nasync function sha256Hex(bytes) {\n  if (!globalThis.crypto?.subtle) throw new Error('当前浏览器缺少 Web Crypto，无法校验 PP-OCRv5 Worker 完整性');\n  const digest = await globalThis.crypto.subtle.digest('SHA-256', bytes);\n  return [...new Uint8Array(digest)].map(value => value.toString(16).padStart(2, '0')).join('');\n}\n"""
          assert marker in s
          s = s.replace(marker, insert, 1)
          old = """      const expectedBytes = Number(response.headers.get('content-length') || 0);\n      const bytes = await response.arrayBuffer();\n      if (bytes.byteLength < WORKER_BUNDLE_MIN_BYTES) {\n        throw new Error(`Worker bundle 不完整：${bytes.byteLength} bytes`);\n      }\n      if (expectedBytes > 0 && expectedBytes !== bytes.byteLength) {\n        throw new Error(`Worker bundle 长度不完整：expected ${expectedBytes}, received ${bytes.byteLength}`);\n      }\n      recordDiagnostic('worker-bundle-fetch', diagnosticStarted, { attempt, bytes:bytes.byteLength, expectedBytes });\n      return bytes;"""
          new = """      const transferBytes = Number(response.headers.get('content-length') || 0);\n      const contentEncoding = String(response.headers.get('content-encoding') || '').trim().toLowerCase() || 'identity';\n      const [bytes, integrity] = await Promise.all([response.arrayBuffer(), loadRuntimeManifest()]);\n      if (bytes.byteLength < WORKER_BUNDLE_MIN_BYTES) {\n        throw new Error(`Worker bundle 不完整：${bytes.byteLength} bytes`);\n      }\n      if (bytes.byteLength !== integrity.workerBytes) {\n        throw new Error(`Worker bundle 解压后长度不匹配：manifest ${integrity.workerBytes}, received ${bytes.byteLength}`);\n      }\n      const workerSha256 = await sha256Hex(bytes);\n      if (workerSha256 !== integrity.workerSha256) {\n        throw new Error(`Worker bundle SHA-256 不匹配：manifest ${integrity.workerSha256}, received ${workerSha256}`);\n      }\n      recordDiagnostic('worker-bundle-fetch', diagnosticStarted, { attempt, bytes:bytes.byteLength, transferBytes, contentEncoding, workerSha256 });\n      return bytes;"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Immutable hotfix release identity. Display version remains 1.24P.
          release_path = Path('release.json')
          release = json.loads(release_path.read_text())
          assert release['revision'] == '1.24P-main.3'
          assert release['androidVersionCode'] == 102419
          release['semver'] = '1.24.18'
          release['revision'] = '1.24P-main.4'
          release['androidVersionCode'] = 102420
          release['releaseTag'] = 'v1.24P-main.4'
          release['cacheRevision'] = 'main-4-ocr-compression-integrity'
          release['hotfix'] = 'ppocr-worker-compression-integrity-20260907'
          release_path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n')

          for name in ['package.json', 'package-lock.json']:
            p = Path(name)
            data = json.loads(p.read_text())
            data['version'] = '1.24.18'
            if name == 'package-lock.json':
              data['packages']['']['version'] = '1.24.18'
            p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('index.html')
          s = p.read_text().replace('1.24P-main.3', '1.24P-main.4')
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text().replace("REVISION = '1.24P-main.3'", "REVISION = '1.24P-main.4'")\
                           .replace('main-3-local-first-ai', 'main-4-ocr-compression-integrity')
          p.write_text(s)

          for name in ['tests/v124p-release-contract.mjs', 'tests/v124p-auth-ocr-ai-hotfix-static.mjs']:
            p = Path(name)
            s = p.read_text().replace('1.24P-main.3', '1.24P-main.4')\
                             .replace('1.24.17', '1.24.18')\
                             .replace('102419', '102420')\
                             .replace('main-3-local-first-ai', 'main-4-ocr-compression-integrity')
            p.write_text(s)
          PY

          cat > test/ocr-worker-compression-integrity.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const runtime = fs.readFileSync('src/recognition-paddle-ocr.js', 'utf8');
          const vendor = fs.readFileSync('scripts/prepare-paddleocr-vendor.mjs', 'utf8');

          test('PP-OCR Worker integrity is based on decoded manifest identity, not transfer Content-Length', () => {
            assert.match(runtime, /loadRuntimeManifest/);
            assert.match(runtime, /workerBytes/);
            assert.match(runtime, /workerSha256/);
            assert.match(runtime, /content-encoding/);
            assert.match(runtime, /transferBytes/);
            assert.match(runtime, /crypto\?\.subtle/);
            assert.doesNotMatch(runtime, /expectedBytes > 0 && expectedBytes !== bytes\.byteLength/);
          });

          test('vendoring records decoded Worker byte length and SHA-256 in manifest', () => {
            assert.match(vendor, /createHash/);
            assert.match(vendor, /Buffer\.byteLength\(workerSource, 'utf8'\)/);
            assert.match(vendor, /workerSha256/);
            assert.match(vendor, /workerBytes: workerIntegrity\.workerBytes/);
            assert.match(vendor, /workerSha256: workerIntegrity\.workerSha256/);
          });

          test('compressed transfer length is not a decoded-body truncation signal', () => {
            const compressedTransferBytes = 3_622_327;
            const decodedWorkerBytes = 11_341_486;
            assert.notEqual(compressedTransferBytes, decodedWorkerBytes);
            const manifest = { workerBytes: decodedWorkerBytes };
            assert.equal(decodedWorkerBytes, manifest.workerBytes);
          });
          EOF

      - name: Install regenerated PP-OCR assets and run static/recognition gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/validate-release-meta.mjs
          node --check src/recognition-paddle-ocr.js
          node --check scripts/prepare-paddleocr-vendor.mjs
          npm run test:static
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('public/vendor/paddleocr/manifest.json', 'utf8'));
          const worker = fs.readFileSync('public/vendor/paddleocr/worker.js');
          if (worker.length !== manifest.workerBytes) throw new Error(`worker byte mismatch: ${worker.length} != ${manifest.workerBytes}`);
          const digest = crypto.createHash('sha256').update(worker).digest('hex');
          if (digest !== manifest.workerSha256) throw new Error(`worker digest mismatch: ${digest} != ${manifest.workerSha256}`);
          console.log(`PP-OCR Worker integrity: ${worker.length} bytes ${digest}`);
          NODE
      - name: Commit product hotfix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recognition-paddle-ocr.js scripts/prepare-paddleocr-vendor.mjs test/ocr-worker-compression-integrity.test.js release.json package.json package-lock.json index.html sw.js tests/v124p-release-contract.mjs tests/v124p-auth-ocr-ai-hotfix-static.mjs
          git diff --cached --check
          git commit -m 'fix: make PP-OCR Worker integrity compression-safe for 1.24P-main.4'
          git push origin HEAD:main
