name: LuckyBean OCR diagnose

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: luckybean-ocr-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local server
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 > /tmp/luckybean-ocr-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/luckybean-ocr-http.log
          exit 1
      - name: Diagnose OCR interaction
        run: npx playwright test tests/v123e-recognition-pipeline-ui.spec.mjs --grep "native OCR payload" --browser=chromium --reporter=line --workers=1
