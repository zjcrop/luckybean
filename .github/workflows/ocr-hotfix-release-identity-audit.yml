name: LuckyBean OCR hotfix release identity audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocr-hotfix-release-identity-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: List current-release hardcodes
        shell: bash
        run: |
          set -euo pipefail
          echo '--- 1.24P-main.3 ---'
          grep -RIn --exclude-dir=.git --exclude='*.lock' '1.24P-main.3' tests test scripts src index.html sw.js release.json package.json .github || true
          echo '--- escaped 1\.24P-main\.3 ---'
          grep -RIn --exclude-dir=.git -F '1\.24P-main\.3' tests test scripts src .github || true
          echo '--- 102419 ---'
          grep -RIn --exclude-dir=.git '102419' tests test scripts src release.json .github || true
          echo '--- 1.24.17 ---'
          grep -RIn --exclude-dir=.git '1.24.17' tests test scripts src package.json release.json .github || true
