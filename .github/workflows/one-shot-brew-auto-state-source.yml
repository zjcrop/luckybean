name: One-shot brew auto state source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-brew-auto-state-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Apply canonical brew auto state source
        run: python scripts/one-shot-brew-auto-state-source.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          grep -Fq "model-recommended lb-auto-field" src/app.js
          grep -Fq "data-source=\"auto\"" src/app.js
          node tests/v123e-small-brew-five-row-regression.mjs
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js
          git commit -m 'fix: render brew automatic state from canonical settings'
          git push origin HEAD:main
