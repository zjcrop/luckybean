name: One-shot canonical bean group refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-canonical-group-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Apply mode-aware canonical group finalizer
        run: python scripts/one-shot-canonical-group-refactor.py
      - name: Validate finalized source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/bean-groups-controller.js
          node --check src/domain/beans/bean-group-state.js
          node --check src/features/release-1.24b-group-navigation.js
          node tests/v123d-deployment-contracts.mjs
          node tests/v124b-final-release-contract.mjs
          node tests/v124b-complete-plan-contract.mjs
          node tests/v124b-ui-policy-regression.mjs
      - name: Commit finalized group source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js src/bean-groups-controller.js src/domain/beans/bean-group-state.js tests/v123d-deployment-contracts.mjs tests/v124b-final-release-contract.mjs tests/v124b-complete-plan-contract.mjs tests/v124b-ui-policy-regression.mjs
          git commit -m 'refactor: finalize mode-aware bean groups'
          git push origin HEAD:main
