name: One-shot canonical bean group refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-canonical-group-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Apply canonical bean group migration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/one-shot-canonical-group-refactor.py
          sed -i 's/beanGroupState\.groupKey: () => beanGroupState\.groupKey/activeGroup: () => beanGroupState.groupKey/' src/bean-groups-controller.js
      - name: Validate migrated JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/bean-groups-controller.js
          node --check src/domain/beans/bean-group-state.js
          node --check src/features/release-1.24b-group-navigation.js
      - name: Commit canonical group refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js src/bean-groups-controller.js src/domain/beans/bean-group-state.js src/features/release-1.24b-group-navigation.js styles.css tests/v124b-group-brew-regression.spec.mjs
          git commit -m 'refactor: canonicalize bean group interactions'
          git push origin HEAD:main
