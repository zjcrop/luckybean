name: One-shot final Core source fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-core-source-fix.yml'

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Apply source-level Core fixes
        run: python scripts/one-shot-final-core-source-fix.py
      - name: Validate changed sources
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/group-interaction-controller.js
          node tests/v123e-ui-stability-static.mjs
          grep -Fq "['process', '按处理法']" src/group-interaction-controller.js
          ! grep -Fq '按处理工法' src/group-interaction-controller.js
          ! grep -Fq '方案推荐${recommendedDripper' src/app.js
          ! grep -Fq 'const ratioRecommendedLabel = `自动 ·' src/app.js
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js src/group-interaction-controller.js tests/v123e-ui-stability-static.mjs
          git commit -m 'fix: render final grouping and brew labels at source'
          git push origin HEAD:main
