name: P0 Core fix v2

on:
  push:
    branches: [perf/local-first-data-v2-20260906]
    paths:
      - scripts/p0-core-finalize.mjs
      - .github/workflows/p0-core-fix-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/local-first-data-v2-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final P0 patch
        run: node scripts/p0-core-finalize.mjs
      - name: Syntax checks
        run: |
          node --check src/app.js
          node --check tests/v124p-recognition-preflight-regression.spec.mjs
      - name: Commit patch and remove branch-only tooling
        shell: bash
        run: |
          git rm -f .github/workflows/p0-core-fix-v2.yml
          git rm -f .github/workflows/p0-core-regression-fix.yml
          git rm -f .github/workflows/local-first-codemod.yml
          git rm -f scripts/p0-core-finalize.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js tests/v124p-recognition-preflight-regression.spec.mjs
          git commit -m 'fix: restore bean digest and preflight readiness'
          git push origin HEAD:perf/local-first-data-v2-20260906
