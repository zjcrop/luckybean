name: P0 WebKit auth trace

on:
  push:
    branches:
      - perf/local-first-data-v2-20260906
    paths:
      - .github/workflows/p0-webkit-auth-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/local-first-data-v2-20260906
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inject non-secret auth provenance diagnostics in CI workspace only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/cloud-auth-service.js')
          s = p.read_text(encoding='utf-8')
          old = """function writeSession(value) {\n  volatileSession = value?.access_token || value?.refresh_token ? value : null;\n  if (volatileSession) storageSet(SESSION_KEY, JSON.stringify(volatileSession));\n  else storageRemove(SESSION_KEY);\n}"""
          new = """function writeSession(value) {\n  globalThis.__LuckyBeanAuthTrace ||= [];\n  globalThis.__LuckyBeanAuthTrace.push({\n    type:'writeSession', at:Date.now(), hasAccess:Boolean(value?.access_token), hasRefresh:Boolean(value?.refresh_token), userId:value?.user?.id||'',\n    stack:String(new Error().stack||'').split('\\n').slice(1,6).map(line=>line.trim())\n  });\n  if(globalThis.__LuckyBeanAuthTrace.length>30) globalThis.__LuckyBeanAuthTrace.shift();\n  volatileSession = value?.access_token || value?.refresh_token ? value : null;\n  if (volatileSession) storageSet(SESSION_KEY, JSON.stringify(volatileSession));\n  else storageRemove(SESSION_KEY);\n}"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """async function refreshSession({ force = false, reason = 'background' } = {}) {\n  if (refreshPromise) return refreshPromise;"""
          new = """async function refreshSession({ force = false, reason = 'background' } = {}) {\n  globalThis.__LuckyBeanAuthTrace ||= [];\n  {\n    const active = readSession();\n    globalThis.__LuckyBeanAuthTrace.push({\n      type:'refreshSession', at:Date.now(), force, reason, hasAccess:Boolean(active?.access_token), hasRefresh:Boolean(active?.refresh_token), tokenValid:accessTokenValid(active), callbackAuthoritative:callbackSessionAuthoritative(active),\n      stack:String(new Error().stack||'').split('\\n').slice(1,7).map(line=>line.trim())\n    });\n    if(globalThis.__LuckyBeanAuthTrace.length>30) globalThis.__LuckyBeanAuthTrace.shift();\n  }\n  if (refreshPromise) return refreshPromise;"""
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          t = Path('tests/v124p-webkit-auth-ocr.spec.mjs')
          s = t.read_text(encoding='utf-8')
          old = """  const state=await page.evaluate(()=>({hash:location.hash,auth:document.documentElement.dataset.cloudAuth,storage:document.documentElement.dataset.cloudStorage,email:globalThis.LuckyBeanCloudAuth.getSession()?.user?.email}));\n  expect(refreshCalls).toBe(0);"""
          new = """  const state=await page.evaluate(()=>({hash:location.hash,auth:document.documentElement.dataset.cloudAuth,storage:document.documentElement.dataset.cloudStorage,email:globalThis.LuckyBeanCloudAuth.getSession()?.user?.email,trace:globalThis.__LuckyBeanAuthTrace||[]}));\n  console.log('P0_AUTH_FINAL='+JSON.stringify({refreshCalls,state}));\n  expect(refreshCalls).toBe(0);"""
          assert old in s
          t.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npx playwright install --with-deps webkit
      - name: Start local server
        shell: bash
        run: |
          python -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/luckybean-http.log
          exit 1
      - name: Run Safari callback P0 diagnostic only
        run: npx playwright test tests/v124p-webkit-auth-ocr.spec.mjs --browser=webkit --reporter=line --workers=1 --grep "email verification callback"
