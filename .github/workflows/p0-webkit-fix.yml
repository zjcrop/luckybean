name: P0 WebKit callback/runtime fix

on:
  push:
    branches:
      - perf/local-first-data-v2-20260906
    paths:
      - .github/workflows/p0-webkit-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/local-first-data-v2-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Apply P0 Safari/WebKit startup fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Capture an actual provisional session synchronously in <head>, not only the raw hash.
          bootstrap = Path('src/core/auth-callback-bootstrap.js')
          bootstrap.write_text("""(() => {
            const hash = String(globalThis.location?.hash || '');
            if (!hash || hash === '#') return;
            try {
              const params = new URLSearchParams(hash.replace(/^#/, ''));
              if (!params.has('access_token') && !params.has('refresh_token') && !params.has('error') && !params.has('error_code')) return;
              globalThis.__LuckyBeanInitialAuthCallbackHash = hash;
              const accessToken = params.get('access_token') || '';
              const refreshToken = params.get('refresh_token') || '';
              if (accessToken && refreshToken) {
                const expiresIn = Number(params.get('expires_in') || 3600);
                globalThis.__LuckyBeanInitialAuthCallbackSession = {
                  access_token: accessToken,
                  refresh_token: refreshToken,
                  token_type: params.get('token_type') || 'bearer',
                  expires_in: expiresIn,
                  expires_at: Math.floor(Date.now() / 1000) + Math.max(60, expiresIn),
                  user: null
                };
                document.documentElement.dataset.authCallbackSnapshot = 'session-captured';
              } else {
                document.documentElement.dataset.authCallbackSnapshot = 'captured';
              }
            } catch {
              // Keep the original URL untouched; the auth module will fall back to location.hash.
            }
          })();
          """, encoding='utf-8')

          # 2) Consume the head-captured session atomically in the module. Callback enrichment must
          #    work even if WebKit changes URL/storage state between classic-script and module phases.
          auth = Path('src/services/cloud-auth-service.js')
          text = auth.read_text(encoding='utf-8')
          old = """const INITIAL_AUTH_CALLBACK_PARAMS = parseAuthCallbackHash(INITIAL_AUTH_CALLBACK_HASH);\nconst INITIAL_AUTH_CALLBACK_SESSION = provisionalSessionFromCallback(INITIAL_AUTH_CALLBACK_PARAMS);\ntry { delete globalThis.__LuckyBeanInitialAuthCallbackHash; }\ncatch { globalThis.__LuckyBeanInitialAuthCallbackHash = ''; }\nif (INITIAL_AUTH_CALLBACK_PARAMS) document.documentElement.dataset.authCallbackSnapshot = 'consumed';"""
          new = """const INITIAL_AUTH_CALLBACK_PARAMS = parseAuthCallbackHash(INITIAL_AUTH_CALLBACK_HASH);\nconst HEAD_AUTH_CALLBACK_SESSION = globalThis.__LuckyBeanInitialAuthCallbackSession;\nconst INITIAL_AUTH_CALLBACK_SESSION = HEAD_AUTH_CALLBACK_SESSION?.access_token && HEAD_AUTH_CALLBACK_SESSION?.refresh_token\n  ? { ...HEAD_AUTH_CALLBACK_SESSION }\n  : provisionalSessionFromCallback(INITIAL_AUTH_CALLBACK_PARAMS);\ntry { delete globalThis.__LuckyBeanInitialAuthCallbackHash; }\ncatch { globalThis.__LuckyBeanInitialAuthCallbackHash = ''; }\ntry { delete globalThis.__LuckyBeanInitialAuthCallbackSession; }\ncatch { globalThis.__LuckyBeanInitialAuthCallbackSession = null; }\nif (INITIAL_AUTH_CALLBACK_PARAMS || INITIAL_AUTH_CALLBACK_SESSION) document.documentElement.dataset.authCallbackSnapshot = 'consumed';"""
          assert old in text, 'auth initial snapshot block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = """  const params = callbackParams();\n  if (!params) { authCallbackConsumed = true; return null; }\n\n  authCallbackPromise = (async () => {\n    const callbackError = params.get('error_description') || params.get('error') || params.get('error_code');"""
          new = """  const params = callbackParams();\n  const headSession = !authCallbackConsumed ? INITIAL_AUTH_CALLBACK_SESSION : null;\n  if (!params && !headSession) { authCallbackConsumed = true; return null; }\n\n  authCallbackPromise = (async () => {\n    const callbackError = params?.get('error_description') || params?.get('error') || params?.get('error_code');"""
          assert old in text, 'auth callback entry block changed unexpectedly'
          text = text.replace(old, new, 1)

          old = """      error.code = params.get('error_code') || params.get('error') || 'auth_callback_error';"""
          new = """      error.code = params?.get('error_code') || params?.get('error') || 'auth_callback_error';"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    const accessToken = params.get('access_token') || '';\n    const refreshToken = params.get('refresh_token') || '';\n    if (!accessToken || !refreshToken) { authCallbackConsumed = true; return null; }\n    const expiresIn = Number(params.get('expires_in') || 3600);\n    const provisional = {\n      access_token:accessToken,\n      refresh_token:refreshToken,\n      token_type:params.get('token_type') || 'bearer',\n      expires_in:expiresIn,\n      expires_at:Math.floor(Date.now() / 1000) + Math.max(60, expiresIn),\n      user:null\n    };"""
          new = """    const parsed = provisionalSessionFromCallback(params);\n    const provisional = headSession?.access_token && headSession?.refresh_token ? { ...headSession } : parsed;\n    const accessToken = provisional?.access_token || '';\n    const refreshToken = provisional?.refresh_token || '';\n    if (!accessToken || !refreshToken) { authCallbackConsumed = true; return null; }"""
          assert old in text, 'auth provisional callback block changed unexpectedly'
          text = text.replace(old, new, 1)
          text = text.replace("revision:'cloud-auth-service-v10-parity-refresh-semantics'", "revision:'cloud-auth-service-v11-head-session-parity'", 1)
          auth.write_text(text, encoding='utf-8')

          # 3) Publish RuntimeFeatures before awaiting unrelated preinteraction imports. The full
          #    ready event remains after core/preinteraction settlement, preserving existing contract.
          runtime = Path('src/features/runtime-features.js')
          text = runtime.read_text(encoding='utf-8')
          old = """for (const runtimeFeature of CORE_FEATURES) {\n  try { await loadFeature(runtimeFeature.id); }\n  catch { /* failure already recorded */ }\n}\n\nawait loadMany(PREINTERACTION_FEATURE_IDS);\ninstallLazyTriggers();\n\nglobalThis.LuckyBeanRuntimeFeatures = {\n  revision: RELEASE_REVISION,\n  declared: [...catalog.keys()],\n  core: CORE_FEATURES.map(item => item.id),\n  lazy: LAZY_FEATURES.map(item => item.id),\n  loaded,\n  failures,\n  load: loadFeature,\n  loadMany,\n  warmRecognition,\n  isLoaded\n};"""
          new = """globalThis.LuckyBeanRuntimeFeatures = {\n  revision: RELEASE_REVISION,\n  declared: [...catalog.keys()],\n  core: CORE_FEATURES.map(item => item.id),\n  lazy: LAZY_FEATURES.map(item => item.id),\n  loaded,\n  failures,\n  load: loadFeature,\n  loadMany,\n  warmRecognition,\n  isLoaded\n};\ndocument.documentElement.dataset.runtimeFeatures = 'declared';\n\nfor (const runtimeFeature of CORE_FEATURES) {\n  try { await loadFeature(runtimeFeature.id); }\n  catch { /* failure already recorded */ }\n}\n\nawait loadMany(PREINTERACTION_FEATURE_IDS);\ninstallLazyTriggers();"""
          assert old in text, 'runtime publication block changed unexpectedly'
          text = text.replace(old, new, 1)
          runtime.write_text(text, encoding='utf-8')

          # 4) Lock the stronger contracts in static tests.
          p = Path('tests/v124p-startup-auth-hotfix-static.mjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace("assert.match(bootstrap, /__LuckyBeanInitialAuthCallbackHash/, 'head bootstrap must snapshot a relevant callback hash');", "assert.match(bootstrap, /__LuckyBeanInitialAuthCallbackHash/, 'head bootstrap must snapshot a relevant callback hash');\nassert.match(bootstrap, /__LuckyBeanInitialAuthCallbackSession/, 'head bootstrap must synchronously capture a provisional callback session for Safari');")
          text = text.replace("assert.match(auth, /delete globalThis\\.__LuckyBeanInitialAuthCallbackHash/, 'raw callback snapshot must be deleted immediately after parsing');", "assert.match(auth, /HEAD_AUTH_CALLBACK_SESSION = globalThis\\.__LuckyBeanInitialAuthCallbackSession/, 'auth service must consume the synchronous head session snapshot');\nassert.match(auth, /delete globalThis\\.__LuckyBeanInitialAuthCallbackHash/, 'raw callback snapshot must be deleted immediately after parsing');\nassert.match(auth, /delete globalThis\\.__LuckyBeanInitialAuthCallbackSession/, 'raw callback session snapshot must be deleted after local adoption');")
          text = text.replace("cloud-auth-service-v10-parity-refresh-semantics", "cloud-auth-service-v11-head-session-parity")
          p.write_text(text, encoding='utf-8')

          p = Path('tests/v124p-auth-ocr-ai-hotfix-static.mjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace("assert.match(auth,/__LuckyBeanInitialAuthCallbackHash/);", "assert.match(auth,/__LuckyBeanInitialAuthCallbackHash/);\nassert.match(auth,/__LuckyBeanInitialAuthCallbackSession/);")
          text = text.replace("cloud-auth-service-v10-parity-refresh-semantics", "cloud-auth-service-v11-head-session-parity")
          p.write_text(text, encoding='utf-8')

          p = Path('tests/v124p-webkit-auth-ocr.spec.mjs')
          text = p.read_text(encoding='utf-8')
          old = """  await enter(page,`${BASE_URL}/?webkit-callback=1#access_token=a.b.c&refresh_token=webkit-refresh&expires_in=3600&token_type=bearer`);\n  await expect.poll(()=>page.evaluate(()=>globalThis.LuckyBeanCloudAuth?.getSession?.()?.refresh_token||''),{timeout:15000}).toBe('webkit-refresh');"""
          new = """  await enter(page,`${BASE_URL}/?webkit-callback=1#access_token=a.b.c&refresh_token=webkit-refresh&expires_in=3600&token_type=bearer`);\n  await expect.poll(()=>page.evaluate(()=>({\n    refreshToken:globalThis.LuckyBeanCloudAuth?.getSession?.()?.refresh_token||'',\n    revision:globalThis.LuckyBeanCloudAuth?.revision||'',\n    snapshot:document.documentElement.dataset.authCallbackSnapshot||'',\n    auth:document.documentElement.dataset.cloudAuth||'',\n    storage:document.documentElement.dataset.cloudStorage||'',\n    hash:location.hash\n  })),{timeout:15000}).toMatchObject({refreshToken:'webkit-refresh',revision:'cloud-auth-service-v11-head-session-parity',snapshot:'consumed'});"""
          assert old in text, 'webkit auth poll block changed unexpectedly'
          text = text.replace(old, new, 1)
          old = """  await page.waitForFunction(()=>Boolean(globalThis.LuckyBeanRuntimeFeatures)&&Boolean(globalThis.LuckyBeanPackageCapture),null,{timeout:15000});"""
          new = """  await expect.poll(()=>page.evaluate(()=>({\n    runtime:Boolean(globalThis.LuckyBeanRuntimeFeatures),\n    packageCapture:Boolean(globalThis.LuckyBeanPackageCapture),\n    runtimeState:document.documentElement.dataset.runtimeFeatures||'',\n    startup:document.documentElement.dataset.startup||'',\n    failures:globalThis.LuckyBeanRuntimeFeatures?.failures||[]\n  })),{timeout:15000}).toMatchObject({runtime:true,packageCapture:true});"""
          assert old in text, 'webkit runtime wait block changed unexpectedly'
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused P0 contracts
        run: |
          node --check src/core/auth-callback-bootstrap.js
          node --check src/services/cloud-auth-service.js
          node --check src/features/runtime-features.js
          node tests/v124p-startup-auth-hotfix-static.mjs
          node tests/v124p-auth-ocr-ai-hotfix-static.mjs

      - name: Commit P0 fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/auth-callback-bootstrap.js src/services/cloud-auth-service.js src/features/runtime-features.js tests/v124p-startup-auth-hotfix-static.mjs tests/v124p-auth-ocr-ai-hotfix-static.mjs tests/v124p-webkit-auth-ocr.spec.mjs
          git commit -m "fix: harden Safari callback and WebKit runtime startup"
          git push origin HEAD:perf/local-first-data-v2-20260906
