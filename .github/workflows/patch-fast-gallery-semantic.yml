name: Patch Fast Gallery Semantic Branch
on:
  push:
    branches: [fix/ocr-semantic-fast-gallery-20260909]
    paths:
      - '.github/workflows/patch-fast-gallery-semantic.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/ocr-semantic-fast-gallery-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Apply default fast gallery path while preserving manual low-memory crop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/gallery-image-preprocess.js')
          s=p.read_text(encoding='utf-8')
          anchor="const PROCESS_TIMEOUT_MS = 30000;\n"
          insert="""const PROCESS_TIMEOUT_MS = 30000;\nconst FULL_REGION = Object.freeze({left:0,top:0,right:1,bottom:1});\nlet manualCropRequested=false;\n"""
          if s.count(anchor)!=1: raise SystemExit('gallery constants anchor mismatch')
          s=s.replace(anchor,insert,1)

          old="""  const result=await operation;\n  const stem=String(file.name||'image').replace(/\\.[^.]+$/,'');\n  const processed=new File([result.blob],`${stem}-ocr-crop.jpg`,{type:'image/jpeg',lastModified:Date.now()});\n  registerOcrReady(processed,{width:Number(result.width||0),height:Number(result.height||0),quality:OUTPUT_QUALITY,source:'gallery-worker-crop',skipSecondEncode:true});\n  return processed;\n}\n"""
          new="""  const result=await operation;\n  const stem=String(file.name||'image').replace(/\\.[^.]+$/,'');\n  const fast=options?.mode==='fast';\n  const processed=new File([result.blob],`${stem}-${fast?'ocr-fast':'ocr-crop'}.jpg`,{type:'image/jpeg',lastModified:Date.now()});\n  registerOcrReady(processed,{width:Number(result.width||0),height:Number(result.height||0),quality:OUTPUT_QUALITY,source:fast?'gallery-worker-auto-fast':'gallery-worker-crop',skipSecondEncode:true});\n  return processed;\n}\n"""
          if s.count(old)!=1: raise SystemExit('process result anchor mismatch')
          s=s.replace(old,new,1)

          old="""async function preprocessFiles(files){\n  const output=[];\n  for(let index=0;index<files.length;index+=1){\n    const file=files[index];\n    if(!file)continue;\n    const processed=await openDialog(file);\n    files[index]=null;\n    if(processed)output.push(processed);\n  }\n  return output;\n}\n"""
          new="""async function preprocessFilesManual(files){\n  const output=[];\n  for(let index=0;index<files.length;index+=1){\n    const file=files[index];\n    if(!file)continue;\n    const processed=await openDialog(file);\n    files[index]=null;\n    if(processed)output.push(processed);\n  }\n  return output;\n}\nasync function preprocessFiles(files){\n  const useManual=manualCropRequested;\n  manualCropRequested=false;\n  if(useManual)return preprocessFilesManual(files);\n  const output=[];\n  for(let index=0;index<files.length;index+=1){\n    const file=files[index];\n    if(!file)continue;\n    const processed=await processFile(file,{region:FULL_REGION,quarterTurns:0,deskewDegrees:0,perspectiveQuad:null,mode:'fast'});\n    files[index]=null;\n    if(processed)output.push(processed);\n  }\n  return output;\n}\nfunction installManualCropButton(){\n  const ensure=()=>{\n    const gallery=document.querySelector('#bagGalleryBtn');\n    if(!gallery||document.querySelector('#bagGalleryCropBtn'))return;\n    const button=document.createElement('button');\n    button.id='bagGalleryCropBtn';\n    button.className='button subtle';\n    button.type='button';\n    button.textContent='相册裁切';\n    button.addEventListener('click',()=>{\n      const input=document.querySelector('#bagGalleryInput');\n      if(!input||input.disabled)return;\n      manualCropRequested=true;\n      input.dataset.lbPreprocessed='1';\n      input.click();\n    });\n    gallery.insertAdjacentElement('afterend',button);\n  };\n  document.addEventListener('click',event=>{if(event.target?.closest?.('#bagGalleryBtn'))manualCropRequested=false;},true);\n  new MutationObserver(ensure).observe(document.documentElement,{childList:true,subtree:true});\n  ensure();\n}\n"""
          if s.count(old)!=1: raise SystemExit('preprocessFiles anchor mismatch')
          s=s.replace(old,new,1)

          old="""installGalleryInterceptor();\nglobalThis.LuckyBeanGalleryImagePreprocess=Object.freeze({openDialog,preprocessFiles,estimateDeskew,detectPerspectiveQuad,readyKey});\n"""
          new="""installGalleryInterceptor();\ninstallManualCropButton();\nglobalThis.LuckyBeanGalleryImagePreprocess=Object.freeze({openDialog,preprocessFiles,preprocessFilesManual,requestManualCrop(){manualCropRequested=true;},estimateDeskew,detectPerspectiveQuad,readyKey});\n"""
          if s.count(old)!=1: raise SystemExit('gallery API anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/v124p-gallery-upload-flow.spec.mjs')
          t.write_text(r'''import { test, expect } from '@playwright/test';

test.setTimeout(120_000);

async function openCapture(page) {
  await page.addInitScript(() => {
    localStorage.setItem('luckybean.onboarding.v2', JSON.stringify({ stage:'existing-user', updatedAt:new Date().toISOString(), reason:'gallery-upload-smoke' }));
  });
  await page.goto('http://127.0.0.1:4173/', { waitUntil:'domcontentloaded' });
  const splash = page.locator('#splashScreen');
  if (await splash.isVisible().catch(() => false)) await splash.click();
  await expect(page.locator('#appShell')).toBeVisible({ timeout:15_000 });
  await page.waitForFunction(() => Boolean(globalThis.LuckyBeanRuntimeFeatures?.loadMany), null, { timeout:20_000 });
  await page.evaluate(() => globalThis.LuckyBeanRuntimeFeatures.loadMany(['gallery-image-preprocess','package-capture']));
  await page.waitForFunction(() => Boolean(globalThis.LuckyBeanPackageCapture?.open), null, { timeout:20_000 });
  await page.evaluate(() => globalThis.LuckyBeanPackageCapture.open());
}

async function jpegFixture(page) {
  return page.evaluate(async () => {
    const canvas=document.createElement('canvas'); canvas.width=1200; canvas.height=800;
    const context=canvas.getContext('2d'); context.fillStyle='#f8f6ef'; context.fillRect(0,0,1200,800);
    context.fillStyle='#151515'; context.font='bold 64px Arial'; context.fillText('ETHIOPIA GUJI',100,260); context.fillText('WASHED 1950M',100,390);
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(result=>result?resolve(result):reject(new Error('JPEG fixture creation failed')),'image/jpeg',0.9));
    return [...new Uint8Array(await blob.arrayBuffer())];
  });
}

async function chooseJpeg(page, buttonSelector, name) {
  const bytes=await jpegFixture(page);
  const [chooser]=await Promise.all([page.waitForEvent('filechooser'), page.locator(buttonSelector).click()]);
  await chooser.setFiles({name,mimeType:'image/jpeg',buffer:Buffer.from(bytes)});
}

test('default gallery chooser uses automatic bounded-worker fast path without forcing crop UI', async ({ page }) => {
  const pageErrors=[]; page.on('pageerror',error=>pageErrors.push(String(error?.message||error)));
  await openCapture(page);
  await expect(page.locator('#bagGalleryBtn')).toBeEnabled({timeout:10_000});
  await chooseJpeg(page,'#bagGalleryBtn','gallery-fast-smoke.jpg');
  await expect(page.locator('.lb-img-pre')).toHaveCount(0);
  await expect(page.locator('.bag-photo-card')).toHaveCount(1,{timeout:20_000});
  await expect(page.locator('.bag-photo-card')).toContainText(/1200×800 px|OCR 专用图|跳过第二次图片解码/);
  expect(pageErrors.filter(message=>/gallery|image|bitmap|preview|canvas/i.test(message))).toEqual([]);
});

test('manual gallery crop remains available as an explicit low-memory option', async ({ page }) => {
  await openCapture(page);
  await expect(page.locator('#bagGalleryCropBtn')).toBeVisible({timeout:10_000});
  await chooseJpeg(page,'#bagGalleryCropBtn','gallery-manual-smoke.jpg');
  const cropOverlay=page.locator('.lb-img-pre');
  await expect(cropOverlay).toBeVisible({timeout:15_000});
  await expect(page.getByRole('heading',{name:'裁切识别范围'})).toBeVisible();
  const statusText=await page.locator('.lb-img-pre__status').textContent();
  expect(String(statusText||'')).toMatch(/低分辨率预览|使用照片内置缩略图/);
  await page.locator('[data-cancel]').click();
  await expect(cropOverlay).toHaveCount(0);
});
''',encoding='utf-8')
          PY
      - name: Verify focused semantic and gallery contracts
        run: |
          node --check src/gallery-image-preprocess.js
          node --check src/domain/recognition/recognition-semantic-repair.js
          node --test test/recognition-semantic-ownership-regression.test.js
          node --test test/gallery-low-memory-pipeline.test.js
      - name: Commit branch patch
        run: |
          git config user.name "zjcrop"
          git config user.email "127176814+zjcrop@users.noreply.github.com"
          git add src/gallery-image-preprocess.js tests/v124p-gallery-upload-flow.spec.mjs
          git commit -m "fix(ocr): restore automatic fast gallery path with optional crop"
          git push origin HEAD:fix/ocr-semantic-fast-gallery-20260909
