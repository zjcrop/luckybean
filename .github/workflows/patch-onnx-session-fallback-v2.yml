name: One-shot patch ONNX session fallback v2

on:
  push:
    paths:
      - '.github/workflows/patch-onnx-session-fallback-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply runtime patch
        run: python3 scripts/apply-onnx-session-fallback.py
      - name: Verify syntax and OCR regression gates
        run: |
          node --check src/recognition-paddle-ocr.js
          node --test test/ocr-onnx-session-fallback.test.js test/ocr-wasm-memory-fallback.test.js test/ocr-lifecycle-memory-regression.test.js
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/recognition-paddle-ocr.js
          git diff --cached --check
          git commit -m 'fix(ocr): retry ONNX session init in WASM compatibility mode'
          git push origin HEAD:main
