name: Prepare PP-OCRv5 runtime gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare-ocr-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Generate self-hosted PP-OCRv5 runtime
        run: npm run prepare:ocr
      - name: Record immutable asset checksums
        working-directory: public/vendor/paddleocr
        run: |
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-ocr-runtime-${{ github.sha }}
          path: public/vendor/paddleocr/
          if-no-files-found: error
