name: Prepare PP-OCRv5 runtime gate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare-ocr-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate self-hosted PP-OCRv5 runtime
        run: node scripts/prepare-paddleocr-vendor.mjs
      - name: Verify OCR assets
        run: |
          test -f public/vendor/paddleocr/manifest.json
          test -f public/vendor/paddleocr/worker.js
          test -d public/vendor/paddleocr/models
          test -d public/vendor/paddleocr/ort
