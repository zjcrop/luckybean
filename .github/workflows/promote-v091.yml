name: Prepare Lucky Bean 0.9.1

on:
  push:
    branches: [release-0.9.1]
    paths:
      - '.github/workflows/promote-v091.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-0.9.1
          fetch-depth: 0

      - name: Upgrade version and database compatibility
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta/v0.8.0 --depth=1
          git show FETCH_HEAD:src/db.js > src/db.js
          python - <<'PY'
          from pathlib import Path
          allowed = {'.js','.mjs','.json','.md','.html','.css','.yml','.yaml','.webmanifest','.txt'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              if path.suffix.lower() not in allowed and path.name not in {'LICENSE'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              text = text.replace('0.9.0-beta.1', '0.9.1')
              text = text.replace('luckybean-beta/', 'luckybean/')
              path.write_text(text, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          old = "event.respondWith(caches.match(request).then(cached => cached || fetch(request).then(response => { if (response.ok) { const copy = response.clone(); caches.open(CACHE_NAME).then(cache => cache.put(request, copy)); } return response; })));"
          new = "event.respondWith(fetch(request).then(response => { if (response.ok) { const copy = response.clone(); caches.open(CACHE_NAME).then(cache => cache.put(request, copy)); } return response; }).catch(() => caches.match(request)));"
          sw_path.write_text(sw.replace(old, new), encoding='utf-8')
          PY

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "const p=require('./package.json'); if(p.version!=='0.9.1') process.exit(1)"
          grep -q "APP_VERSION = '0.9.1'" src/utils.js
          grep -q "SCHEMA_VERSION = 6" src/utils.js
          grep -q "const CACHE_NAME = 'luckybean-v0.9.1'" sw.js
          grep -q "const current = await openDatabase()" src/db.js
          grep -q 'lucky-brew-0.9.1' src/brew-engine.js
          grep -q 'lucky-brew-model-0.9.1' src/brew-model-v09.js

      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-v091.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: promote Lucky Bean 0.9.1'
          git push origin HEAD:release-0.9.1
