name: Apply codebook review UI

on:
  push:
    branches: [test-v107-web]
    paths:
      - 'scripts/refactor-codebook-review-ui.mjs'
      - '.github/workflows/refactor-codebook-review-ui.yml'

permissions:
  contents: write

concurrency:
  group: luckybean-test-v107-refactor-write
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-v107-web
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebase on latest branch head
        run: git pull --rebase origin test-v107-web
      - name: Apply codebook review migration
        run: node scripts/refactor-codebook-review-ui.mjs
      - name: Verify codebook review modules
        run: |
          node --check src/ui/provider-status-panel.js
          node --check src/ui/codebook-reconciliation-screen.js
          node --check src/services/codebook-reconciliation-service.js
          npm run test:static
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo 'No codebook review migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css sw.js
          git commit -m 'refactor: add explicit custom code reconciliation review'
          git pull --rebase origin test-v107-web
          git push origin HEAD:test-v107-web
