name: Apply formal history UI

on:
  push:
    branches: [test-v107-web]
    paths:
      - 'scripts/refactor-history-ui.mjs'
      - '.github/workflows/refactor-history-ui.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-v107-web
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply history migration
        run: node scripts/refactor-history-ui.mjs
      - name: Verify formal history modules
        run: |
          node --check src/app.js
          node --check src/domain/history/history-service.js
          node --check src/domain/history/history-migration.js
          node --check src/ui/history/history-screen.js
          npm run test:static
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo 'No history UI migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js styles.css src/features/compatibility-bundle.js sw.js
          git commit -m 'refactor: integrate formal completed-brew history management'
          git push origin HEAD:test-v107-web
