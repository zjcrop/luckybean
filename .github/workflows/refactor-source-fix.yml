name: Refactor source correction

on:
  push:
    branches:
      - refactor/v120-integrated-core

permissions:
  contents: write

concurrency:
  group: refactor-source-correction
  cancel-in-progress: false

jobs:
  correct-settings-selector:
    if: ${{ !contains(github.event.head_commit.message, '[source-correction]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v120-integrated-core
          fetch-depth: 0
      - name: Correct collection selector in formal settings renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app.js')
          text = path.read_text(encoding='utf-8')
          old = "$('.settings-category').forEach(section=>section.addEventListener('toggle',()=>{if(!section.open)return;$('.settings-category').forEach(other=>{if(other!==section)other.open=false;});}));"
          new = "$$('.settings-category').forEach(section=>section.addEventListener('toggle',()=>{if(!section.open)return;$$('.settings-category').forEach(other=>{if(other!==section)other.open=false;});}));"
          if old not in text:
              print('Formal selector is already corrected; no source change required.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet -- src/app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "fix: use collection selector in settings renderer [source-correction]"
          git push origin HEAD:refactor/v120-integrated-core
