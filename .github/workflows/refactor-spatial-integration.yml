name: Apply formal spatial integration

on:
  push:
    branches: [test-v107-web]
    paths:
      - 'scripts/refactor-spatial-integration.mjs'
      - '.github/workflows/refactor-spatial-integration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-v107-web
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply spatial migration
        run: node scripts/refactor-spatial-integration.mjs
      - name: Verify formal renderer
        run: |
          node --check src/app.js
          node --check src/renderers/brew-spatial-view.js
          node --check src/renderers/brew-spatial-controller.js
          node --check src/services/brew-analysis-service.js
          npm run test:static
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo 'No spatial migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js styles.css src/features/compatibility-bundle.js sw.js
          git commit -m 'refactor: integrate formal BrewProfiles spatial renderer'
          git push origin HEAD:test-v107-web
