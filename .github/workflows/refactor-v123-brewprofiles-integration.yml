name: Cancel stale LuckyBean v1.2.3 refactor run

on:
  push:
    branches: [fix/v123-brewprofiles-integration]
    paths: [.github/workflows/refactor-v123-brewprofiles-integration.yml]

permissions:
  contents: read

concurrency:
  group: luckybean-v123-brewprofiles-refactor
  cancel-in-progress: true

jobs:
  release-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'Stale refactor run cancelled; final branch owns verification.'
