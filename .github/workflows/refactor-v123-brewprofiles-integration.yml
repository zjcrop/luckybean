          PY

      - name: Set up Java 17 and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and inspect APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android clean
          gradle --no-daemon --stacktrace -p android :app:assembleDebug
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > package/SIGNING-CERTIFICATE.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" > package/APK-BADGING.txt
          grep -F "versionCode='100123'" package/APK-BADGING.txt
          unzip -Z1 "$apk" > package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/services/brew-api-client.js' package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/services/brew-profile-catalog-service.js' package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/services/brew-analysis-service.js' package/APK-CONTENTS.txt
          grep -F 'assets/web-cache/src/renderers/brew-spatial-controller.js' package/APK-CONTENTS.txt
