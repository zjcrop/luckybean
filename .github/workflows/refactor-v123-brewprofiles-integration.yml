          if unzip -p "$apk" assets/web-cache/src/services/brew-analysis-service.js | grep -F 'LuckyBeanCloudAuth'; then exit 1; fi
          cp "$apk" package/LuckyBean-1.2.3-brewprofiles-integration-test.apk
          sha256sum package/LuckyBean-1.2.3-brewprofiles-integration-test.apk package/LuckyBean-1.2.3-web-preview.zip > package/SHA256SUMS.txt

