name: Release 099t bean groups

on:
  push:
    paths:
      - .github/workflows/release-099t-bean-groups.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch group runtime and release references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          group = Path('src/v099t-bean-groups.js')
          text = group.read_text(encoding='utf-8')
          text = text.replace('const mode = await getMode();\n    const recommendation', 'const mode = currentMode || MODE_NATIVE;\n    const recommendation', 1)
          group.write_text(text, encoding='utf-8')

          old = Path('src/v098-feature-fixes.js')
          text = old.read_text(encoding='utf-8')
          text, count = re.subn(r'function queueGroups\(\) \{.*?\n\}', "function queueGroups() {\n  // 099t owns custom grouping. Do not recompute groups from the global DOM observer.\n  return;\n}", text, count=1, flags=re.S)
          if count != 1 and '099t owns custom grouping' not in text:
              raise SystemExit('queueGroups patch failed')
          old.write_text(text, encoding='utf-8')

          menu = Path('src/v099m-group-controller.js')
          text = menu.read_text(encoding='utf-8')
          text = text.replace("remaining: ratioMode !== 'freshness-ratio' && legacyMode === 'remaining-50'", "remaining: ratioMode === 'remaining-50' || (ratioMode !== 'freshness-ratio' && legacyMode === 'remaining-50')")
          menu.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('./src/v099i-freshness-group.js', './src/v099t-bean-groups.js')
          text = text.replace('099s', '099t')
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('./src/v099i-freshness-group.js', './src/v099t-bean-groups.js')
          text = text.replace('099s', '099t')
          sw.write_text(text, encoding='utf-8')
          PY
          node --check src/v099t-bean-groups.js
          node --check src/v098-feature-fixes.js
          node --check src/v099m-group-controller.js
          node --check sw.js
      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v099t-bean-groups.js src/v098-feature-fixes.js src/v099m-group-controller.js index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preserve leaderboard and cache custom bean groups"
          git push
