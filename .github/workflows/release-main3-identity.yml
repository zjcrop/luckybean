name: LuckyBean 1.24B main.3 identity migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-main3-identity
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message || '', 'apply 1.24B main.3 identity migration') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: node scripts/release-main3-identity.mjs
      - run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit migrated identities
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js src tests .github/workflows DEVELOPMENT_STATUS.md
          git commit -m 'release: apply 1.24B main.3 identity migration'
          git push origin HEAD:main
