name: Repair recommendation menu owner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-recommendation-menu-owner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply local menu ownership repair
        run: python scripts/repair-recommendation-menu-owner.py
      - name: Verify repaired interaction path
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          grep -Fq "popup.addEventListener('click', event => {" src/app.js
          grep -Fq 'void recommendBean(button.dataset.recommendMode)' src/app.js
          ! grep -Fq "const recommend=event.target.closest('[data-recommend-mode]')" src/app.js
          grep -Fq "toast(prompt, 'recommendation')" src/app.js
          ! grep -Fq 'toast(prompt || `已选：${beanDisplayName(selected)}`' src/app.js
          grep -Fq '1.24B-main.13-local-menu-prompt' index.html
          grep -Fq "APP_MODULE_REVISION = '1.24B-main.13-local-menu-prompt'" src/core/startup-controller.js
      - name: Commit source repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add src/app.js index.html src/core/startup-controller.js tests
          git diff --cached --quiet && exit 0
          git commit -m 'Make recommendation menu the canonical prompt owner'
          git push origin HEAD:main
