name: Restore legacy recommendation reminders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-legacy-recommendation-reminders.yml'

permissions:
  contents: write

concurrency:
  group: luckybean-restore-legacy-recommendation-reminders
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace only the recommendation reminder catalog and trigger adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/app.js')
          app = app_path.read_text()
          old_block = re.compile(
              r"const RECOMMENDATION_PROMPTS = Object\.freeze\(\{.*?\nfunction openRecommendMenu\(\) \{",
              re.S,
          )
          replacement = r'''const LEGACY_RECOMMENDATION_REMINDERS = Object.freeze({
            favorite: '喜好（咖啡得分）',
            stale: '赏味期（剩余越少越靠前）',
            price: '价格（越高越推荐）',
            lowWeight: '余粮（剩余越少越推荐）',
            randomDate: '点兵点将'
          });

          const CURRENT_TO_LEGACY_RECOMMENDATION_MODE = Object.freeze({
            leaderboard: 'favorite',
            freshness: 'stale',
            price: 'price',
            remaining: 'lowWeight',
            random: 'randomDate'
          });

          function normalizeRecommendationMode(mode) {
            const value = String(mode || '').trim();
            return Object.prototype.hasOwnProperty.call(CURRENT_TO_LEGACY_RECOMMENDATION_MODE, value) ? value : 'random';
          }

          function recommendationPrompt(mode, bean) {
            const currentMode = normalizeRecommendationMode(mode);
            const legacyMode = CURRENT_TO_LEGACY_RECOMMENDATION_MODE[currentMode];
            if (legacyMode === 'randomDate') {
              const variety = codeName('varieties', bean?.varietyCode, bean ? beanDisplayName(bean) : '');
              return `${LEGACY_RECOMMENDATION_REMINDERS.randomDate}→${variety}`;
            }
            return LEGACY_RECOMMENDATION_REMINDERS[legacyMode];
          }

          function openRecommendMenu() {'''
          app, count = old_block.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit(f'expected one recommendation prompt block, replaced {count}')
          app, count = re.subn(
              r"const prompt = recommendationPrompt\(mode\);",
              "const prompt = recommendationPrompt(mode, selected);",
              app,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one recommendationPrompt call, replaced {count}')
          for forbidden in [
              '直取榜首，不问其余。',
              '此只风味精绝，君既选中，甚是妥当。',
              '此只价冠诸豆，足见君之慧眼独钟。',
              '余粒无多，宜趁兴饮尽，为此豆作结。',
              '闭目拈签，任其自然。',
          ]:
              if forbidden in app:
                  raise SystemExit(f'old incorrect long prompt still present: {forbidden}')
          app_path.write_text(app)

          startup_path = Path('src/core/startup-controller.js')
          startup = startup_path.read_text()
          startup, count = re.subn(
              r"APP_MODULE_REVISION = '1\.24B-main\.13-local-menu-prompt'",
              "APP_MODULE_REVISION = '1.24B-main.14-legacy-reminders'",
              startup,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected startup app revision once, replaced {count}')
          startup_path.write_text(startup)

          index_path = Path('index.html')
          index = index_path.read_text()
          index, count = re.subn(
              r"startup-controller\.js\?v=1\.24B-main\.13-local-menu-prompt",
              "startup-controller.js?v=1.24B-main.14-legacy-reminders",
              index,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected startup URL once, replaced {count}')
          index_path.write_text(index)

          regression = Path('tests/v124b-recommendation-prompt-regression.mjs')
          regression.write_text(r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const index=fs.readFileSync('index.html','utf8');
          const app=fs.readFileSync('src/app.js','utf8');
          const guard=fs.readFileSync('src/features/release-1.24b-group-navigation.js','utf8');

          const legacyCatalog=[
            "favorite: '喜好（咖啡得分）'",
            "stale: '赏味期（剩余越少越靠前）'",
            "price: '价格（越高越推荐）'",
            "lowWeight: '余粮（剩余越少越推荐）'",
            "randomDate: '点兵点将'"
          ];
          for(const source of legacyCatalog) assert.ok(app.includes(source),`legacy reminder lost: ${source}`);

          const adapter=[
            "leaderboard: 'favorite'",
            "freshness: 'stale'",
            "price: 'price'",
            "remaining: 'lowWeight'",
            "random: 'randomDate'"
          ];
          for(const source of adapter) assert.ok(app.includes(source),`current-to-legacy reminder trigger lost: ${source}`);

          for(const forbidden of [
            '直取榜首，不问其余。',
            '此只风味精绝，君既选中，甚是妥当。',
            '此只价冠诸豆，足见君之慧眼独钟。',
            '余粒无多，宜趁兴饮尽，为此豆作结。',
            '闭目拈签，任其自然。'
          ]) assert.ok(!app.includes(forbidden),`incorrect replacement prompt must stay deleted: ${forbidden}`);

          assert.match(app,/const LEGACY_RECOMMENDATION_REMINDERS = Object\.freeze\(/);
          assert.match(app,/const CURRENT_TO_LEGACY_RECOMMENDATION_MODE = Object\.freeze\(/);
          assert.match(app,/function normalizeRecommendationMode\(mode\)/);
          assert.match(app,/function recommendationPrompt\(mode, bean\)/);
          assert.match(app,/mode = normalizeRecommendationMode\(mode\)/);
          assert.match(app,/const prompt = recommendationPrompt\(mode, selected\)/);
          assert.match(app,/toast\(prompt, 'recommendation'\)/);
          assert.match(app,/luckybean:recommendation-prompt/);
          assert.match(app,/popup\.addEventListener\('click', event => \{/);
          assert.match(app,/void recommendBean\(button\.dataset\.recommendMode\)/);
          assert.doesNotMatch(app,/const recommend=event\.target\.closest\('\[data-recommend-mode\]'\)/);
          assert.doesNotMatch(app,/toast\(prompt \|\| `已选：\$\{beanDisplayName\(selected\)\}`/);
          assert.match(app,/if \(kind === 'recommendation'\)/);

          assert.match(index,/startup-controller\.js\?v=1\.24B-main\.14-legacy-reminders/);
          assert.match(index,/release-1\.24b-group-navigation\.js\?v=1\.24B-main\.10-native-prompt/);
          assert.doesNotMatch(index,/body\[data-recommendation-prompt-revision\] #toast\.toast\.recommendation/);
          assert.doesNotMatch(index,/data-recommendation-prompt-revision=/);

          assert.doesNotMatch(guard,/RECOMMENDATION_PROMPTS|LEGACY_RECOMMENDATION_REMINDERS|lbRecommendationToast|showRecommendationPromptForMode|MutationObserver|directPromptLockUntil/,
            'group-navigation adapter must not own, mirror, hide, or duplicate recommendation reminders');
          assert.match(guard,/\.recommend-menu \[data-recommend-mode="price"\] \.recommend-dot\{background:#fff!important;\}/);
          assert.match(guard,/html\[data-theme="light"\] \.recommend-menu \[data-recommend-mode="price"\] \.recommend-dot\{background:#000!important;\}/);
          assert.match(guard,/LuckyBeanBeanGroupState/);
          assert.doesNotMatch(guard,/function recommendBean|filteredBeans\(|recommendationScore\(/,'group-navigation adapter must not alter selection algorithms');

          console.log('LuckyBean legacy reminder contract passed: old short reminder semantics are mapped onto current selection modes; selection/grouping algorithms remain untouched');
          '''.replace(/^          /gm,''))

          spec_path = Path('tests/v124b-selection-mode-single-group.spec.mjs')
          spec = spec_path.read_text()
          spec, count = re.subn(
              r"const FRESHNESS_PROMPTS=\[.*?\];",
              "const FRESHNESS_PROMPT='赏味期（剩余越少越靠前）';",
              spec,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected freshness prompt fixture once, replaced {count}')
          spec, count = re.subn(
              r"expect\(FRESHNESS_PROMPTS\)\.toContain\(promptText\);",
              "expect(promptText).toBe(FRESHNESS_PROMPT);",
              spec,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected freshness prompt assertion once, replaced {count}')
          spec_path.write_text(spec)
          PY
      - name: Validate reminder-only change
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/core/startup-controller.js
          node tests/v124b-recommendation-prompt-regression.mjs
          ! grep -R -F '直取榜首，不问其余。' src tests --exclude-dir=node_modules
          ! grep -R -F '此只风味精绝，君既选中，甚是妥当。' src tests --exclude-dir=node_modules
          git diff --check
      - name: Commit reminder compatibility adapter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/core/startup-controller.js index.html tests/v124b-recommendation-prompt-regression.mjs tests/v124b-selection-mode-single-group.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Restore legacy recommendation reminders without selection rollback'
          git push origin HEAD:main
