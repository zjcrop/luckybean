name: Restore legacy recommendation reminders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-legacy-recommendation-reminders.yml'

permissions:
  contents: write

concurrency:
  group: luckybean-restore-legacy-recommendation-reminders
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace only reminder catalog and trigger adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/app.js')
          app = app_path.read_text()
          pattern = re.compile(
              r"const RECOMMENDATION_PROMPTS = Object\.freeze\(\{.*?\nfunction openRecommendMenu\(\) \{",
              re.S,
          )
          replacement = '''const LEGACY_RECOMMENDATION_REMINDERS = Object.freeze({
            favorite: '喜好（咖啡得分）',
            stale: '赏味期（剩余越少越靠前）',
            price: '价格（越高越推荐）',
            lowWeight: '余粮（剩余越少越推荐）',
            randomDate: '点兵点将'
          });

          const CURRENT_TO_LEGACY_RECOMMENDATION_MODE = Object.freeze({
            leaderboard: 'favorite',
            freshness: 'stale',
            price: 'price',
            remaining: 'lowWeight',
            random: 'randomDate'
          });

          function normalizeRecommendationMode(mode) {
            const value = String(mode || '').trim();
            return Object.prototype.hasOwnProperty.call(CURRENT_TO_LEGACY_RECOMMENDATION_MODE, value) ? value : 'random';
          }

          function recommendationPrompt(mode, bean) {
            const currentMode = normalizeRecommendationMode(mode);
            const legacyMode = CURRENT_TO_LEGACY_RECOMMENDATION_MODE[currentMode];
            if (legacyMode === 'randomDate') {
              const variety = codeName('varieties', bean?.varietyCode, bean ? beanDisplayName(bean) : '');
              return `${LEGACY_RECOMMENDATION_REMINDERS.randomDate}→${variety}`;
            }
            return LEGACY_RECOMMENDATION_REMINDERS[legacyMode];
          }

          function openRecommendMenu() {'''
          app, count = pattern.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit(f'expected one prompt catalog block, replaced {count}')
          app, count = re.subn(
              r"const prompt = recommendationPrompt\(mode\);",
              "const prompt = recommendationPrompt(mode, selected);",
              app,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one prompt call, replaced {count}')
          app_path.write_text(app)

          startup_path = Path('src/core/startup-controller.js')
          startup = startup_path.read_text()
          startup, count = re.subn(
              r"APP_MODULE_REVISION = '1\.24B-main\.13-local-menu-prompt'",
              "APP_MODULE_REVISION = '1.24B-main.14-legacy-reminders'",
              startup,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected startup revision once, replaced {count}')
          startup_path.write_text(startup)

          index_path = Path('index.html')
          index = index_path.read_text()
          index, count = re.subn(
              r"startup-controller\.js\?v=1\.24B-main\.13-local-menu-prompt",
              "startup-controller.js?v=1.24B-main.14-legacy-reminders",
              index,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected startup URL once, replaced {count}')
          index_path.write_text(index)

          regression_path = Path('tests/v124b-recommendation-prompt-regression.mjs')
          regression = regression_path.read_text()
          regression, count = re.subn(
              r"for\(const mode of \['leaderboard','freshness','price','remaining','random'\]\)\{.*?\n\]\) assert\.ok\(app\.includes\(sentence\),`application prompt library lost sentence: \$\{sentence\}`\);",
              '''const legacyCatalog=[
            "favorite: '喜好（咖啡得分）'",
            "stale: '赏味期（剩余越少越靠前）'",
            "price: '价格（越高越推荐）'",
            "lowWeight: '余粮（剩余越少越推荐）'",
            "randomDate: '点兵点将'"
          ];
          for(const source of legacyCatalog) assert.ok(app.includes(source),`legacy reminder lost: ${source}`);
          const triggerAdapter=[
            "leaderboard: 'favorite'",
            "freshness: 'stale'",
            "price: 'price'",
            "remaining: 'lowWeight'",
            "random: 'randomDate'"
          ];
          for(const source of triggerAdapter) assert.ok(app.includes(source),`current-to-legacy trigger lost: ${source}`);
          for(const forbidden of ['直取榜首，不问其余。','此只风味精绝，君既选中，甚是妥当。','此只价冠诸豆，足见君之慧眼独钟。','余粒无多，宜趁兴饮尽，为此豆作结。','闭目拈签，任其自然。']) assert.ok(!app.includes(forbidden),`incorrect long prompt remains: ${forbidden}`);''',
              regression,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one old prompt regression block, replaced {count}')
          regression = regression.replace(
              "assert.match(app,/function recommendationPrompt\\(mode\\)/);",
              "assert.match(app,/function recommendationPrompt\\(mode, bean\\)/);\nassert.match(app,/const prompt = recommendationPrompt\\(mode, selected\\)/);",
          )
          regression = regression.replace(
              "console.log('LuckyBean recommendation prompt contract passed: app.js exclusively owns the original fun prompt library; duplicate prompt layer removed; grouping and theme adapters remain isolated');",
              "console.log('LuckyBean legacy reminder contract passed: current modes map to the recovered short reminder semantics; grouping and selection algorithms remain isolated');",
          )
          regression_path.write_text(regression)

          spec_path = Path('tests/v124b-selection-mode-single-group.spec.mjs')
          spec = spec_path.read_text()
          spec, count = re.subn(
              r"const FRESHNESS_PROMPTS=\[.*?\];",
              "const FRESHNESS_PROMPT='赏味期（剩余越少越靠前）';",
              spec,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected freshness fixture once, replaced {count}')
          spec, count = re.subn(
              r"expect\(FRESHNESS_PROMPTS\)\.toContain\(promptText\);",
              "expect(promptText).toBe(FRESHNESS_PROMPT);",
              spec,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected freshness assertion once, replaced {count}')
          spec_path.write_text(spec)
          PY
      - name: Validate reminder-only change
        shell: bash
        run: |
          set -euo pipefail
          node --check src/app.js
          node --check src/core/startup-controller.js
          node tests/v124b-recommendation-prompt-regression.mjs
          grep -Fq "leaderboard: 'favorite'" src/app.js
          grep -Fq "freshness: 'stale'" src/app.js
          grep -Fq "random: 'randomDate'" src/app.js
          grep -Fq '点兵点将→${variety}' src/app.js
          ! grep -Fq 'const RECOMMENDATION_PROMPTS' src/app.js
          ! grep -Fq '直取榜首，不问其余。' src/app.js
          ! grep -Fq '此只风味精绝，君既选中，甚是妥当。' src/app.js
          git diff --check
      - name: Commit reminder compatibility adapter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js src/core/startup-controller.js index.html tests/v124b-recommendation-prompt-regression.mjs tests/v124b-selection-mode-single-group.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Restore legacy recommendation reminders without selection rollback'
          git push origin HEAD:main
