name: Retry LuckyBean v1.2.2 cloud safety build

on:
  push:
    branches:
      - fix/v122-cloud-safety
    paths:
      - .github/workflows/retry-v122-cloud-safety.yml

permissions:
  contents: write
  actions: write

jobs:
  correct-and-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v122-cloud-safety
          fetch-depth: 0

      - name: Verify corrected version-sensitive assertions
        run: |
          grep -F "body:\\s*(?:prepared\\.)?changedRows" tests/v110-local-first-sync-static.mjs
          grep -F "CACHE_PREFIX = 'luckybean-v122-cloud-safety-test-'" tests/v110-local-first-sync-static.mjs
          grep -F "'luckybean-v121-account-test-'" tests/v110-local-first-sync-static.mjs

      - name: Dispatch full verification and APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-build-v122-cloud-safety.yml --ref fix/v122-cloud-safety
