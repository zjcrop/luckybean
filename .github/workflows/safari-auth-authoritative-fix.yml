name: Safari auth authoritative fix

on:
  push:
    branches:
      - perf/local-first-data-v2-20260906
    paths:
      - .github/workflows/safari-auth-authoritative-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/local-first-data-v2-20260906
      - name: Patch callback authority and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('src/services/cloud-auth-service.js')
          auth = auth_path.read_text()
          anchor = "function accessTokenValid(active, skewSeconds = 60) { return Number(decodeJwtPayload(active?.access_token)?.exp || 0) > Math.floor(Date.now() / 1000) + skewSeconds; }\n"
          addition = anchor + "function callbackSessionAuthoritative(active = readSession()) {\n  return Boolean(callbackSessionAcceptedAt && Date.now() - callbackSessionAcceptedAt < CALLBACK_SESSION_GRACE_MS && active?.access_token && active?.refresh_token);\n}\n"
          if 'function callbackSessionAuthoritative(' not in auth:
              if anchor not in auth:
                  raise SystemExit('access-token anchor missing')
              auth = auth.replace(anchor, addition, 1)
          old = "async function getAccessToken({ forceRefresh = false } = {}) {\n  const active = readSession(); if (!forceRefresh && accessTokenValid(active)) return active.access_token;\n  const refreshed = await refreshSession({ force:true, reason:'api-request' }); return refreshed?.access_token || '';\n}"
          new = "async function getAccessToken({ forceRefresh = false } = {}) {\n  const active = readSession();\n  // A freshly issued callback token is authoritative for this startup even when Safari\n  // cannot persist storage or decode the JWT locally. Only a real API 401 may force refresh.\n  if (!forceRefresh && (callbackSessionAuthoritative(active) || accessTokenValid(active))) return active.access_token;\n  const refreshed = await refreshSession({ force:true, reason:'api-request' }); return refreshed?.access_token || '';\n}"
          if old not in auth:
              raise SystemExit('getAccessToken anchor missing')
          auth = auth.replace(old, new, 1)
          auth = auth.replace("revision:'cloud-auth-service-v8-callback-session-seed'", "revision:'cloud-auth-service-v9-callback-authoritative-startup'", 1)
          auth_path.write_text(auth)

          for name in ['tests/v124p-startup-auth-hotfix-static.mjs', 'tests/v124p-auth-ocr-ai-hotfix-static.mjs']:
              p = Path(name)
              text = p.read_text().replace('cloud-auth-service-v8-callback-session-seed', 'cloud-auth-service-v9-callback-authoritative-startup')
              p.write_text(text)

          p = Path('tests/v124p-startup-auth-hotfix-static.mjs')
          text = p.read_text()
          marker = "assert.match(auth, /void warmSession\\(\\)\\.catch/, 'callback consumption must begin immediately instead of waiting for a later microtask');\n"
          insert = marker + "assert.match(auth, /function callbackSessionAuthoritative\\(/, 'fresh callback sessions must have an explicit startup authority guard');\nassert.match(auth, /!forceRefresh && \\(callbackSessionAuthoritative\\(active\\) \\|\\| accessTokenValid\\(active\\)\\)/, 'fresh callback access tokens must be used before any proactive refresh');\n"
          if 'fresh callback sessions must have an explicit startup authority guard' not in text:
              if marker not in text:
                  raise SystemExit('startup static marker missing')
              text = text.replace(marker, insert, 1)
          p.write_text(text)

          p = Path('tests/v124p-auth-ocr-ai-hotfix-static.mjs')
          text = p.read_text()
          marker = "assert.match(auth,/void warmSession\\(\\)\\.catch/);\n"
          insert = marker + "assert.match(auth,/callbackSessionAuthoritative\\(active\\)/);\nassert.match(auth,/!forceRefresh && \\(callbackSessionAuthoritative\\(active\\) \\|\\| accessTokenValid\\(active\\)\\)/);\n"
          if 'assert.match(auth,/callbackSessionAuthoritative\\(active\\)/);' not in text:
              if marker not in text:
                  raise SystemExit('auth static marker missing')
              text = text.replace(marker, insert, 1)
          p.write_text(text)

          p = Path('tests/v124p-webkit-auth-ocr.spec.mjs')
          text = p.read_text()
          trace_block = "    globalThis.__LuckyBeanAuthTestTrace=[];\n    document.addEventListener('luckybean:cloud-auth-state',event=>{\n      const active=globalThis.LuckyBeanCloudAuth?.getSession?.();\n      globalThis.__LuckyBeanAuthTestTrace.push({\n        state:event.detail?.state||'',\n        authAction:event.detail?.authAction||'',\n        hasRefresh:Boolean(active?.refresh_token),\n        hasUser:Boolean(active?.user?.id),\n        snapshot:document.documentElement.dataset.authCallbackSnapshot||'',\n        storage:document.documentElement.dataset.cloudStorage||'',\n        hashPresent:Boolean(location.hash)\n      });\n    });\n"
          text = text.replace(trace_block, '', 1)
          diag_block = "  const diagnostics=await page.evaluate(()=>({\n    snapshot:document.documentElement.dataset.authCallbackSnapshot||'',\n    auth:document.documentElement.dataset.cloudAuth||'',\n    storage:document.documentElement.dataset.cloudStorage||'',\n    hashPresent:Boolean(location.hash),\n    revision:globalThis.LuckyBeanCloudAuth?.revision||'',\n    hasRefresh:Boolean(globalThis.LuckyBeanCloudAuth?.getSession?.()?.refresh_token),\n    hasUser:Boolean(globalThis.LuckyBeanCloudAuth?.getSession?.()?.user?.id),\n    authResources:performance.getEntriesByType('resource').filter(item=>item.name.includes('cloud-auth-service.js')).map(item=>item.name),\n    trace:globalThis.__LuckyBeanAuthTestTrace||[]\n  }));\n  console.log('WEBKIT_AUTH_DIAGNOSTICS',JSON.stringify(diagnostics));\n"
          text = text.replace(diag_block, '', 1)
          if "let refreshCalls=0;" not in text:
              text = text.replace("test('email verification callback survives Safari-style storage failure',async({page})=>{\n", "test('email verification callback survives Safari-style storage failure',async({page})=>{\n  let refreshCalls=0;\n", 1)
              text = text.replace("    if(url.pathname==='/auth/v1/user'){\n", "    if(url.pathname==='/auth/v1/user'){\n", 1)
              target = "      return;\n    }\n    await route.fulfill({status:200,contentType:'application/json',body:'{}'});\n"
              replacement = "      return;\n    }\n    if(url.pathname==='/auth/v1/token'){\n      refreshCalls+=1;\n      await route.fulfill({status:200,contentType:'application/json',body:'{}'});\n      return;\n    }\n    await route.fulfill({status:200,contentType:'application/json',body:'{}'});\n"
              if target not in text:
                  raise SystemExit('webkit route marker missing')
              text = text.replace(target, replacement, 1)
              text = text.replace("  expect(state.email).toBe('webkit@example.com');\n", "  expect(state.email).toBe('webkit@example.com');\n  expect(refreshCalls).toBe(0);\n", 1)
          p.write_text(text)
          PY
      - name: Validate focused tests
        run: |
          node tests/v124p-startup-auth-hotfix-static.mjs
          node tests/v124p-auth-ocr-ai-hotfix-static.mjs
          node --check src/services/cloud-auth-service.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/cloud-auth-service.js tests/v124p-startup-auth-hotfix-static.mjs tests/v124p-auth-ocr-ai-hotfix-static.mjs tests/v124p-webkit-auth-ocr.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep Safari callback session authoritative"
          git push origin HEAD:perf/local-first-data-v2-20260906
