name: Safari Android auth refresh parity fix

on:
  push:
    branches:
      - perf/local-first-data-v2-20260906
    paths:
      - .github/workflows/safari-refresh-parity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/local-first-data-v2-20260906
      - name: Patch unified refresh semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/cloud-auth-service.js')
          s = p.read_text()

          old = "    if (!force && accessTokenValid(active)) { emit('authenticated', { user:active.user, cached:true }); return active; }"
          new = "    const forcedByApi401 = force && reason === 'api-401';\n    if (accessTokenValid(active) && !forcedByApi401) {\n      emit('authenticated', { user:active.user, cached:true, authAction:callbackSessionAuthoritative(active) ? 'email-callback' : 'session-resume' });\n      return active;\n    }"
          if old not in s:
              raise SystemExit('refreshSession validity anchor missing')
          s = s.replace(old, new, 1)

          old = "  const refreshed = await refreshSession({ force:true, reason:'api-request' }); return refreshed?.access_token || '';"
          new = "  const refreshed = await refreshSession({ force:true, reason:forceRefresh ? 'api-401' : 'token-expired' }); return refreshed?.access_token || '';"
          if old not in s:
              raise SystemExit('getAccessToken refresh anchor missing')
          s = s.replace(old, new, 1)

          old = "  return refreshSession({ force:true, reason:'startup' });"
          new = "  return refreshSession({ force:false, reason:'startup' });"
          if old not in s:
              raise SystemExit('warmSession startup anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace("revision:'cloud-auth-service-v9-callback-authoritative-startup'", "revision:'cloud-auth-service-v10-parity-refresh-semantics'", 1)
          p.write_text(s)

          for name in ['tests/v124p-startup-auth-hotfix-static.mjs', 'tests/v124p-auth-ocr-ai-hotfix-static.mjs']:
              q = Path(name)
              t = q.read_text().replace('cloud-auth-service-v9-callback-authoritative-startup', 'cloud-auth-service-v10-parity-refresh-semantics')
              q.write_text(t)

          q = Path('tests/v124p-startup-auth-hotfix-static.mjs')
          t = q.read_text()
          marker = "assert.match(auth, /Math\\.max\\(jwtExpiresAt, sessionExpiresAt\\)/, 'JWT exp and session expires_at must share one token-validity contract');\n"
          extra = marker + "assert.match(auth, /forcedByApi401 = force && reason === 'api-401'/, 'only a confirmed API 401 may bypass a still-valid session');\nassert.match(auth, /accessTokenValid\\(active\\) && !forcedByApi401/, 'startup/background refresh must preserve a valid session');\nassert.match(auth, /refreshSession\\(\{ force:false, reason:'startup' \}\)/, 'startup must not force-refresh an otherwise valid Android or Safari session');\nassert.match(auth, /reason:forceRefresh \? 'api-401' : 'token-expired'/, 'forced token refresh must be attributable to an API 401');\n"
          if 'only a confirmed API 401 may bypass a still-valid session' not in t:
              if marker not in t:
                  raise SystemExit('startup static insertion marker missing')
              t = t.replace(marker, extra, 1)
          q.write_text(t)

          q = Path('tests/v124p-auth-ocr-ai-hotfix-static.mjs')
          t = q.read_text()
          marker = "assert.match(auth,/!forceRefresh && \\(callbackSessionAuthoritative\\(active\\) \\|\\| accessTokenValid\\(active\\)\\)/);\n"
          extra = marker + "assert.match(auth,/forcedByApi401 = force && reason === 'api-401'/);\nassert.match(auth,/refreshSession\\(\{ force:false, reason:'startup' \}\)/);\n"
          if "forcedByApi401 = force && reason === 'api-401'" not in t:
              if marker not in t:
                  raise SystemExit('auth static insertion marker missing')
              t = t.replace(marker, extra, 1)
          q.write_text(t)

          q = Path('tests/v124p-webkit-auth-ocr.spec.mjs')
          t = q.read_text()
          old = "  expect(state.hash).toBe('');\n  expect(state.auth).toBe('authenticated');\n  expect(state.storage).toBe('volatile');\n  expect(state.email).toBe('webkit@example.com');\n  expect(refreshCalls).toBe(0);"
          new = "  expect(refreshCalls).toBe(0);\n  expect(state.hash).toBe('');\n  expect(state.auth).toBe('authenticated');\n  expect(state.storage).toBe('volatile');\n  expect(state.email).toBe('webkit@example.com');"
          if old in t:
              t = t.replace(old, new, 1)
          q.write_text(t)
          PY
      - name: Validate focused auth contracts
        run: |
          node --check src/services/cloud-auth-service.js
          node tests/v124p-startup-auth-hotfix-static.mjs
          node tests/v124p-auth-ocr-ai-hotfix-static.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/cloud-auth-service.js tests/v124p-startup-auth-hotfix-static.mjs tests/v124p-auth-ocr-ai-hotfix-static.mjs tests/v124p-webkit-auth-ocr.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Safari and Android auth refresh semantics"
          git push origin HEAD:perf/local-first-data-v2-20260906
