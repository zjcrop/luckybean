name: Safari session expiry fallback fix

on:
  push:
    branches:
      - perf/local-first-data-v2-20260906
    paths:
      - .github/workflows/safari-session-expiry-fallback-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: perf/local-first-data-v2-20260906
      - name: Patch expiry fallback and regression guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path('src/services/cloud-auth-service.js')
          auth = auth_path.read_text()
          old = "function accessTokenValid(active, skewSeconds = 60) { return Number(decodeJwtPayload(active?.access_token)?.exp || 0) > Math.floor(Date.now() / 1000) + skewSeconds; }"
          new = "function accessTokenValid(active, skewSeconds = 60) {\n  const jwtExpiresAt = Number(decodeJwtPayload(active?.access_token)?.exp || 0);\n  const sessionExpiresAt = Number(active?.expires_at || 0);\n  return Math.max(jwtExpiresAt, sessionExpiresAt) > Math.floor(Date.now() / 1000) + skewSeconds;\n}"
          if old not in auth:
              raise SystemExit('accessTokenValid anchor missing')
          auth = auth.replace(old, new, 1)
          auth_path.write_text(auth)

          test_path = Path('tests/v124p-startup-auth-hotfix-static.mjs')
          test = test_path.read_text()
          marker = "assert.match(auth, /function callbackSessionAuthoritative\\(/, 'fresh callback sessions must have an explicit startup authority guard');\n"
          guard = marker + "assert.match(auth, /sessionExpiresAt = Number\\(active\\?\\.expires_at \\|\\| 0\\)/, 'session expires_at must backstop local JWT decoding on Safari');\nassert.match(auth, /Math\\.max\\(jwtExpiresAt, sessionExpiresAt\\)/, 'JWT exp and session expires_at must share one token-validity contract');\n"
          if 'session expires_at must backstop local JWT decoding on Safari' not in test:
              if marker not in test:
                  raise SystemExit('static test anchor missing')
              test = test.replace(marker, guard, 1)
          test_path.write_text(test)
          PY
      - name: Validate focused contract
        run: |
          node --check src/services/cloud-auth-service.js
          node tests/v124p-startup-auth-hotfix-static.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/cloud-auth-service.js tests/v124p-startup-auth-hotfix-static.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: use session expiry when Safari cannot decode token"
          git push origin HEAD:perf/local-first-data-v2-20260906
