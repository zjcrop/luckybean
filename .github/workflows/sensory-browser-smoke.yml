name: Verify sensory modes in browser

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'styles-v095*.css'
      - 'src/v095-sensory-*.js'
      - 'src/v095-ui.js'
      - 'tests/sensory-modes-smoke.py'
      - 'tests/v095-refine.test.mjs'
      - '.github/workflows/sensory-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static and unit tests
        id: static
        continue-on-error: true
        run: |
          npm test
          npm run check

      - name: Install browser test runtime
        id: install
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Verify three sensory modes in Chromium
        id: browser
        continue-on-error: true
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          python tests/sensory-modes-smoke.py 2>&1 | tee tests/sensory-browser-log.txt

      - name: Write verification status
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          result = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ['GITHUB_SHA'],
              'static_tests': os.environ.get('STATIC_OUTCOME', 'skipped'),
              'browser_runtime': os.environ.get('INSTALL_OUTCOME', 'skipped'),
              'sensory_browser_smoke': os.environ.get('BROWSER_OUTCOME', 'skipped'),
          }
          result['verified'] = all(result[key] == 'success' for key in ('static_tests', 'browser_runtime', 'sensory_browser_smoke'))
          with open('tests/sensory-browser-status.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit verification status and log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/sensory-browser-status.json
          test -f tests/sensory-browser-log.txt && git add tests/sensory-browser-log.txt || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record sensory browser verification [skip ci]'
            git push origin HEAD:main
          fi

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          test "$STATIC_OUTCOME" = success
          test "$INSTALL_OUTCOME" = success
          test "$BROWSER_OUTCOME" = success
