name: Verify sensory modes and OCR QR regressions

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'styles-v095*.css'
      - 'src/v095-sensory-*.js'
      - 'src/v095-ui.js'
      - 'src/qr.js'
      - 'src/qr-core.js'
      - 'src/v096-web-ocr.js'
      - 'src/v096-package-capture.js'
      - 'tests/sensory-modes-smoke.py'
      - 'tests/ocr-qr-regression-smoke.py'
      - 'tests/v096-ocr-qr-regression.test.mjs'
      - 'tests/v096-qr-postbrew.test.mjs'
      - 'tests/theme-light.test.mjs'
      - 'tests/v092.test.mjs'
      - 'tests/v093.test.mjs'
      - 'tests/v095.test.mjs'
      - 'tests/v095-refine.test.mjs'
      - '.github/workflows/sensory-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-browser-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static and unit tests
        id: static
        continue-on-error: true
        run: |
          npm test
          npm run check
          node --check src/qr.js
          node --check src/qr-core.js
          node --check src/v096-web-ocr.js
          node --check src/v096-package-capture.js

      - name: Install browser test runtime
        id: install
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Verify three sensory modes in Chromium
        id: sensory
        continue-on-error: true
        if: steps.install.outcome == 'success'
        run: python tests/sensory-modes-smoke.py

      - name: Verify real browser OCR and text-first QR decoding
        id: ocr
        continue-on-error: true
        if: steps.install.outcome == 'success'
        run: python tests/ocr-qr-regression-smoke.py

      - name: Write verification status
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SENSORY_OUTCOME: ${{ steps.sensory.outcome }}
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          source_sha = os.environ['GITHUB_SHA']
          static = os.environ.get('STATIC_OUTCOME', 'skipped')
          install = os.environ.get('INSTALL_OUTCOME', 'skipped')
          sensory = os.environ.get('SENSORY_OUTCOME', 'skipped')
          ocr = os.environ.get('OCR_OUTCOME', 'skipped')
          sensory_status = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': source_sha,
              'static_tests': static,
              'browser_runtime': install,
              'sensory_browser_smoke': sensory,
              'verified': static == install == sensory == 'success',
          }
          ocr_status = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': source_sha,
              'static_tests': static,
              'browser_runtime': install,
              'real_web_ocr_smoke': ocr,
              'qr_text_first_regression': static,
              'verified': static == install == ocr == 'success',
          }
          for path, value in (
              ('tests/sensory-browser-status.json', sensory_status),
              ('tests/ocr-qr-regression-status.json', ocr_status),
          ):
              with open(path, 'w', encoding='utf-8') as handle:
                  json.dump(value, handle, ensure_ascii=False, indent=2)
                  handle.write('\n')
          print(json.dumps({'sensory': sensory_status, 'ocr_qr': ocr_status}, ensure_ascii=False, indent=2))
          PY

      - name: Commit verification status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add tests/sensory-browser-status.json tests/ocr-qr-regression-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record sensory OCR and QR browser verification [skip ci]'
            git push origin HEAD:main
          fi

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SENSORY_OUTCOME: ${{ steps.sensory.outcome }}
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        run: |
          test "$STATIC_OUTCOME" = success
          test "$INSTALL_OUTCOME" = success
          test "$SENSORY_OUTCOME" = success
          test "$OCR_OUTCOME" = success
