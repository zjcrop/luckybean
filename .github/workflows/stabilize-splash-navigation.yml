name: Stabilize splash navigation test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-splash-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Replace direct navigation with race-safe helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/v120-requirements-ui.spec.mjs')
          text = path.read_text()
          old = "  await page.goto(`${BASE_URL}/?requirements-splash-preview-persisted=1`, { waitUntil: 'domcontentloaded' });"
          lines = [
              "  for (let attempt = 0; attempt < 3; attempt += 1) {",
              "    try {",
              "      await page.goto(`${BASE_URL}/?requirements-splash-preview-persisted=1`, { waitUntil: 'domcontentloaded' });",
              "      break;",
              "    } catch (error) {",
              "      const message = String(error?.message || error || '');",
              "      const navigationRace = /ERR_ABORTED|frame was detached/i.test(message);",
              "      if (!navigationRace || attempt === 2) throw error;",
              "      await page.waitForTimeout(250);",
              "      await page.waitForLoadState('domcontentloaded').catch(() => {});",
              "    }",
              "  }",
          ]
          new = '\n'.join(lines)
          if old not in text:
              raise SystemExit('target direct navigation not found')
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -Fq "navigationRace = /ERR_ABORTED|frame was detached/i.test(message);" tests/v120-requirements-ui.spec.mjs
          git config user.name 'LuckyBean CI Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/v120-requirements-ui.spec.mjs
          git commit -m 'test: stabilize persisted splash navigation race'
          git push origin HEAD:main
