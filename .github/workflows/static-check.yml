name: LuckyBean checks

on:
  push:
    branches:
      - test-v107-web
  pull_request:
    branches:
      - main
      - test-v107-web

permissions:
  contents: read

concurrency:
  group: luckybean-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static architecture checks
        run: npm run test:static

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
      - name: Run local-first startup smoke test
        run: npm run test:smoke
      - name: Run completed-history and spatial regression test
        run: npm run test:core
      - name: Capture visual baseline screenshots
        run: npm run test:visual
      - name: Upload visual baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-v1.2.0-test-visual-baseline
          path: test-results/visual-baseline/*.png
          if-no-files-found: warn
          retention-days: 14
