name: LuckyBean checks

on:
  push:
    branches:
      - test-v107-web
  pull_request:
    branches:
      - main
      - test-v107-web

permissions:
  contents: read

jobs:
  static-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static architecture checks
        run: npm run test:static

  browser-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
      - name: Run browser startup smoke test
        run: npm run test:smoke
