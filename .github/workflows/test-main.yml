name: LuckyBean main tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckybean-main-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - name: Audit production dependency boundary
        run: npm audit --omit=dev --audit-level=high
      - name: Check JavaScript syntax
        shell: bash
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm run test:static
      - name: Verify live BrewProfiles contract
        run: npm run test:live-brewprofiles
      - run: npx playwright install --with-deps chromium
      - name: Start web server
        shell: bash
        run: |
          python -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
          echo $! > /tmp/luckybean-http.pid
      - run: npm run test:smoke
      - run: npm run test:core
      - run: npm run test:visual
      - name: Record validated source
        shell: bash
        run: |
          mkdir -p validated-main
          printf 'source_sha=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > validated-main/VALIDATED_SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: luckybean-main-validated-${{ github.sha }}
          path: validated-main/
          if-no-files-found: error
      - name: Upload browser test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luckybean-main-browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            /tmp/luckybean-http.log
          if-no-files-found: ignore
