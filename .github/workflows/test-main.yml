name: LuckyBean main tests

# Main-gate touchpoint: canonical Web/APK source parity must pass before release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckybean-main-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - run: npm ci
      - name: Audit full dependency boundary
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        shell: bash
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Reject private keys and release secrets in source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInaE --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jar' --exclude='*.gradle' -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sb_secret_[A-Za-z0-9_-]{12,}' src public android contracts index.html sw.js styles.css; then
            echo 'Private key or server secret material found in source'
            exit 1
          fi
      - run: npm run test:static
      - name: Verify live BrewIon Coffee Foundation contract
        run: node tests/foundation-live-contract.mjs
      - name: Verify live BrewProfiles contract
        run: npm run test:live-brewprofiles
      - run: npx playwright install --with-deps chromium
      - name: Start web server and wait until ready
        shell: bash
        run: |
          python -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/luckybean-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              echo "Local web server ready on attempt $attempt"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Local web server exited before becoming ready"
              cat /tmp/luckybean-http.log
              exit 1
            fi
            sleep 1
          done
          echo "Local web server readiness timed out"
          cat /tmp/luckybean-http.log
          exit 1
      - run: npm run test:smoke
      - run: npm run test:core
      - run: npm run test:visual
      - name: Record validated source
        shell: bash
        run: |
          mkdir -p validated-main
          printf 'source_sha=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > validated-main/VALIDATED_SOURCE.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-validated-${{ github.sha }}
          path: validated-main/
          if-no-files-found: error
      - name: Upload browser test output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            /tmp/luckybean-http.log
          if-no-files-found: ignore

  android_debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'
      - name: Assemble Android debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify debug APK exists
        shell: bash
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
