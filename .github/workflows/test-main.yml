name: LuckyBean main tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckybean-main-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply staged small-brew refactor
        if: ${{ github.event_name == 'push' }}
        run: |
          python3 scripts/apply-small-brew-v5.py
          python3 scripts/apply-small-brew-v5-e2e.py
          python3 scripts/apply-small-brew-v5-e2e2.py
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - run: npm ci
      - name: Audit full dependency boundary
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        shell: bash
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm run test:static
      - name: Verify live BrewProfiles contract
        run: npm run test:live-brewprofiles
      - run: npx playwright install --with-deps chromium
      - name: Start web server and wait until ready
        shell: bash
        run: |
          python -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/luckybean-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              echo "Local web server ready on attempt $attempt"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Local web server exited before becoming ready"
              cat /tmp/luckybean-http.log
              exit 1
            fi
            sleep 1
          done
          echo "Local web server readiness timed out"
          cat /tmp/luckybean-http.log
          exit 1
      - run: npm run test:smoke
      - run: npm run test:core
      - run: npm run test:visual
      - name: Commit validated small-brew refactor
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No staged application changes to commit."
          else
            git config user.name 'zjcrop'
            git config user.email '127176814+zjcrop@users.noreply.github.com'
            git add src tests scripts/run-static-tests.mjs android/app/build.gradle .github/workflows/build-main.yml
            git commit -m 'feat: rebuild small-brew five-row workflow'
            git push origin HEAD:main
          fi
      - name: Record validated source
        shell: bash
        run: |
          mkdir -p validated-main
          printf 'source_sha=%s\nvalidated_at=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > validated-main/VALIDATED_SOURCE.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-validated-${{ github.sha }}
          path: validated-main/
          if-no-files-found: error
      - name: Upload browser test output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-main-browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            /tmp/luckybean-http.log
          if-no-files-found: ignore
