name: Update preflight UI regression contract

on:
  push:
    branches: [feature/harvest-season-field-20260815]
    paths:
      - '.github/workflows/update-preflight-ui-test.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/harvest-season-field-20260815
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/update_preflight_ui_test.py
      - name: Commit updated UI contract
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/update_preflight_ui_test.py .github/workflows/update-preflight-ui-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v120-requirements-ui.spec.mjs
          git commit -m 'Align recognition UI regression with preflight flow'
          git push origin HEAD:feature/harvest-season-field-20260815
