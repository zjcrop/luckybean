name: Validate recognition preflight branch

on:
  push:
    branches: [feature/harvest-season-field-20260815]
    paths:
      - '.github/workflows/validate-recognition-preflight.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/harvest-season-field-20260815
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Apply focused parser fix
        run: python tools/fix_labeled_roast_level.py
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm run test:static
      - run: npm run test:live-brewprofiles
      - run: npx playwright install --with-deps chromium
      - name: Start web server
        shell: bash
        run: |
          python -m http.server 4173 > /tmp/luckybean-http.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/luckybean-http.log
          exit 1
      - run: npm run test:core
      - run: npm run test:visual
      - name: Commit validated fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/fix_labeled_roast_level.py .github/workflows/validate-recognition-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/codebook.js test/harvest-multilingual-preflight.test.js tests/v120-requirements-ui.spec.mjs
          git commit -m 'Finalize recognition preflight normalization contract'
          git push origin HEAD:feature/harvest-season-field-20260815
