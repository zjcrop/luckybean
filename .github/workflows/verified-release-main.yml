name: LuckyBean verified signed release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-release-main.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: luckybean-verified-signed-release
  cancel-in-progress: true

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: v1.24B-main.6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2

      - name: Reuse validated unchanged product source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          test "$current_main" = "$RELEASE_SHA"
          PRODUCT_SHA=$(git rev-parse HEAD^)
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          git diff --quiet "$PRODUCT_SHA" "$RELEASE_SHA" -- . ':(exclude).github/workflows/verified-release-main.yml'
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test-main.yml/runs?branch=main&head_sha=$PRODUCT_SHA&per_page=10")
          status=$(printf '%s' "$runs" | jq -r --arg sha "$PRODUCT_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // "missing"')
          conclusion=$(printf '%s' "$runs" | jq -r --arg sha "$PRODUCT_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // "missing"')
          test "$status" = "completed"
          test "$conclusion" = "success"
          echo "Reusing successful full product validation from $PRODUCT_SHA; release commit changes workflow only."

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Restore official release keystore
        shell: bash
        env:
          LUCKYBEAN_KEYSTORE_B64: ${{ secrets.LUCKYBEAN_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$LUCKYBEAN_KEYSTORE_B64"
          printf '%s' "$LUCKYBEAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/luckybean-release.jks"
          chmod 600 "$RUNNER_TEMP/luckybean-release.jks"

      - name: Build signed APK now
        env:
          LUCKYBEAN_KEYSTORE_FILE: ${{ runner.temp }}/luckybean-release.jks
          LUCKYBEAN_STORE_PASSWORD: ${{ secrets.LUCKYBEAN_STORE_PASSWORD }}
          LUCKYBEAN_KEY_ALIAS: ${{ secrets.LUCKYBEAN_KEY_ALIAS }}
          LUCKYBEAN_KEY_PASSWORD: ${{ secrets.LUCKYBEAN_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease

      - name: Verify embedded source and official certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.luckybean.app' versionCode='102402' versionName='1.24B'"
          unzip -p "$apk" assets/web-cache/src/bean-groups-controller.js | grep -Fq '直取榜首，不问其余。'
          unzip -p "$apk" assets/web-cache/src/bean-groups-controller.js | grep -Fq '此只风味精绝，君既选中，甚是妥当。'
          unzip -p "$apk" assets/web-cache/src/bean-groups-controller.js | grep -Fq '闭目拈签，任其自然。'
          unzip -p "$apk" assets/web-cache/src/ui/recognition-review-owner-controller.js | grep -Fq "DIRECT_MANUAL_REVIEW_FIELDS = new Set(['countryCode'])"
          source_groups_sha=$(sha256sum src/bean-groups-controller.js | awk '{print $1}')
          apk_groups_sha=$(unzip -p "$apk" assets/web-cache/src/bean-groups-controller.js | sha256sum | awk '{print $1}')
          test "$source_groups_sha" = "$apk_groups_sha"
          source_owner_sha=$(sha256sum src/ui/recognition-review-owner-controller.js | awk '{print $1}')
          apk_owner_sha=$(unzip -p "$apk" assets/web-cache/src/ui/recognition-review-owner-controller.js | sha256sum | awk '{print $1}')
          test "$source_owner_sha" = "$apk_owner_sha"
          expected_cert=$(tr -d '[:space:]:' < android/signing/CERT_SHA256.txt | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"
          printf '%s' "$actual_cert" > /tmp/luckybean-cert-sha256.txt

      - name: Package formal release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/LuckyBean-1.24B-release.apk
          apk_sha=$(sha256sum dist/LuckyBean-1.24B-release.apk | awk '{print $1}')
          cert=$(cat /tmp/luckybean-cert-sha256.txt)
          printf 'release_sha=%s\nvalidated_product_sha=%s\napk_sha256=%s\ncertificate_sha256=%s\nmain_tests_verified=true\nproduct_source_unchanged=true\nfun_prompt_owner=bean-groups-controller\nrecognition_review_scope=isolated-country-only\n' "$RELEASE_SHA" "$PRODUCT_SHA" "$apk_sha" "$cert" > dist/BUILD_PROVENANCE.txt
          sha256sum dist/LuckyBean-1.24B-release.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-verified-v1.24B-${{ env.RELEASE_SHA }}
          path: dist/
          if-no-files-found: error

      - name: Publish verified signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='LuckyBean 1.24B signed release. Product source is byte-identical to the fully validated parent; APK embedded web source and official signing certificate are verified.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -f "$RELEASE_TAG" "$RELEASE_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --target "$RELEASE_SHA" --title "LuckyBean 1.24B" --notes "$notes"
            gh release upload "$RELEASE_TAG" dist/LuckyBean-1.24B-release.apk dist/BUILD_PROVENANCE.txt dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/LuckyBean-1.24B-release.apk dist/BUILD_PROVENANCE.txt dist/SHA256SUMS.txt --target "$RELEASE_SHA" --title "LuckyBean 1.24B" --notes "$notes"
          fi
          tag_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          test "$tag_sha" = "$RELEASE_SHA"
          echo "Verified signed release published for $RELEASE_SHA"
