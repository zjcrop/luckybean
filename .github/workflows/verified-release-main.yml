name: LuckyBean verified signed release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-release-main.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: luckybean-verified-signed-release
  cancel-in-progress: true

jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2

      - name: Load authoritative release metadata
        shell: bash
        run: |
          set -euo pipefail
          display_version=$(jq -r '.displayVersion' release.json)
          revision=$(jq -r '.revision' release.json)
          cache_revision=$(jq -r '.cacheRevision' release.json)
          android_version_code=$(jq -r '.androidVersionCode' release.json)
          release_tag=$(jq -r '.releaseTag' release.json)
          test -n "$display_version"
          test -n "$revision"
          test -n "$cache_revision"
          test -n "$android_version_code"
          test -n "$release_tag"
          test "$display_version" != "null"
          test "$revision" != "null"
          test "$cache_revision" != "null"
          test "$android_version_code" != "null"
          test "$release_tag" != "null"
          grep -Fq "content=\"$revision\"" index.html
          grep -Fq "data-release-revision=\"$revision\"" index.html
          grep -Fq "const REVISION = '$revision';" sw.js
          grep -Fq "\${CACHE_PREFIX}$cache_revision" sw.js
          echo "DISPLAY_VERSION=$display_version" >> "$GITHUB_ENV"
          echo "RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$android_version_code" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "APK_NAME=LuckyBean-${display_version}-release.apk" >> "$GITHUB_ENV"

      - name: Reuse validated product source and verify release-only delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          test "$current_main" = "$RELEASE_SHA"
          if [ "${{ github.event_name }}" = "push" ]; then
            PRODUCT_SHA=$(git rev-parse HEAD^1)
            changed=$(git diff --name-only "$PRODUCT_SHA" "$RELEASE_SHA" | LC_ALL=C sort)
            expected=$(printf '%s\n' \
              '.github/workflows/verified-release-main.yml' \
              'index.html' \
              'release.json' \
              'sw.js' | LC_ALL=C sort)
            test "$changed" = "$expected"
            git diff --quiet "$PRODUCT_SHA" "$RELEASE_SHA" -- . \
              ':(exclude).github/workflows/verified-release-main.yml' \
              ':(exclude)index.html' \
              ':(exclude)release.json' \
              ':(exclude)sw.js'
          else
            PRODUCT_SHA="$RELEASE_SHA"
          fi
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test-main.yml/runs?branch=main&head_sha=$PRODUCT_SHA&per_page=20")
          status=$(printf '%s' "$runs" | jq -r --arg sha "$PRODUCT_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // "missing"')
          conclusion=$(printf '%s' "$runs" | jq -r --arg sha "$PRODUCT_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // "missing"')
          test "$status" = "completed"
          test "$conclusion" = "success"
          echo "Reusing successful full product validation from $PRODUCT_SHA; current delta is restricted to release identity/cache metadata and signer workflow."

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.9'

      - name: Restore official release keystore
        shell: bash
        env:
          LUCKYBEAN_KEYSTORE_B64: ${{ secrets.LUCKYBEAN_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$LUCKYBEAN_KEYSTORE_B64"
          printf '%s' "$LUCKYBEAN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/luckybean-release.jks"
          chmod 600 "$RUNNER_TEMP/luckybean-release.jks"

      - name: Build signed release APK
        env:
          LUCKYBEAN_KEYSTORE_FILE: ${{ runner.temp }}/luckybean-release.jks
          LUCKYBEAN_STORE_PASSWORD: ${{ secrets.LUCKYBEAN_STORE_PASSWORD }}
          LUCKYBEAN_KEY_ALIAS: ${{ secrets.LUCKYBEAN_KEY_ALIAS }}
          LUCKYBEAN_KEY_PASSWORD: ${{ secrets.LUCKYBEAN_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease

      - name: Verify package identity, embedded source and official certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -q "package: name='com.luckybean.app' versionCode='$ANDROID_VERSION_CODE' versionName='$DISPLAY_VERSION'"

          compare_asset() {
            local source_path="$1"
            local apk_path="$2"
            local source_sha apk_sha
            source_sha=$(sha256sum "$source_path" | awk '{print $1}')
            apk_sha=$(unzip -p "$apk" "$apk_path" | sha256sum | awk '{print $1}')
            test "$source_sha" = "$apk_sha"
          }

          compare_asset release.json assets/web-cache/release.json
          compare_asset manifest.webmanifest assets/web-cache/manifest.webmanifest
          compare_asset sw.js assets/web-cache/sw.js
          compare_asset recognition-test.html assets/web-cache/recognition-test.html
          compare_asset android/native-bridge.js assets/web-cache/native-bridge.js

          while IFS= read -r file; do
            compare_asset "$file" "assets/web-cache/$file"
          done < <(find src public contracts -type f | LC_ALL=C sort)

          while IFS= read -r file; do
            rel=${file#./}
            compare_asset "$rel" "assets/web-cache/$rel"
          done < <(find . -maxdepth 1 -type f -name '*.css' | LC_ALL=C sort)

          unzip -p "$apk" assets/web-cache/index.html | grep -Fq '<script src="./native-bridge.js"></script>'
          unzip -p "$apk" assets/web-cache/index.html | grep -Fq "data-release-revision=\"$RELEASE_REVISION\""

          expected_cert=$(tr -d '[:space:]:' < android/signing/CERT_SHA256.txt | tr '[:lower:]' '[:upper:]')
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$actual_cert"
          test "$actual_cert" = "$expected_cert"
          printf '%s' "$actual_cert" > /tmp/luckybean-cert-sha256.txt

      - name: Package formal release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          apk_sha=$(sha256sum "dist/$APK_NAME" | awk '{print $1}')
          cert=$(cat /tmp/luckybean-cert-sha256.txt)
          printf 'release_sha=%s\nvalidated_product_sha=%s\ndisplay_version=%s\nrelease_revision=%s\nandroid_version_code=%s\nrelease_tag=%s\napk_sha256=%s\ncertificate_sha256=%s\nmain_tests_verified=true\nrelease_delta_restricted=true\nembedded_web_assets_verified=true\n' "$RELEASE_SHA" "$PRODUCT_SHA" "$DISPLAY_VERSION" "$RELEASE_REVISION" "$ANDROID_VERSION_CODE" "$RELEASE_TAG" "$apk_sha" "$cert" > dist/BUILD_PROVENANCE.txt
          sha256sum "dist/$APK_NAME" > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: luckybean-verified-${{ env.DISPLAY_VERSION }}-${{ env.RELEASE_REVISION }}-${{ env.RELEASE_SHA }}
          path: dist/
          if-no-files-found: error

      - name: Publish verified signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="LuckyBean $DISPLAY_VERSION formal signed release ($RELEASE_REVISION). Product source is unchanged from the fully validated main parent apart from release identity/cache metadata. APK package identity, embedded web assets and official signing certificate were verified during release."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -f "$RELEASE_TAG" "$RELEASE_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --target "$RELEASE_SHA" --title "LuckyBean $DISPLAY_VERSION" --notes "$notes"
            gh release upload "$RELEASE_TAG" "dist/$APK_NAME" dist/BUILD_PROVENANCE.txt dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$APK_NAME" dist/BUILD_PROVENANCE.txt dist/SHA256SUMS.txt --target "$RELEASE_SHA" --title "LuckyBean $DISPLAY_VERSION" --notes "$notes"
          fi
          tag_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          test "$tag_sha" = "$RELEASE_SHA"
          echo "Verified signed release published for $RELEASE_SHA as $RELEASE_TAG"
