plugins {
    id 'com.android.application'
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/luckybeanWebAssets')
def releaseStoreFile = System.getenv('LUCKYBEAN_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('LUCKYBEAN_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('LUCKYBEAN_KEY_ALIAS')
def releaseKeyPassword = System.getenv('LUCKYBEAN_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

tasks.register('syncLuckyBeanWebAssets') {
    inputs.files(
        new File(repositoryRoot, 'index.html'),
        new File(repositoryRoot, 'manifest.webmanifest'),
        new File(repositoryRoot, 'sw.js'),
        fileTree(repositoryRoot) { include '*.css' },
        fileTree(new File(repositoryRoot, 'src')),
        fileTree(new File(repositoryRoot, 'public')),
        fileTree(new File(repositoryRoot, 'contracts')),
        new File(repositoryRoot, 'android/native-bridge.js'),
        new File(repositoryRoot, 'recognition-test.html')
    )
    outputs.dir(generatedWebAssets)
    doLast {
        File output = generatedWebAssets.get().asFile
        delete output
        File webCache = new File(output, 'web-cache')
        copy {
            from(repositoryRoot) {
                include 'index.html', 'recognition-test.html', '*.css', 'manifest.webmanifest', 'sw.js'
                include 'src/**', 'public/**', 'contracts/**'
            }
            into webCache
        }
        copy {
            from(new File(repositoryRoot, 'android/native-bridge.js'))
            into webCache
        }
        File indexFile = new File(webCache, 'index.html')
        String indexHtml = indexFile.getText('UTF-8')
        def moduleMatcher = (indexHtml =~ /<script type="module" src="\.\/src\/(?:app\.js|core\/startup-controller\.js)(?:\?v=[^"]+)?"><\/script>/)
        if (!moduleMatcher.find()) throw new GradleException('未找到应用模块入口，Android资产同步中止。')
        String moduleTag = moduleMatcher.group(0)
        indexFile.write(indexHtml.replace(moduleTag, '<script src="./native-bridge.js"></script>\n  ' + moduleTag), 'UTF-8')
        // app.js is copied byte-for-byte. Platform branching lives in canonical src/app.js so
        // Web and APK execute the same source and release SHA parity is meaningful.
    }
}

android {
    namespace 'com.luckybean.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.luckybean.app'
        minSdk 26
        targetSdk 35
        versionCode 102322
        versionName '1.23E'
    }
    sourceSets { main.assets.srcDir(generatedWebAssets) }
    signingConfigs {
        if (hasReleaseSigning) {
            luckyBeanRelease {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug { }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.luckyBeanRelease
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        alpha {
            initWith release
            if (hasReleaseSigning) signingConfig signingConfigs.luckyBeanRelease
            debuggable false
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}

tasks.named('preBuild').configure { dependsOn tasks.named('syncLuckyBeanWebAssets') }

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
}
