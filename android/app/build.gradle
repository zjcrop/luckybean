plugins {
    id 'com.android.application'
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/luckybeanWebAssets')
def geckoVersion = '152.0.20260713164047'
def roomVersion = '2.8.4'
def workVersion = '2.11.2'
def cameraVersion = '1.6.1'

tasks.register('syncLuckyBeanWebAssets') {
    inputs.files(
        new File(repositoryRoot, 'index.html'),
        new File(repositoryRoot, 'manifest.webmanifest'),
        new File(repositoryRoot, 'sw.js'),
        fileTree(repositoryRoot) { include '*.css' },
        fileTree(new File(repositoryRoot, 'core-v2')),
        fileTree(new File(repositoryRoot, 'src')),
        fileTree(new File(repositoryRoot, 'public')),
        fileTree(new File(rootProject.projectDir, 'migration'))
    )
    outputs.dir(generatedWebAssets)

    doLast {
        File output = generatedWebAssets.get().asFile
        File extensionRoot = new File(output, 'luckybean-extension')
        delete output

        copy {
            from(repositoryRoot) {
                include 'index.html', '*.css', 'manifest.webmanifest', 'sw.js'
                include 'core-v2/**', 'src/**', 'public/**'
            }
            into extensionRoot
        }

        copy {
            from(new File(rootProject.projectDir, 'migration'))
            into new File(output, 'migration')
        }

        File extensionManifest = new File(extensionRoot, 'manifest.json')
        extensionManifest.write('''{
  "manifest_version": 2,
  "name": "LuckyBean Core v2",
  "version": "2.0.0",
  "description": "LuckyBean trusted local application shell",
  "browser_specific_settings": {
    "gecko": {
      "id": "core-v2@luckybean.local"
    }
  },
  "permissions": [
    "nativeMessaging",
    "geckoViewAddons"
  ]
}
''', 'UTF-8')

        File coreIndex = new File(extensionRoot, 'core-v2/index.html')
        if (!coreIndex.isFile()) throw new GradleException('Core v2 入口缺失，Android资产同步中止。')
        File coreApp = new File(extensionRoot, 'core-v2/app.js')
        if (!coreApp.isFile()) throw new GradleException('Core v2 应用模块缺失，Android资产同步中止。')
        if (!coreApp.getText('UTF-8').contains("./native-bridge-loader.js")) {
            throw new GradleException('Core v2 未加载受信任原生消息桥。')
        }
    }
}

android {
    namespace 'com.luckybean.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.luckybean.app'
        minSdk 26
        targetSdk 35
        versionCode 200001
        versionName '2.0.0-alpha.1'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    'room.schemaLocation': "$projectDir/schemas".toString(),
                    'room.incremental': 'true',
                    'room.expandProjection': 'true'
                ]
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir(generatedWebAssets)
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        alpha {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:${geckoVersion}"

    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.annotation:annotation:1.10.0'

    implementation "androidx.room:room-runtime:${roomVersion}"
    annotationProcessor "androidx.room:room-compiler:${roomVersion}"

    implementation "androidx.work:work-runtime:${workVersion}"

    implementation "androidx.camera:camera-core:${cameraVersion}"
    implementation "androidx.camera:camera-camera2:${cameraVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraVersion}"
    implementation "androidx.camera:camera-view:${cameraVersion}"

    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncLuckyBeanWebAssets')
}
