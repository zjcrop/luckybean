plugins {
    id 'com.android.application'
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/luckybeanWebAssets')

tasks.register('syncLuckyBeanWebAssets') {
    inputs.files(
        new File(repositoryRoot, 'index.html'),
        new File(repositoryRoot, 'manifest.webmanifest'),
        new File(repositoryRoot, 'sw.js'),
        fileTree(repositoryRoot) { include '*.css' },
        fileTree(new File(repositoryRoot, 'src')),
        fileTree(new File(repositoryRoot, 'public')),
        fileTree(new File(repositoryRoot, 'contracts')),
        new File(repositoryRoot, 'android/native-bridge.js'),
        new File(repositoryRoot, 'recognition-test.html')
    )
    outputs.dir(generatedWebAssets)
    doLast {
        File output = generatedWebAssets.get().asFile
        delete output
        File webCache = new File(output, 'web-cache')
        copy {
            from(repositoryRoot) {
                include 'index.html', 'recognition-test.html', '*.css', 'manifest.webmanifest', 'sw.js'
                include 'src/**', 'public/**', 'contracts/**'
            }
            into webCache
        }

        copy {
            from(new File(repositoryRoot, 'android/native-bridge.js'))
            into webCache
        }

        File indexFile = new File(webCache, 'index.html')
        String indexHtml = indexFile.getText('UTF-8')
        def moduleMatcher = (indexHtml =~ /<script type="module" src="\.\/src\/(?:app\.js|core\/startup-controller\.js)(?:\?v=[^"]+)?"><\/script>/)
        if (!moduleMatcher.find()) {
            throw new GradleException('未找到应用模块入口，Android资产同步中止。')
        }
        String moduleTag = moduleMatcher.group(0)
        indexFile.write(indexHtml.replace(moduleTag, '<script src="./native-bridge.js"></script>\n  ' + moduleTag), 'UTF-8')

        File appScript = new File(webCache, 'src/app.js')
        String original = appScript.getText('UTF-8')
        String shareTarget = 'const link = `${location.origin}${location.pathname}#share=${encoded}`;'
        String shareReplacement = 'const shareBase = globalThis.__LUCKYBEAN_PUBLIC_URL__ || `${location.origin}${location.pathname}`; const link = `${shareBase}#share=${encoded}`;'
        if (original.contains(shareTarget)) {
            original = original.replace(shareTarget, shareReplacement)
        } else if (!original.contains('__LUCKYBEAN_PUBLIC_URL__')) {
            throw new GradleException('未找到分享链接生成语句，Android资产同步中止。')
        }

        String stopSpeechTarget = 'function stopSpeech() { if (globalThis.speechSynthesis) speechSynthesis.cancel(); }'
        String stopSpeechReplacement = 'function stopSpeech() { if (globalThis.__LUCKYBEAN_ANDROID__) return; if (globalThis.speechSynthesis) speechSynthesis.cancel(); }'
        String speakTarget = "function speak(text) {\n  if (!globalThis.speechSynthesis || !text) return;"
        String speakReplacement = "function speak(text) {\n  if (globalThis.__LUCKYBEAN_ANDROID__ || !globalThis.speechSynthesis || !text) return;"
        if (!original.contains(stopSpeechTarget) || !original.contains(speakTarget)) {
            throw new GradleException('未找到网页语音入口，Android语音隔离中止。')
        }
        original = original.replace(stopSpeechTarget, stopSpeechReplacement).replace(speakTarget, speakReplacement)
        appScript.write(original, 'UTF-8')
    }
}

android {
    namespace 'com.luckybean.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luckybean.app'
        minSdk 26
        targetSdk 35
        versionCode 102305
        versionName '1.23E'
    }

    sourceSets {
        main.assets.srcDir(generatedWebAssets)
    }

    buildTypes {
        debug {
            
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        alpha {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncLuckyBeanWebAssets')
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
}
